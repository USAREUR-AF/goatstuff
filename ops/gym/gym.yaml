- id: deploy-and-rollback
  title: Deploy, and the ledger that makes rollback possible
  level: working
  minutes: 25
  quirks:
  - claim: '`rollback.sh` reads the LEDGER. A copy of a service deployed to a host the ledger does not
      declare is invisible to rollback — it stays pinned at the old version and nothing routes to it,
      so it never fails visibly.'
    evidence: F-323
    so: Before a group-targeted deploy, check the ledger's host list and match it deliberately.
  - claim: '`docker compose up -d` does NOT re-template a rendered `.env`. Swapping a compose file and
      bringing it up leaves the old environment in place; use the deploy play and probe behaviour, not
      presence.'
    evidence: docs/design/universal-deploy-rollback.md
    so: Use the deploy path rather than a compose command, and probe behaviour afterwards.
  - claim: 'Before a rollout, `preflight` prints three facts — State (stateless or stateful), Rollback
      (pin-revert, restore-required, or none, with the restore pointer and retention window) and Scope
      (single or coupled) — and `deploy` runs it as its first phase. A component nobody has declared
      fails closed to stateful with no rollback and grades not-clean; a rollout whose rollback is none or
      restore-required proceeds only with `--ack`, which is written into the deploy ledger.'
    evidence: docs/adr/1211-rollout-preflight-readiness-and-reversibility.md
    so: Read the three facts before you deploy; if Rollback says none or restore-required, know your
      restore pointer and acknowledge deliberately rather than reaching for --ack to clear the prompt.
  - claim: Every golden path here has two avenues that stay in step — the goatbuilder CLI and the shell
      drivers behind it — and neither is going away. The CLI is the supported door and carries the error
      codes and grading; the scripts are documented and kept working, so the deploy and preflight scripts
      print the same facts the CLI does. Nothing was deleted to make the CLI the only way.
    evidence: docs/adr/1201-two-avenues-scripts-documented-cli-supported.md
    so: Reach for the CLI first, but know the script is there, does the same thing, and is the fallback
      when the CLI is not to hand.
  drill:
    do: Read one role's deploy history and name every host it declares.
    pass: You can say exactly what a rollback of that service would touch.
    safety: read-only
  deeper:
  - doc: docs/design/universal-deploy-rollback.md
    why: The ledger, the artifact-type dispatch, and how a rollback is targeted per goatnet.
  - doc: docs/design/easy-rollback.md
    why: The pinning discipline that rollback depends on.
  status: written
  summary: Every deploying role records what it converged to, so rollback has something to read. The
    ledger — not your memory of the deploy — is what a rollback acts on.
  walkthrough:
  - do: Read what a rollout costs before you run it.
    run: goatbuilder preflight <component> --env <your-goatnet>
    note: It prints three facts — stateless or stateful, how it rolls back (pin-revert, restore-required,
      or none), and whether it is coupled to anything else. deploy runs it first; an undeclared component
      grades not-clean, and a none or restore-required rollback proceeds only with an acknowledgement
      recorded in the ledger.
  - do: Know what the ledger holds for the thing you are deploying.
    note: It records the artifact reference per host. Rollback reverts that reference, nothing more.
  - do: Deploy to the declared hosts, not to a group that happens to include more.
    note: 'A copy deployed to a host the ledger does not declare is invisible to rollback: it stays
      pinned at the old version, nothing routes to it, and it never fails visibly.'
  - do: Know what rollback does NOT restore.
    note: Content that lives in the repository rolls back by reverting the commit and redeploying —
      not by the rollback command.
  - do: Verify behaviour, not presence.
    note: Bringing a container up does not re-render a rendered environment file. Probe what the service
      does.
- id: release-ladder
  title: The release ladder
  level: working
  minutes: 20
  quirks:
  - claim: CI fails on ladder skew. A production pin ahead of its rung is not a warning, it is a red
      build.
    evidence: docs/design/release-graduation.md
    so: Never edit a pin to make CI green — produce the evidence the rung wants.
  - claim: An abandonment REASON is a field, not a YAML comment. A comment is invisible to every parser
      that reads the ladder.
    evidence: docs/adr/1127-fastlane-urgent-fleet-wide-delivery.md
    so: Put abandonment reasons in the field, not a comment.
  drill:
    do: Find one artifact mid-ladder and say which rung it is on and what it is waiting for.
    pass: Both answers, without asking anyone.
    safety: read-only
  deeper:
  - doc: docs/design/release-graduation.md
    why: The rungs, what a soak proves, and how production pins are allowed to move.
  - doc: docs/adr/1120-release-graduation-ladder.md
    why: The decision.
  status: written
  summary: Artifacts move to production by rungs, not by decision. Each rung is evidence — built, soaked,
    verified — and CI fails when a pin gets ahead of its evidence.
  walkthrough:
  - do: Find where the thing you care about sits.
    note: A rung is a claim about evidence, not about time elapsed.
  - do: Move it up by producing the evidence, not by editing the record.
    note: The ladder is enforced; skew between a production pin and its rung is a red build.
  - do: If something must skip the ladder, use the declared exception path.
    note: It exists, it is narrow, and it is honest about what it skips.
  - do: Record an abandonment as a field.
    note: A YAML comment explaining why something was dropped is invisible to every parser that reads
      the ladder.
- id: fastlane
  title: Fastlane — the deliberate exception
  level: mastery
  minutes: 15
  quirks:
  - claim: Fastlane is for changes whose ROLLBACK IS A PIN REVERT. Schema migrations, identity changes
      and ACL changes are excluded — not because they are less urgent, but because the exit does not
      exist.
    evidence: docs/adr/1127-fastlane-urgent-fleet-wide-delivery.md
    so: Ask 'what is the rollback' before asking 'how urgent is it'.
  - claim: '`--dry-run` first, always. The lane skips the soak, not the thinking.'
    evidence: docs/design/fastlane.md
    so: Always dry-run first; the lane removes the wait, not the care.
  drill:
    do: Dry-run the fastlane path against a merged reference.
    pass: You see the plan for each goatnet and nothing is applied.
    safety: admin
  deeper:
  - doc: docs/design/fastlane.md
    why: One command to every goatnet, and the narrow set of changes that qualify.
  - doc: docs/adr/1127-fastlane-urgent-fleet-wide-delivery.md
    why: The decision and its limits.
  status: written
  summary: 'The deliberate exception to the ladder: one command to every goatnet, for changes whose
    rollback is a pin revert. It skips the soak, not the thinking.'
  walkthrough:
  - do: Check the change qualifies.
    note: 'The test is the exit: if rolling back is a pin revert, it qualifies. Schema migrations, identity
      and access changes do not — not because they are less urgent, but because the exit does not exist.'
  - do: Dry run.
    run: fastlane --dry-run <ref>
    note: You see the plan for every goatnet with nothing applied.
  - do: Fire it, then verify per goatnet.
    note: Fleet-wide delivery means fleet-wide verification, not one spot check.
  - do: Record it.
    note: The exception is legitimate; an unrecorded exception is how a ladder quietly stops meaning
      anything.
- id: service-registry-and-dns
  title: Adding a service — registry, DNS, and deploying dark
  level: working
  minutes: 25
  surface:
  - isitup
  quirks:
  - claim: Declare an FQDN with no mesh DNS record and the service DEPLOYS DARK — up, healthy, unresolvable.
      Per-site zones are generated from the isitup rows to close this, and the generation is CI drift-gated.
    evidence: F-197
    so: Publish the name in the same change as the row — a declared-but-unresolvable service is invisible
      in the worst way.
  - claim: CoreDNS's hosts plugin silently loads ZERO records when the zone file is mode 0600. It does
      not error. `chmod 644` before `mv`.
    evidence: F-039
    so: Set the zone file readable before moving it into place; a silent zero-record load is the failure
      you get otherwise.
  - claim: A `paths:` CI filter on a GENERATED directory rebuilds on everything. `.dockerignore` is
      the proof of what is actually build input.
    evidence: F-327
    so: Do not put a path filter on a generated directory; prove what is actually build input.
  drill:
    do: Trace one service from its registry row to its DNS record to its live page.
    pass: You can show all three and say which generates which.
    safety: read-only
  deeper:
  - doc: docs/design/dns-service-discovery.md
    why: The two DNS tiers and which one a mesh service belongs in.
  - doc: ops/serve/services.yaml
    why: The hosted-service registry format itself, documented inline.
  status: written
  summary: A service exists when it is declared, resolvable and deployed — in that order, and the first
    two are the same declaration. Skip one and it deploys dark.
  walkthrough:
  - do: Declare the service in the registry.
    note: The row carries the hostname, the health path, and who may open it. It is also what the DNS
      zone is generated from.
  - do: Regenerate and publish the name.
    note: The zone is generated from those rows and drift-gated. Publishing means pushing it to every
      resolver peers are actually pointed at — check which those are rather than assuming.
  - do: Deploy the service, then verify from off the host.
    note: A probe from the host proves nothing about what a peer can reach.
  - do: Confirm the status row goes green for the right reason.
    note: Point the health path at something that proves the service rendered, not just that a web server
      answered.
- id: operator-action-audit
  title: Operator action audit
  level: working
  minutes: 15
  quirks:
  - claim: Operator `op_` keys are SELF-SERVICE. Approving a key grants it and revoking deletes it —
      the portal hot-reloads its key directory, so neither is a redeploy.
    evidence: F-207
    so: If a key does not work a minute after approval, treat it as a fault and say so — it is not waiting
      in a queue.
  drill:
    do: Read your own operator key state.
    pass: You can say whether your admin actions are currently attributable to you.
    safety: admin
  deeper:
  - doc: docs/design/operator-action-audit.md
    why: Per-person operator identity, the one chokepoint, and the age-encrypted roster.
  status: written
  summary: Admin actions are attributable to a person, not to a shared account. That property is worth
    understanding before you need it.
  walkthrough:
  - do: Get your operator key.
    note: It is self-service. Approval is the grant — the portal re-reads its key directory while running,
      so there is no install step and no queue.
  - do: Check your own attribution state.
    note: Know whether your actions are currently attributable before you take one that matters.
  - do: Read the audit trail for an action you took.
    note: The records are encrypted to the operator roster; reading them is a normal operator action,
      not an escalation.
- id: compliance-dashboard
  title: The compliance dashboard
  level: working
  minutes: 20
  surface:
  - compliance
  quirks:
  - claim: The ALB is retired BY the mesh, never before it. The order is the whole design — retiring
      the public door first leaves nobody able to reach the thing that would let them in.
    evidence: docs/design/compliance-dashboard-mesh-fronting.md
    so: Do not treat provenance from a hardened-image registry as a trust signal on its own.
  - claim: Iron Bank provenance is not a trust signal here. Supply chain is Chainguard-first and the
      distinction is deliberate.
    evidence: docs/design/os-supply-chain-security.md
    so: 'Keep the order in mind during any access change: the mesh retires the public door.'
  drill:
    do: Find one waiver and say what it waives and until when.
    pass: Both, from the dashboard itself.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/compliance-dashboard-mesh-fronting.md
    why: The two-stage per-AWS-env model — cold-start login over an ALB, then mesh-only.
  - doc: docs/compliance/README.md
    why: The controls and waivers themselves.
  status: written
  summary: 'The compliance view for the cloud side: controls, their state, and the waivers that say
    which gaps are known and until when.'
  walkthrough:
  - do: Open it and find one waiver.
    note: A waiver is a decision with an expiry, not a permanent exemption.
  - do: Read the two-stage access model.
    note: It starts reachable through a public door for cold-start login, then moves behind the mesh.
      The public door is retired BY the mesh, never before it — retiring it first leaves nobody able
      to reach the thing that would let them in.
  - do: Check a control against reality before quoting it.
    note: A control's recorded state is a claim; the surfaces that read machines are the check.
- id: object-store
  title: The object store — buckets, retention and the console
  level: working
  minutes: 20
  surface:
  - minio-console
  quirks:
  - claim: OIDC is initialised ONCE at boot. A mesh-IP host entry that is not present at that moment
      produces a console that starts clean and cannot log anyone in — restarting the container is the
      fix, editing config afterwards is not.
    evidence: F-198
    so: If the console starts but cannot log anyone in, restart it rather than editing config — its
      identity wiring is read once at boot.
  - claim: Lifecycle policy and object-lock retention interact so that objects are retained LONGER than
      the policy states. Reading the lifecycle rule alone gives you the wrong retention.
    evidence: F-171
    so: Never quote retention from the lifecycle rule alone.
  drill:
    do: List the buckets you can see and match one to its tier and retention.
    pass: You can state how long that bucket actually holds an object.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/zagros-minio-console-behind-ory.md
    why: The console behind Ory with native OIDC SSO, mesh-only — and the bringup gotchas.
  - doc: docs/design/audit-cold-storage-offload.md
    why: The three-tier audit shape and what lands in the object store at which tier.
  status: written
  summary: Buckets hold audit, backups and artifacts. The two things worth knowing early are how the
    console authenticates and how long objects actually persist.
  walkthrough:
  - do: Open the console through the goatnet's login.
    note: It authenticates natively against the identity plane and is mesh-only.
  - do: Match a bucket to its tier.
    note: Audit lands in tiers with different retention — hot for days, warm for a month, cold for compliance.
      Which bucket you are in decides what 'it is gone' means.
  - do: Read retention from both the lifecycle rule and the lock.
    note: They interact, and objects are retained LONGER than the lifecycle rule alone suggests.
- id: the-oauth2-issuer
  title: The OAuth2 issuer, and what is in your token
  level: working
  minutes: 20
  surface:
  - oauth2
  - auth
  quirks:
  - claim: Service fences read the `groups` claim from the JWT. Adding someone to an Ory group does
      nothing until they get a NEW token — the old one keeps its old groups until it expires.
    evidence: docs/adr/0857-patched-selfservice-ui-for-groups-claim.md
    so: After any group change, sign out and back in before testing.
  - claim: The header family matters. One proxy ships `PASS_USER_HEADERS=true` with `SET_XAUTHREQUEST=false`,
      populating only `X-Forwarded-*` — a fence reading `x-auth-request-groups` behind it admits nobody
      while looking correct.
    evidence: F-244
    so: When a surface refuses everyone, check which header its fence reads before touching the allow-list.
  drill:
    do: Decode your token and confirm the group claim matches what you expect.
    pass: It matches, or you know you need a fresh token.
    safety: read-only
  deeper:
  - doc: docs/design/identity-architecture.md
    why: Where Hydra sits, what it issues, and what consumes it.
  - doc: docs/adr/0857-patched-selfservice-ui-for-groups-claim.md
    why: The `groups` claim — how it gets into the JWT and who checks it.
  status: written
  summary: The token is what every gated surface actually reads. Understanding what is in it — and when
    it changes — resolves most 'I should have access' conversations.
  walkthrough:
  - do: Decode your own token and read the group claim.
    note: That claim is what a fence checks. Not your database record, not what an admin told you.
  - do: Remember that tokens are snapshots.
    note: Being added to a group changes nothing until you get a NEW token. Old tokens keep their old
      groups until they expire.
  - do: If a fence admits nobody, suspect its wiring.
    note: Proxies pass identity in specific headers, and a fence reading a header its proxy never sets
      refuses everyone while looking correct.
- id: incident-response
  title: Incident response
  level: working
  minutes: 25
  quirks:
  - claim: A merged fix is not a closed fault class. Close-out names an owner for the class, separately
      from the instance.
    evidence: docs/findings/INDEX.md
    so: Separate the instance from the class explicitly in your close-out.
  drill:
    do: Pick one known fault class and say who owns it.
    pass: You can name an owner — or state that it is unowned, which is itself the finding.
    safety: read-only
  deeper:
  - doc: docs/operations/incident-response.md
    why: The response procedure and who holds what.
  - doc: docs/operations/troubleshooting.md
    why: The symptom-first index.
  status: written
  summary: What to do when something is broken, in an order that preserves the evidence you will want
    later.
  walkthrough:
  - do: Establish what is actually true before acting.
    note: Read a surface that reads machines. Most incident time is spent on a claim from a file that
      no host carried.
  - do: Capture before you remediate.
    note: A restart that fixes it and destroys the evidence produces a recurring incident.
  - do: Name the owner of the fault class, not just the fix.
    note: A merged fix closes an instance. The class stays open until somebody owns it.
  - do: Write it down as a finding if it was not already one.
    note: The trap plus the evidence, so the next person does not pay for it twice.
- id: identity-ground-truth
  title: The identity ground-truth map — read before inferring
  level: working
  minutes: 30
  quirks:
  - claim: Identity questions are answered from this map, not from reading one plane and generalising.
      The planes disagree on purpose and each is authoritative for a different question.
    evidence: docs/design/identity-access-and-onboarding-reference.md
    so: When you are about to say 'so they must have access to X', stop and read X's own plane.
  drill:
    do: For your own principal, name what the identity plane holds, what the mesh holds, and what your
      fabric credential holds.
    pass: Three different answers, each sourced from the right plane.
    safety: read-only
  deeper:
  - doc: docs/design/identity-access-and-onboarding-reference.md
    why: The cross-plane map, cited to code. The doc that exists so nobody has to infer.
  status: written
  summary: Identity spans several planes that disagree on purpose. There is one map that says which
    plane is authoritative for which question — read it rather than inferring from whichever plane you
    happened to open.
  walkthrough:
  - do: Learn which plane answers which question.
    note: Who someone is, what their device may reach, what they may publish, and what a service will
      let them do are four questions with four answers.
  - do: For any principal, read all the planes before concluding.
    note: A person can be perfect in the identity plane and unreachable on the mesh, and both facts
      are correct.
  - do: Never generalise from one plane to another.
    note: That inference is the single most common source of wrong identity conclusions here.
- id: two-planes
  title: Two planes, and the name-match rule
  level: working
  minutes: 25
  surface:
  - dashboard
  - auth
  quirks:
  - claim: The planes are never mirrored 1:1. Where the same concept exists in both, the NAME MUST MATCH
      — today that is exactly one name, PLATFORM-ADMIN. Mesh role names must never appear in Ory traits
      or vice versa; that conflation is machine-guarded three ways.
    evidence: F-213
    so: Never copy a group name from one plane into the other; a guard exists because that conflation
      is a real, repeated error.
  - claim: '`IAM-ADMIN` has NO mesh group, by design. The consoles it administers live on INFRA, which
      every peer already reaches, so a mesh group would appear in no rule.'
    evidence: docs/design/mesh-and-ory-roles.md
    so: If a service refuses you, check the service plane — the mesh will not tell you.
  - claim: Ory groups are never site-prefixed. Mesh groups are. Getting this backwards produces a group
      that matches nothing and fails silently.
    evidence: docs/design/mesh-and-ory-roles.md
    so: Check the prefix convention before concluding a group does not exist.
  drill:
    do: List your groups in both planes and name which grant lets you open one thing you can currently
      open.
    pass: You can point at the specific grant, not the general role.
    safety: read-only
  deeper:
  - doc: docs/design/mesh-and-ory-roles.md
    why: The full vocabulary both planes, what each group grants, and what it explicitly is not.
  status: written
  summary: Mesh groups answer 'what sockets may this device open'. Service groups answer 'what may this
    person do once a service knows them'. They are never mirrored, and exactly one name is shared.
  walkthrough:
  - do: Read your own memberships in both planes.
    note: They will not match, and that is correct.
  - do: Learn the one shared name.
    note: Where the same concept exists in both planes the name must match. Today that is a single name;
      everything else is deliberately distinct.
  - do: Check the prefix convention before you go looking for a group.
    note: One plane's names are site-prefixed and the other's are not. Getting it backwards gives you
      a group that matches nothing and fails silently.
  - do: Expect some roles to have no counterpart at all.
    note: An identity-administration role with no mesh group is not an oversight — the consoles it administers
      are reachable by every peer already.
- id: identity-grammar
  title: The identity grammar — five orthogonal dimensions
  level: mastery
  minutes: 25
  quirks:
  - claim: Affiliation is identity-only. NEVER a NetBird group, NEVER in the Zenoh write anchor.
    evidence: docs/design/identity-grammar.md
    so: If you are about to use affiliation to decide access, pick the right dimension instead.
  - claim: '`unit_code` is a mutable registry attribute, not a cert stamp. Anything treating it as immutable
      is reading the wrong plane.'
    evidence: docs/design/identity-grammar.md
    so: Never treat a registry attribute as immutable — check where the value actually lives.
  - claim: The actor graph is a DERIVED read-only projection and is never in an enforcement path.
    evidence: docs/design/actor-relationship-graph.md
    so: Do not build enforcement on a derived projection.
  drill:
    do: Describe one real principal in all five dimensions.
    pass: No dimension is doing another's work.
    safety: read-only
  deeper:
  - doc: docs/design/identity-grammar.md
    why: Role, affiliation, echelon, node-class, site — and why fusing any two is the recurring mistake.
  - doc: docs/design/identity-descriptor-standard.md
    why: Cert = born-as, registry = currently-is.
  status: written
  summary: 'Five dimensions describe a principal, and they are orthogonal on purpose: role, affiliation,
    echelon, node class, site. Almost every identity mistake here is one dimension doing another''s
    job.'
  walkthrough:
  - do: Describe one real principal in all five dimensions.
    note: If you cannot fill one in, that is information — not a reason to reuse another.
  - do: Keep affiliation out of authorization.
    note: Affiliation is identity-only. It is never a mesh group and never part of a write anchor.
  - do: Treat registry attributes as mutable and certificate contents as frozen.
    note: A certificate says what a principal was born as; the registry says what it currently is. Reading
      the wrong one gives a confidently wrong answer.
  - do: Use derived views for reading only.
    note: A relationship graph over principals is a projection. It never sits in an enforcement path.
- id: onboard-a-person
  title: Onboarding a person, end to end
  level: working
  minutes: 30
  surface:
  - id-admin-console
  - onboard-api
  - onboarding-guide
  quirks:
  - claim: Sponsor eligibility is at-most-own-tier and fail-closed. A sponsor cannot grant a tier they
      do not hold, and an unresolvable sponsor is refused rather than defaulted.
    evidence: docs/design/three-stage-candidate-onboarding.md
    so: Check your own tier before promising someone theirs.
  - claim: On slot-pool goatnets the onboarding progress swimlane's peer_count is STRUCTURALLY zero.
      It is not a stalled candidate.
    evidence: docs/design/onboarding-progress-observability.md
    so: On slot-pool goatnets, do not read a zero peer count as a stalled candidate — it is structural.
  - claim: A "start here" link must be openable by the person you send it to. One welcome mail pointed
      every new person at a page gated to admins and sponsors — the page was titled "for admins and
      sponsors" and was never for them.
    evidence: F-326
    so: Test every onboarding link from a logged-out browser before it goes in a template.
  drill:
    do: Walk the console's onboarding flow for a test handle up to, but not through, the mint.
    pass: You can name what each stage would commit before you fire it.
    safety: admin
  deeper:
  - doc: docs/design/three-stage-candidate-onboarding.md
    why: The three stages, what each one commits, and where a candidate can stall.
  - doc: docs/operations/id-admin-console-runbook.md
    why: Driving it from the console.
  - doc: docs/design/onboard-tier-role-model.md
    why: What tier a sponsor may grant — at-most-own-tier, fail-closed.
  status: written
  summary: Onboarding is a staged process, not a form submission. Each stage commits something, and
    knowing what stops you doing damage at the wrong moment.
  walkthrough:
  - do: Check sponsor eligibility first.
    note: 'It is at-most-own-tier and fail-closed: you cannot grant a tier you do not hold, and an unresolvable
      sponsor is refused rather than defaulted.'
  - do: Walk the stages without firing the mint.
    note: Know what each stage commits before committing it.
  - do: Mint through the front door, then check the bundle is complete.
    note: The completeness gate refuses to deliver a half-provisioned bundle. Trust it.
  - do: Send them somewhere they can actually open.
    note: A 'start here' link must be openable by the person you sent it to — check it from an unauthorised
      session, because the gate is invisible to whoever wrote the link.
- id: collision-safety
  title: Two sponsors, one candidate
  level: mastery
  minutes: 15
  quirks:
  - claim: Concurrent onboarding of the same person produced colliding principals. The guard is an email-keyed
      pre-mint check — which means marking someone `offboarded` RELEASES that dedup key.
    evidence: F-239
    so: Before re-onboarding someone previously offboarded, expect the dedup key to be free — and check
      for a stale principal yourself.
  drill:
    do: Read the pre-mint check and say what happens on a second concurrent attempt.
    pass: You can name the refusal and the key it refuses on.
    safety: read-only
  deeper:
  - doc: docs/design/operator-onboarding-collision-safety.md
    why: The email-keyed pre-mint check and what it refuses.
  status: written
  summary: Two sponsors onboarding the same person at once used to produce two principals. The guard
    is an email-keyed check before the mint — which means the key can also be released.
  walkthrough:
  - do: Understand the key.
    note: Deduplication is keyed on the person's email address at pre-mint time.
  - do: Know what releases it.
    note: Marking someone offboarded releases that key. That is intended — it is how a person can come
      back — and it means the guard no longer protects that address.
  - do: Coordinate before onboarding someone who may already be in flight.
    note: The guard is a backstop, not a substitute for asking.
- id: delivering-credentials
  title: Delivering credentials without spending them
  level: working
  minutes: 15
  quirks:
  - claim: NEVER email a clickable one-time credential link. Institutional inboxes fetch every URL in
      a message and spend it before the human sees it.
    evidence: F-315
    so: If someone asks you to 'just email them the link', explain the scanner problem and use the supported
      hand-off.
  - claim: The welcome mail does not carry the setup key for related reasons. If a recipient says the
      mail is missing something, check the delivery design before assuming a bug.
    evidence: docs/design/onboarding-notifications.md
    so: When a recipient says a message is missing something, check the delivery design before filing
      a bug.
  drill:
    do: Read one onboarding notification template and identify what is deliberately not in it.
    pass: You can name the omission and why it is there.
    safety: read-only
  deeper:
  - doc: docs/findings/F-315-mail-security-scanners-spend-one-time-credential-links.md
    why: The failure, the evidence, and the delivery patterns that survive a scanning inbox.
  status: written
  summary: How a credential reaches a person is part of its security. The most common mistake here is
    not weak credentials, it is delivery that spends them.
  walkthrough:
  - do: Never email a clickable one-time link.
    note: Institutional mail scanners fetch every URL in a message. The credential is spent before the
      human sees it, and the failure looks like a broken system.
  - do: Deliver out of band, and say which band.
    note: The bundle carries values that exist nowhere else; hand it over deliberately.
  - do: Read a delivery template for what it deliberately omits.
    note: Things are missing from those messages on purpose.
- id: revoke-and-offboard
  title: Revocation and offboarding
  level: working
  minutes: 25
  quirks:
  - claim: Marking someone `offboarded` is a MARKER, not a cut. It releases the email dedup key; it
      does not by itself remove reach. Prove the cut, do not infer it from the marker.
    evidence: docs/design/credential-revocation-and-offboarding.md
    so: Never report someone as offboarded on the strength of the marker alone.
  - claim: Revocation is mesh-first and reversible on purpose — the fastest thing to remove is L4 reach,
      and the slowest to restore is a wrongly-destroyed identity.
    evidence: docs/design/credential-revocation-and-offboarding.md
    so: Reach for probation when you are removing access to buy time rather than to end a relationship.
  drill:
    do: For one principal, write the order you would cut the planes in and what proves each cut.
    pass: Every step has a check that would fail if the cut had not happened.
    safety: read-only
  deeper:
  - doc: docs/design/credential-revocation-and-offboarding.md
    why: Mesh-first, reversible, and the order the planes are cut in.
  - doc: docs/design/anomaly-probation-lifecycle.md
    why: Probation as an alternative to a cut.
  status: written
  summary: 'Removing access is ordered, reversible, and mesh-first: the fastest thing to take away is
    network reach, and the slowest thing to restore is a wrongly destroyed identity.'
  walkthrough:
  - do: Cut mesh reach first.
    note: It is the fastest and most complete removal, and it is reversible.
  - do: Do not mistake a marker for a cut.
    note: Marking someone offboarded is a state change in the registry. It releases the dedup key. It
      is not, by itself, removal of reach.
  - do: Prove each plane, do not infer it.
    note: For every plane you cut, have a check that would fail if the cut had not happened.
  - do: Consider probation where the answer is 'not sure yet'.
    note: There is a lifecycle between full access and removal, and using it beats an irreversible decision
      made quickly.
- id: rotation
  title: Rotation — in-place leaf re-issue
  level: mastery
  minutes: 15
  quirks:
  - claim: Rotation does not change identity. If a rotation produces a new principal, something has
      gone through the wrong door.
    evidence: docs/design/credential-rotation.md
    so: If a rotation changes who someone is, stop and roll back — you used the onboarding path by mistake.
  drill:
    do: Rotate a non-production credential you own.
    pass: Your identity is unchanged and the old credential no longer authenticates.
    safety: writes
  deeper:
  - doc: docs/design/credential-rotation.md
    why: Why rotation is an in-place leaf re-issue rather than a re-onboard.
  status: written
  summary: Rotation re-issues the credential and keeps the identity. If a rotation produces a new principal,
    something went through the wrong door.
  walkthrough:
  - do: Rotate in place.
    note: The anchor, the namespace and the access stay the same; only the certificate and key are new.
  - do: Confirm the identity did not move.
    note: Same anchor, same namespace, same groups afterwards.
  - do: Confirm the old credential stops working.
    note: A rotation where the old leaf still authenticates has not finished.
- id: data-access-roles
  title: Data-access roles
  level: mastery
  minutes: 30
  quirks:
  - claim: The grammar is CLOSED. A role that is not in it is not a role, and inventing one produces
      a grant nothing enforces.
    evidence: docs/design/data-access-roles.md
    so: If the role you want is not in the grammar, the answer is a design change, not a new label nothing
      enforces.
  - claim: Org sharing authority is `data.govern.org`, and co-publishing is at-most-own-org, opt-in
      and fail-closed. Single-owner roots stay inviolable.
    evidence: docs/design/pubsub-org-admin-co-publish.md
    so: Before co-publishing anywhere, confirm the root is marked for it — the default is that it is
      not.
  drill:
    do: Name the data-access role you hold and one topic it does not reach.
    pass: You can point at the grant, not at a memory of one.
    safety: read-only
  deeper:
  - doc: docs/design/data-access-roles.md
    why: The closed grammar, registry-derived and two-plane, with labels and grants.
  - doc: docs/design/grant-crypto-sdk.md
    why: The frozen SDK API for grant-keyed material.
  status: written
  summary: Who may read and publish which data is a closed grammar derived from the registry, expressed
    in both planes. Closed means a role you invent is not a role.
  walkthrough:
  - do: Find the role you actually hold.
    note: Not the one you were told about — the one the registry derives.
  - do: Name one thing it does not reach.
    note: Knowing your boundary is more useful than knowing your grant.
  - do: For sharing across organisations, read the sharing authority.
    note: Co-publishing happens only on explicitly marked multi-publisher roots, opt-in, fail-closed, and at
      most within your own organisation. Single-owner roots stay inviolable.
  - do: Use the SDK rather than hand-rolling grant handling.
    note: Its API is frozen for exactly this reason.
- id: mesh-acl-model
  title: The mesh ACL — what it is and what it is not
  level: working
  minutes: 25
  surface:
  - dashboard
  - mgmt
  quirks:
  - claim: NetBird policies carry BOTH a policy-level and a rule-level `enabled` flag. Read the rule
      flag alone and you can conclude production is running flat open when it is not. Check `policy.enabled`
      first.
    evidence: docs/findings/INDEX.md
    so: Always read `policy.enabled` first; a rule-only read is how people conclude production is flat
      open.
  - claim: A class with no self-source rule cannot resolve its own DNS — the peers in it cannot reach
      each other, including for name resolution. Nothing in the ACL surfaces this as an error.
    evidence: docs/design/mesh-acl.md
    so: If names stop resolving for one class of peer, check for a missing self-source rule before blaming
      DNS.
  - claim: Listing setup keys requires an ADMIN token. There is no read-only NetBird role that can do
      it, so "just give it read access" is not available.
    evidence: docs/design/mesh-identity-operations.md
    so: Do not plan around a read-only token for setup keys — listing them requires admin.
  drill:
    do: For one group you belong to, read every enabled rule naming it as source.
    pass: You can state what you may open, on which ports, without guessing.
    safety: read-only
    check:
      run: "python3 ops/ci/check-netbird-acl-parity.py"
      expect: exit-zero
      why: >-
        Proves the rules you are about to read are the rules that are deployed. Reading them for
        YOUR group is the drill proper.
  deeper:
  - doc: docs/design/mesh-acl.md
    why: Group-to-group permits at L4, default-deny after cutover, and what the ACL cannot express.
  status: written
  summary: Mesh access is group-to-group permits at the transport layer, with explicit ports. It is
    not identity-aware, it is not application-aware, and after cutover it is the whole permission surface.
  walkthrough:
  - do: Read the rules that name a group you belong to as SOURCE.
    note: That set is exactly what your device may open. Anything else is refused by the data plane,
      not by an application.
  - do: Check the policy flag before the rule flag.
    note: Policies carry both a policy-level and a rule-level enabled flag. Reading only the rule can
      convince you a goatnet is running wide open when it is not.
  - do: Remember membership unions.
    note: Groups add reach; they never subtract it. Extra membership can only widen what a peer can
      do.
  - do: Watch for classes with no self-source rule.
    note: A group whose members cannot reach each other cannot resolve names between themselves either,
      and nothing surfaces that as an error.
- id: warrant-generates-the-acl
  title: warrant — the registry generates the ACL, byte-identically
  level: mastery
  minutes: 30
  quirks:
  - claim: The applied mesh ACL is GENERATED from the warrant registry. Hand-editing the applied file
      is not a shortcut — the next generate reverts you. The applied file's own header does not yet
      say this, which is exactly why it is written here.
    evidence: ops/warrant/generate.py
    so: Never edit the generated matrix; the next generate reverts you and the diff will confuse the
      next reader.
  - claim: Editing policy in the NetBird CONSOLE is a DIFFERENT act from editing the generated file,
      and it is worse in every direction. The generated file gets reverted by the next generate, which
      is annoying and self-correcting. A console policy is never reverted — it carries no
      `[L4-cutover ...]` tag in its description, and the orphan reaper matches on exactly that tag, so
      it is invisible to the one job that removes undeclared grants. It survives every deploy,
      indefinitely, and appears in no review.
    evidence: ops/ansible/netbird-acl-cutover.yml
    so: If you changed reach in the console, nothing will clean it up for you and nobody will see it —
      bring the change back to the registry yourself, or it is permanent and unreviewed.
  - claim: A policy written by hand in the console is invisible to the governed path. It can grant the
      built-in `All` group — every peer on the mesh — every port, survive deploys, and no guard, report or
      alert names it, because every check the ACL has runs against the registry or against warrant's own
      tagged output.
    evidence: docs/design/mesh-change-control.md
    so: Treat "I will fix it in the console and tidy it later" as writing an unreviewed permanent rule;
      there is no later, because nothing is watching.
  - claim: Only the `ports:` line is synthesized; comments, ordering and anchors pass through verbatim.
      That is deliberate — a generator that stored the rendered ports and echoed them back would pass
      the byte-identical gate while proving nothing.
    evidence: ops/warrant/generate.py
    so: Do not add a port literal to a rule — add or extend a named set.
  - claim: '`protocol: all` in an old rule is an INFORMATION problem before a discipline one. It is
      what a rule says when nobody could prove what narrowing it would break.'
    evidence: docs/design/warrant.md
    so: When you meet an all-protocols rule, go find the listening evidence rather than narrowing on
      instinct.
  - claim: The instance plane is fast BECAUSE the governance plane is slow, and the two never share
      a path.
    evidence: docs/design/warrant.md
    so: Keep governance changes on the slow path deliberately; that is what lets instance changes be
      fast.
  drill:
    do: Run the registry's byte-identical check.
    pass: Exit 0 — the applied artifact matches what the registry generates.
    safety: read-only
    check:
      run: "python3 ops/warrant/generate.py --check"
      expect: exit-zero
      why: >-
        This IS the drill — the registry's byte-identical check is the command the module asks
        you to run.
  deeper:
  - doc: docs/design/warrant.md
    why: The unit, the vocabulary, the evidence and the authority ladder — and why git is the system
      of record.
  - doc: docs/adr/1129-warrant-scoped-expiring-network-authorizations.md
    why: The decision.
  - doc: ops/warrant/generate.py
    why: The generator itself, and the byte-identical gate that makes its output reviewable.
  status: written
  summary: The applied mesh ACL is generated from a registry, byte for byte. That single property is
    what makes the review of a network change meaningful, and it is why hand-editing the applied file
    is a round trip rather than a shortcut.
  walkthrough:
  - do: Edit the registry, never the generated file.
    note: Rules name a port SET rather than literal ports; the ports themselves live in exactly one
      place.
  - do: Regenerate and read the diff.
    run: warrant generate --check
    note: The check exits non-zero when the committed artifact is not byte-identical to what the registry
      generates.
  - do: Understand why byte-identical matters.
    note: Only the port line is synthesised; comments, ordering and anchors pass through. A generator
      that stored rendered ports and echoed them back would pass a weaker gate while proving nothing.
  - do: Treat a loose rule as an information problem.
    note: A rule granting every protocol is usually what gets written when nobody could prove what narrowing
      it would break — the fix is evidence, not discipline.
- id: change-network-access-warrant-way
  title: Change network access the warrant way
  level: working
  minutes: 45
  surface:
  - mgmt-read
  - admin-dashboard
  quirks:
  - claim: On a goatnet that warrant governs, the everyday NetBird dashboard is read-only for everyone
      — including the three people who can write. Its API door forwards only reads, and a write there
      is refused before it reaches the management server. The write address exists for break-glass
      repairs, and a membership edit made there is put back by the converger within about five minutes.
    so: Do not look for the button. Write the entry, open the pull request; keep the admin address for
      what warrant does not cover.
    evidence: docs/adr/1189-netbird-read-only-dashboard-and-warrant-owned-membership.md
  - claim: A file holds one entry per peer, so a quarantine hold REPLACES whatever entry the peer had.
      Deleting the hold returns the peer to its enrollment key's groups, not to its old entry — a peer
      that had an extra grant loses it.
    so: Release a hold by reverting the pull request that added it. The revert restores the old entry,
      and with it exactly the old groups; nothing else records them.
    evidence: crates/goat-cli/src/cmd/warrant_membership.rs
  - claim: A peer with no enrollment-key baseline (its key was deleted, or it logged in interactively)
      and no `exact` or `hold` entry is reported `unknown` and never changed — even if it holds
      PLATFORM-ADMIN.
    so: Read the unknown rows in the report. Give such a peer an `exact:` entry, which is a reviewed
      change, rather than assuming the converger has it covered.
    evidence: docs/design/mesh-change-control.md
  - claim: Containment is fast and giving access back is reviewed. CI proves adding a hold, removing
      a grant or adding an `absent` to be a narrowing; releasing a hold, adding a grant or moving an
      expiry later is a widening and waits for the path's owners.
    so: Expect a quarantine to merge on one approving click and its release to wait. That asymmetry
      is the design, not a stuck pipeline.
    evidence: ops/ci/check-warrant-narrowing.py
  - claim: Merging the entry changes nothing on the goatnet by itself. The file reaches the management
      host by a deploy, and the converger applies it on its next pass, every five minutes.
    so: After merge, ask a platform admin to deploy the membership file, then confirm with the
      converger's report rather than the merge.
    evidence: docs/adr/1189-netbird-read-only-dashboard-and-warrant-owned-membership.md
  - claim: The converger refuses a whole run that would make more than ten peer-group changes, and
      it will not add a peer to a group no enabled access rule covers.
    so: A red converger after a big entry is the safety working. Split the change, or have a platform
      admin raise the limit once for a change that really is that large.
    evidence: docs/design/mesh-change-control.md
  drill:
    do: Clone `hello-galaxy-mesh-change-control` from the welcome guide's Repositories page and run
      its six scenarios. Scenario 04 runs on the zagros-dev mesh with your own NetBird token.
    pass: Scenarios 01, 02, 03 and 05 end with 0 failed. Scenario 04 shows 200 for a read and 403 for
      a write on the read-only door, and the converger's report exits 0.
    safety: read-only
    needs: mesh
    run: bash scenarios/04-live-read-only/run.sh
  deeper:
  - doc: docs/operations/warrant-runbook.md
    why: Section 4A is the procedure — the entry shapes, the rules CI enforces, quarantine, and
      emergency edits.
  - doc: docs/design/mesh-change-control.md
    why: Who can do what at which address, the desired-membership table, the converger and its gates.
  - doc: docs/adr/1189-netbird-read-only-dashboard-and-warrant-owned-membership.md
    why: The decision, and what was measured on zagros before it was taken.
  status: written
  summary: Nobody edits groups in the NetBird dashboard on a governed goatnet. Which peer holds which
    group is declared per goatnet as a short list of exceptions to what each peer's enrollment key
    granted, with an owner, a reason and an expiry. A reviewed pull request changes that list, and a
    machine account on the management host makes the goatnet match it. Governed today — zagros-dev.
  walkthrough:
  - do: Ask whether it is the access rules at all.
    run: goat warrant why-blocked --scope zagros-dev --from <group> --to <group> --port <n>
    note: PERMITTED means the rule exists and the peer probably does not hold the group — that is a
      membership change. BLOCKED means a rule change, which is the module on generating the ACL.
  - do: Write the entry in the goatnet's membership directory.
    note: '`grant:` adds to what the key gave, `absent:` takes a group away and keeps it away, `exact:`
      replaces the key entirely, `hold: quarantine` leaves only the quarantine group. Every entry names
      an owner and a reason; holds, and grants of P2P, BREAKGLASS, PLATFORM-ADMIN or EXTERNAL-INFRA, carry
      an expiry.'
  - do: Run the membership checker and the narrowing prover before you push.
    note: They are the two checks CI runs. The first refuses a malformed or forbidden entry; the second
      tells you whether the change will merge on one click or wait for review. The warrant runbook,
      section 4A, has both commands.
  - do: Open the pull request and read the verdict CI posts.
    note: '`warrant: narrowing` or `warrant: widening`, with the lines that decided it. A widening is not
      a failure; it waits for the platform and maintainers teams.'
  - do: After merge, have the file deployed and watch it land.
    run: goat warrant apply --membership --scope zagros-dev --file ops/warrant/membership/zagros-dev --mode report --mgmt-url https://mgmt-read.<site>
    note: Report mode changes nothing. `changes planned 0` and your peer absent from the table means
      the converger has made the goatnet match the file.
  - do: Rehearse all of it first.
    note: The runnable example `hello-galaxy-mesh-change-control` predicts the converger's plan, shows
      each refused entry and why, grades eighteen diffs, and rehearses a grant, a hold and a release —
      five of its six scenarios offline.
- id: port-sets
  title: Port sets — the vocabulary of what may be granted
  level: mastery
  minutes: 20
  quirks:
  - claim: Ports live in `port-sets.yaml` and nowhere else. A literal port in an intent is a bug, not
      a shortcut.
    evidence: ops/warrant/port-sets.yaml
    so: When tempted to inline a port 'just this once', add it to the set instead.
  - claim: The GENERATED matrix stays fully expanded. An operator reading the applied ACL sees literal
      ports — the indirection lives in the source, not in what is reviewed or applied.
    evidence: ops/warrant/generate.py
    so: Read the expanded artifact when reviewing, and the registry when editing.
  drill:
    do: Pick one service and name the port set that covers it — or state that none does.
    pass: Either answer, with the set named or the gap named.
    safety: read-only
  deeper:
  - doc: ops/warrant/port-sets.yaml
    why: The named sets themselves — the only place a port number is written once.
  - doc: docs/design/warrant.md
    why: Why sets rather than literals, and how the expansion stays reviewable. (§2 vocabulary)
  status: written
  summary: Seven named sets are the whole vocabulary of what may be granted. A port number lives in
    one place; every rule points at a name.
  walkthrough:
  - do: Find the set that covers the service you care about.
    note: If none does, that is a real answer — and a vocabulary change, which is reviewed harder than
      a rule change for good reason.
  - do: Never inline a port.
    note: 'A literal in a rule is a bug, not a shortcut: it puts a fact in a second place.'
  - do: Read the generated output to see the expansion.
    note: The applied artifact stays fully expanded so an operator reads literal ports; the indirection
      lives in the source, not in what is reviewed.
- id: change-reach-safely
  title: Changing who can reach what
  level: mastery
  minutes: 30
  quirks:
  - claim: A request IS a pull request. There is no approval service, no queue, and no side channel
      — routing is CODEOWNERS and the decision is a review.
    evidence: docs/design/warrant.md
    so: Send the diff, not a request — the pull request IS the ask.
  - claim: Rollback is `git revert`, not a special path. That is a consequence of the decision and the
      artifact being the same object.
    evidence: docs/design/warrant.md
    so: Roll back with a revert; there is no special path and you do not need one.
  - claim: Declared and deployed rule counts differ legitimately — one goatnet ALIASES another's section.
      Do not read a count mismatch as drift without checking the alias.
    evidence: ops/ansible/netbird_acl_matrix.yml
    so: Check the alias before reading a count mismatch as drift.
  drill:
    do: Make a one-line change in a rule intent, regenerate, read the diff, then revert it.
    pass: The diff is exactly the change you meant and nothing else moved.
    safety: read-only
  status: written
  summary: 'Changing who can reach what is a pull request. There is no approval queue and no side channel:
    the diff is the request, review is the decision, and revert is the rollback.'
  walkthrough:
  - do: Edit the rule intent, regenerate, and read the diff.
    note: Only the change you meant should appear in the generated artifact.
  - do: Let the narrowing check classify it.
    note: A change granting nothing new can merge without waiting; a widening waits for the owner. The
      check is conservative — a genuine narrowing it cannot follow goes to a human.
  - do: Apply it, then prove it three different ways.
    note: Declared-versus-deployed parity, assertions that would fail if the rule vanished, and a reachability
      view. They answer different questions; do not substitute one for another.
  - do: Expect a one-way path to be correct.
    note: Some classes are source-only or destination-only by design. Add membership rather than authoring
      a rule that widens the whole goatnet to fix one peer.
- id: acl-assertions
  title: ACL assertions — rechecked when nothing is written
  level: mastery
  minutes: 20
  surface:
  - netvis
  quirks:
  - claim: Assertions are rechecked when NOTHING is written. A check that only runs on change cannot
      catch drift that arrives from the other side.
    evidence: docs/adr/1126-acl-assertions-rechecked-when-nothing-is-written.md
    so: If a guard is 'not wired into CI', assume it runs nowhere until you find the timer.
  - claim: A live-state guard that is "not wired into PR CI" runs NOWHERE. The vehicle is a mgmt-host
      timer, never GitHub Actions — an Actions secret with mesh admin rights hands every pusher the
      mesh.
    evidence: docs/design/mesh-acl.md
    so: Never put a mesh-admin credential where every pusher can read it.
  drill:
    do: Run the assertions and name one that would fail if a specific rule were removed.
    pass: You can name the assertion and the rule.
    safety: read-only
  deeper:
  - doc: docs/adr/1126-acl-assertions-rechecked-when-nothing-is-written.md
    why: Why assertions are rechecked on a quiet tree, and what `goat acl test` proves.
  status: written
  summary: Assertions state reach that must hold, and they are rechecked when nothing has changed —
    because the drift that matters arrives from the other side.
  walkthrough:
  - do: Read the assertions for your area.
    note: Each one is a claim someone thought worth defending.
  - do: Run them.
    run: goat acl test
    note: They pass, or they name exactly which pair and port stopped holding.
  - do: Understand why they run on a quiet tree.
    note: A check that only runs on change cannot catch a change made somewhere else — the live plane
      can move without a commit.
  - do: Know where they must NOT run from.
    note: A live-state guard belongs on a managed host on a timer, not in a place where every person
      who can push code would hold the credential it needs.
- id: p2p-graduation
  title: P2P graduation — a capability, not a role
  level: working
  minutes: 15
  quirks:
  - claim: 'Lateral reach is a CAPABILITY, not a role, and its rule is one-way. Verified in the declaration:
      the only rule naming the capability group as a destination has that same group as its source,
      and it is not bidirectional.'
    evidence: docs/design/mesh-and-ory-roles.md
    so: A peer holding the capability and no role group can initiate to everything and is reachable
      only by other capability holders — not by the substrate, not by an admin. When a box can reach
      out but nothing can reach it, restore its ROLE group; never author an inbound rule to the capability
      group, which would hand the substrate reach to every graduated peer on the goatnet.
  - claim: Some classes are never P2P destinations regardless of graduation — bearer gear and breakglass
      among them. Graduation does not open them.
    evidence: docs/design/mesh-and-ory-roles.md
    so: Verify BOTH directions after a graduation. A check that tests only the direction the grant creates
      cannot fail, which is how a graduation that stranded a box passed its own verification.
  - claim: Nothing mechanically refuses a peer that holds only the capability and no role group. The
      invariant is written down and enforced by nobody — unlike label groups, which must co-mint a policy-bearing
      role group.
    so: 'Check the role group yourself at mint time, and treat this as an open gap rather than a guarantee:
      read the peer''s full group list before you call a graduation done.'
    evidence: docs/design/mesh-and-ory-roles.md
  drill:
    do: Check whether your peer holds the capability, and test reachability in BOTH directions.
    pass: You can state what changes in each direction — and notice if one is missing.
    safety: read-only
  deeper:
  - doc: docs/operations/p2p-graduation.md
    why: How lateral reach is granted, and what it does and does not imply.
  status: written
  summary: Lateral reach is a capability you are granted, not a property of your role. It grants outbound
    only — which produces the most misread shape on the mesh.
  walkthrough:
  - do: Check whether your peer holds it.
    note: It changes what you can open, and nothing about what can open you.
  - do: Read the asymmetry carefully.
    note: A peer whose only group is the capability reaches everything and is reached by nothing — including
      by the host responsible for it. That is designed.
  - do: Fix a stranded peer with membership, not a rule.
    note: Restore its role group. Authoring an inbound rule to the capability group would hand the substrate
      reach to every graduated peer on the goatnet.
  - do: Verify both directions.
    note: A graduation check that tests only the direction the grant creates cannot fail.
- id: mesh-dns
  title: Mesh DNS and the name fallback
  level: working
  minutes: 20
  quirks:
  - claim: Names can keep resolving with DNS down, from a signed snapshot — but the snapshot is staleness-graded,
      and a stale name resolving is not the same as a service being up.
    evidence: docs/design/name-fallback-resolver.md
    so: Read the live client before deciding where to push a zone.
  - claim: Never add a mesh name to `/etc/hosts`. Use the publish path; a hosts entry is invisible to
      every drift check that exists.
    evidence: CLAUDE.md §"Domain & DNS"
    so: Treat a resolved stale name as 'the name still exists', never as 'the service is up'.
  drill:
    do: Resolve one mesh name and say which resolver answered.
    pass: You can name the resolver, from live state rather than from a document.
    safety: read-only
  deeper:
  - doc: docs/design/dns-service-discovery.md
    why: The two tiers and which names live where.
  - doc: docs/design/name-fallback-resolver.md
    why: Signed versioned snapshots, staleness grading, and the per-site opt-in. (§9)
  status: written
  summary: Names resolve through the goatnet's own resolvers, and can keep resolving from a signed snapshot
    when DNS itself is down. Both facts have sharp edges.
  walkthrough:
  - do: Find out which resolver your peer was actually handed.
    note: Do not assume it is the one an inventory file names. Read it from the live client.
  - do: Resolve a name and note which tier answered.
    note: Public DNS for enrolment, mesh resolvers for everything internal.
  - do: Understand the fallback's honesty grading.
    note: A snapshot keeps names resolving without DNS, and it is staleness-graded — a stale name resolving
      is not evidence the service is up.
  - do: Never patch a name into a hosts file.
    note: It is invisible to every drift check that exists, and it outlives the person who added it.
- id: machine-enrolment
  title: Enrolling a machine you are responsible for
  level: working
  minutes: 25
  quirks:
  - claim: A machine gets its OWN slot identity. It does not borrow its custodian's, and the custody
      edge is recorded rather than implied.
    evidence: docs/design/machine-enrollment.md
    so: Never enrol a machine under your own identity to save time — the custody edge is what makes
      it revocable later.
  drill:
    do: Read the enrolment procedure for the class of machine you own.
    pass: You can name the class you will ask for before you ask for it.
    safety: read-only
  deeper:
  - doc: docs/design/machine-enrollment.md
    why: Custodian self-service, own-slot identity, and the custody edge.
  - doc: docs/operations/gear-enrollment-sop.md
    why: The procedure.
  status: written
  summary: A machine you are responsible for gets its own identity, not a copy of yours. Custody is
    recorded as a relationship rather than implied by who ran the command.
  walkthrough:
  - do: Decide the machine's class by what it does.
    note: Function, not hardware. The class decides what it may reach and what may reach it.
  - do: Enrol it through the supported self-service path.
    note: It gets its own slot identity; you are recorded as the custodian.
  - do: Verify both directions of reach afterwards.
    note: Many gear classes are deliberately one-way. Confirm the direction you need actually exists
      before the machine is depended on.
  - do: Record what it is for.
    note: The next person to meet it will have only what you wrote down.
- id: setup-keys-and-groups
  title: Setup keys and auto-groups
  level: working
  minutes: 20
  quirks:
  - claim: '`auto_groups` IS the baseline — the groups a peer lands in are the key''s, not something
      applied afterwards. A key minting a label group without a policy-bearing role group enrols the
      peer UNCOVERED.'
    evidence: docs/design/mesh-and-ory-roles.md
    so: Check the key before blaming the peer when access is wrong.
  - claim: In membership forensics the initiator is the KEY id, not a person. Attributing an enrolment
      to a human requires the key's own provenance.
    evidence: docs/design/mesh-identity-operations.md
    so: Do not mint label-only keys; co-mint a policy-bearing role group.
  - claim: A shared setup key expires. An enrolment that suddenly fails fleet-wide is this before it
      is anything else.
    evidence: docs/operations/setup-key-rotation.md
    so: When enrolment breaks everywhere at once, check expiry first.
  drill:
    do: Read the auto-groups on a setup key you hold and predict where a peer enrolled with it lands.
    pass: Your prediction matches the groups the peer actually gets.
    safety: admin
  deeper:
  - doc: docs/operations/setup-key-rotation.md
    why: Key lifecycle and rotation.
  - doc: docs/design/mesh-identity-operations.md
    why: How a key's auto-groups become a peer's ACL groups at enrolment.
  status: written
  summary: A setup key is a decision about access made in advance. Whatever groups it carries are what
    a peer lands in the moment it enrols.
  walkthrough:
  - do: Read the auto-groups on the key before you use it.
    note: That list IS the peer's baseline access. There is no separate step afterwards.
  - do: Make sure a policy-bearing group is among them.
    note: A key that mints only a label group enrols a peer that no rule covers — reachable by nothing,
      reaching nothing, and looking fine.
  - do: Treat expiry as normal.
    note: Keys expire. A fleet-wide enrolment failure is usually this before it is anything more interesting.
  - do: Remember attribution stops at the key.
    note: Membership forensics name the key, not the person. If you want a human attributed, the key's
      own provenance is what carries it.
- id: gear-classes
  title: Gear classes — a class per function, composing by union
  level: mastery
  minutes: 30
  quirks:
  - claim: '`OPSYSTEM` is retiring. It granted exactly what DEVELOPER granted, so a label that changed
      no access became free to apply — and absorbed end-user desktops, sensor nodes and effector ground-control
      alike. An admin rule correct against the DOCUMENTED meaning handed site admins any-port reach
      into a colleague''s workstation. The rule was never wrong; the group was.'
    evidence: docs/adr/1116-retire-opsystem-gear-classes.md
    so: Before applying a label, ask what access it changes — one that changes nothing gets applied
      to everything and becomes meaningless.
  - claim: '`SENSOR` and `EFFECTOR` are RESERVED AND EMPTY, appearing in no rule. A peer placed in one
      is uncovered and the coverage report says so. That is the intended signal, not a gap to fill.'
    evidence: docs/design/mesh-and-ory-roles.md
    so: If a peer is uncovered, treat the coverage report as correct and pick a real class.
  - claim: Destination-only classes have an EMPTY source list. Tasking and commands arrive through the
      FABRIC, where write authz is the gate — nothing may open a direct L4 control path to gear.
    evidence: docs/design/mesh-and-ory-roles.md
    so: Never open a direct control path to gear; tasking arrives through the fabric where write authorization
      is the gate.
  - claim: Recurring class combinations are PROFILES, not new classes. Fusing two orthogonal statements
      into one label re-creates the OPSYSTEM error at a new altitude.
    evidence: docs/design/mesh-identity-operations.md
    so: When you want a new class for a common pair, write it down as a profile instead.
  drill:
    do: Classify one real box by function and decide whether it needs one class or several.
    pass: Every class you name is justified by a function the box actually performs.
    safety: read-only
  deeper:
  - doc: docs/design/mesh-and-ory-roles.md
    why: Every class, its shape (source-only / both / destination-only), and why the reserved ones are
      empty. (§"gear classes" and §"What the gear classes actually resolve to")
  - doc: docs/adr/1116-retire-opsystem-gear-classes.md
    why: The decision, and the failure that produced it.
  status: written
  summary: Gear is classified by function, and the classes compose by union. A box that publishes and
    accepts tasking holds both classes — the feed class carries its outbound reach, the tasking class
    carries only who may direct it.
  walkthrough:
  - do: Classify by function, then check whether one class is enough.
    note: One class per function the box performs. Two functions, two classes.
  - do: Learn the three shapes.
    note: Source-only publishes and is initiated toward by nothing. Both is ours and administrable.
      Destination-only is an intake surface whose source list is empty on purpose.
  - do: Do not fill in the reserved classes.
    note: Some classes are reserved and appear in no rule; a peer placed in one is uncovered and the
      coverage report says so. That is the signal, not a gap.
  - do: Resist inventing a new class for a recurring pair.
    note: A recurring combination is a profile, not a class. Fusing two orthogonal statements into one
      label is exactly the error the current taxonomy replaced.
- id: network-gear
  title: Enrolling network gear — the most exposed peer on the mesh
  level: mastery
  minutes: 20
  quirks:
  - claim: 'NETWORK is strictly narrower than INFRA and deliberately asymmetric — admins reach it any-port,
      it initiates only toward management-plane services. NO fabric ports: a switch is not a publisher,
      and granting :7447 is a separate deliberate act.'
    evidence: docs/adr/1113-network-node-class-and-delegated-network-admin.md
    so: If you need a bearer device to publish, treat that as a separate authorization conversation,
      not a config tweak.
  - claim: A site network admin can enrol bearer gear without being a platform admin. That entitlement
      is site-scoped and does not extend to breakglass.
    evidence: docs/adr/1113-network-node-class-and-delegated-network-admin.md
    so: Do not assume the entitlement extends further than bearer gear — it deliberately stops short
      of the rescue path.
  drill:
    do: Read the rules for the network class on your site.
    pass: You can name every management-plane port it may reach, and confirm no fabric port is among
      them.
    safety: read-only
  deeper:
  - doc: docs/adr/1113-network-node-class-and-delegated-network-admin.md
    why: The NETWORK class, its deliberately asymmetric reach, and the delegated entitlement.
  status: written
  summary: Switches, routers and radios carry the underlay the mesh rides on, and they are the most
    physically exposed peers you will enrol. Their class is deliberately narrower than infrastructure.
  walkthrough:
  - do: Read the shape before enrolling.
    note: Admins reach it on any port; it initiates only toward management-plane services. No fabric
      ports — a switch is not a publisher, and granting one is a separate deliberate act.
  - do: Enrol with the delegated entitlement if you hold it.
    note: A site network admin can enrol bearer gear without being a platform admin. That entitlement
      is site-scoped.
  - do: Keep the vendor management path in mind.
    note: These devices have their own consoles and their own credentials; the mesh class governs reach,
      not what happens once you are on the box.
- id: breakglass
  title: Breakglass — reach-in when the control plane is the broken thing
  level: mastery
  minutes: 20
  quirks:
  - claim: Breakglass is NOT delegable, unlike NETWORK. The entitlement to enrol a switch must not extend
      to enrolling one's own way into the rescue path.
    evidence: docs/adr/1114-breakglass-node-class-and-two-path-reach.md
    so: Rehearse the second path occasionally; an unexercised rescue path is a belief, not a capability.
  - claim: A mesh-only model of breakglass describes the day you do not need it. Both paths must be
      written down before the day you do.
    evidence: docs/adr/1114-breakglass-node-class-and-two-path-reach.md
    so: Refuse requests to delegate it — the entitlement to enrol a switch must not become the entitlement
      to enrol your own way in.
  drill:
    do: Write down both reach paths to your site's breakglass node.
    pass: Neither depends on the normal control plane being up.
    safety: read-only
  deeper:
  - doc: docs/adr/1114-breakglass-node-class-and-two-path-reach.md
    why: The class, and why reach is TWO paths that must both be named.
  status: written
  summary: The node you reach when the thing that normally lets you in is the broken thing. Its value
    is entirely in having written down both paths before the day you need it.
  walkthrough:
  - do: Write down both reach paths.
    note: A mesh-only model of breakglass describes the day you do not need it.
  - do: Check neither path depends on the control plane being healthy.
    note: If both routes assume the management plane, you have one path, not two.
  - do: Know what it may reach outward.
    note: It reaches the substrate and the network gear — rescuing the switch is half the point — and
      nothing else.
  - do: Do not treat it as a general admin route.
    note: It is not delegable, and it is not a convenience path.
- id: the-goat-client
  title: The goat client
  level: working
  minutes: 20
  quirks:
  - claim: Versions below 0.3.6 REGENERATE the WireGuard key on every Connect. A peer that keeps reappearing
      as new is this, not a mesh fault.
    evidence: docs/design/goat-client.md
    so: If a peer keeps reappearing as new, check the client version before investigating the mesh.
  - claim: There is no update path and no mobile artifact today. Plan distribution accordingly rather
      than assuming clients will self-update.
    evidence: docs/design/goat-client-distribution.md
    so: Do not promise a future auto-update; there is not one.
  - claim: An installer flag the daemon does not register crash-loops it. Packaging changes are not
      cosmetic.
    evidence: docs/design/goat-client-distribution.md
    so: Test an installer change on a machine you can afford to break.
  drill:
    do: Check the client version on one device you own.
    pass: It is at or above the floor, or you know why it is not and what that costs.
    safety: read-only
  deeper:
  - doc: docs/design/goat-client.md
    why: One client, what it embeds, and the current gaps stated plainly.
  - doc: docs/operations/goat-client-install.md
    why: Install and verify.
  status: written
  summary: 'One client for participants: it embeds the mesh client and adds the parts specific to this
    system. Its current gaps matter more than its features.'
  walkthrough:
  - do: Check the version on every device you own.
    note: Versions below a specific floor regenerate their key on every connect, which makes a device
      reappear as a new peer over and over.
  - do: Plan distribution deliberately.
    note: There is no self-update path today, so 'we will push a fix later' is not available. Whatever
      you deploy is what people run until someone re-installs.
  - do: Treat packaging changes as functional changes.
    note: An installer flag the daemon does not recognise crash-loops it — packaging is not cosmetic
      here.
- id: partner-onboarding
  title: Partner onboarding
  level: working
  minutes: 25
  surface:
  - onboarding-guide
  quirks:
  - claim: Affiliation is not tier. A partner is not automatically anything, and being external does
      not by itself narrow or widen what they may do.
    evidence: docs/design/partner-onboarding.md
    so: When you catch yourself deriving permissions from affiliation, stop and read the role.
  drill:
    do: Open the guide with the partner overlay and name one thing it changes and one it does not.
    pass: Both answers, specifically.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/partner-onboarding.md
    why: The partner overlay on the guide, and why affiliation is not tier.
  status: written
  summary: Partners come in through the same rails as everyone else, with an overlay that changes what
    they are shown rather than what they are.
  walkthrough:
  - do: Read the guide with the partner overlay.
    note: Same onboarding machinery, different framing and different defaults.
  - do: Keep affiliation and tier separate.
    note: Being external is not a tier. A partner is not automatically less trusted, or more.
  - do: Check what the overlay does not change.
    note: The planes, the gates and the audit are identical. That is the point of one rail.
- id: partner-data-exchange
  title: Partner data exchange — release sets out, quarantine in
  level: mastery
  minutes: 25
  quirks:
  - claim: Inbound partner data lands in ATTRIBUTED quarantine. It is not rejected and it is not trusted
      — and treating quarantine as either loses the attribution that makes it useful.
    evidence: docs/design/partner-data-exchange.md
    so: Never wire an integration that consumes inbound partner data as if it were internal.
  drill:
    do: Trace one release set to its enforcement point.
    pass: You can name where the boundary is enforced, not just where it is described.
    safety: read-only
  deeper:
  - doc: docs/design/partner-data-exchange.md
    why: Release sets outbound, attributed quarantine inbound, and the two lanes.
  status: written
  summary: Data leaves as declared release sets and arrives as attributed quarantine. Both directions
    are deliberate, and the inbound half is the one people get wrong.
  walkthrough:
  - do: Trace one release set from declaration to what a partner receives.
    note: Find the enforcement point rather than the intention.
  - do: Treat inbound as quarantined AND attributed.
    note: It is not rejected and it is not trusted. Treating it as either loses the attribution that
      makes it useful.
  - do: Decide who promotes quarantined data, and on what basis.
    note: That decision is the actual control; the quarantine is just where it waits.
- id: read-partition
  title: The partner read partition
  level: mastery
  minutes: 20
  quirks:
  - claim: Read and write enforcement are separate and both live. Reasoning about one from the other
      is the recurring error.
    evidence: docs/design/partner-read-partition.md
    so: Never infer a write restriction from a read restriction, or the reverse.
  drill:
    do: For one partner, state what they can read and what they can publish.
    pass: Two different answers, each with an enforcement point you can name.
    safety: read-only
  deeper:
  - doc: docs/design/partner-read-partition.md
    why: How read and write enforcement partition, and the rel-them / rel-all lanes.
  status: written
  summary: Read and write enforcement for partners are separate mechanisms. Reasoning about one from
    the other is the recurring error.
  walkthrough:
  - do: For one partner, list what they can read.
    note: Read partitioning has its own enforcement point.
  - do: Separately, list what they can publish.
    note: Different mechanism, different answer, possibly different owner.
  - do: Check both against the lanes in use.
    note: The lanes distinguish what is shared with a specific partner from what is shared with all
      of them.
- id: cross-sovereign-federation
  title: Cross-sovereign federation — when the partner owns their own everything
  level: mastery
  minutes: 30
  surface:
  - saltlick
  quirks:
  - claim: Federation is decided by ONE fact — whether the organisation runs its own sovereign
      network — and by nothing about standing. Not ally versus partner, not alliance membership,
      not how trusted they are, not whether they are external at all.
    evidence: docs/adr/1157-cross-sovereign-federation-edge-terminated.md
    so: Two of OUR OWN goatnets federate the same way a foreign nation's does, and a close ally who
      runs a node in our mesh is a pod. If a conversation about federating starts with how much we
      trust them, it has started in the wrong place.
  - claim: A pod is the DEFAULT and federation is the EXCEPTION. A partner who can run a node
      inside our mesh should, and none of this applies to them.
    evidence: docs/adr/1092-moon-pod-peer-classes.md
    so: Ask 'must they own their own authority and identity plane?' before reaching for any of
      this. If the answer is no, you are on the wrong lesson.
  - claim: The access layer matches a certificate's Subject Common Name by string equality and
      cannot see which authority issued it.
    evidence: docs/findings/F-424-the-zenoh-acl-cannot-tell-which-ca-issued-a-cert-so-a-second-trust-root-is-an-authorization-grant.md
    so: A partner root anywhere near a core router IS an authorization grant, not a smaller risk
      than one. One dedicated process holding one foreign authority, per relationship.
  - claim: The peering name is DERIVED from the pair of sovereign ids, never chosen by either party.
    evidence: docs/adr/1157-cross-sovereign-federation-edge-terminated.md
    so: If someone offers you a name to use, something is wrong. Both sides compute it and they must
      agree without negotiating.
  - claim: Equal digests prove both sides hold the identical technical configuration and NOTHING
      about authority to connect, handling obligations, notification or termination.
    evidence: docs/design/federation-package-spec.md
    so: When someone says 'the digests match, are we approved?' the answer is no. Those are decisions
      by people, recorded in a separate instrument.
  - claim: WireGuard is the transport default; IPsec is reached by declaring it and NOT declaring
      WireGuard, so the intersection decides and the preference order is never walked.
    evidence: docs/findings/F-480-the-cross-sovereign-transport-default-contradicts-itself-across-the-source.md
    so: A partner whose accreditation mandates IPsec needs no agreement from us and we cannot
      override them. The exception costs one declaration.
  drill:
    do: For one hypothetical partner, say whether they are a pod or a federation, and name the one
      fact that decides it.
    pass: Your answer turns on whether they must own their own identity plane and certificate
      authority — not on geography, not on who owns the hardware, not on how sensitive the data is,
      and NOT on their standing. An ally can be a pod; two of our own goatnets can be a federation.
    safety: read-only
  deeper:
  - doc: docs/tutorials/04-two-sovereigns.md
    why: Run both sides of a peering yourself, in containers and then on two hosts.
  - doc: docs/design/cross-sovereign-federation.md
    why: The edge-terminated design and why the boundary sits where it does.
  - doc: docs/briefs/federating-across-sovereign-boundaries.md
    why: The same material written for a partner or an accreditor, with figures. Circulate this one.
  - doc: docs/adr/1157-cross-sovereign-federation-edge-terminated.md
    why: The decision, and the driver — allies coming online in environments they own.
  - doc: docs/design/federation-package-spec.md
    why: The signed-halves format, and what matching digests do and do not establish.
  status: written
  summary: A partner who runs their own environment, their own certificate authority and their own
    identity plane. Neither side joins the other's network or vouches for the other's identities,
    and both still have to say exactly what crosses. A pod is the default; this is the exception.
  walkthrough:
  - do: Decide first whether this is a federation at all.
    note: A partner who can join our coordination plane on a key we issue, holding certificates from
      our authority, is a POD. Federation is for the partner for whom each of those is the problem.
  - do: Read the derived name and check both sides computed the same one.
    note: '`fed.<issuer>.<counterparty>.<ordinal>`. Each side''s local id is the other''s remote id.
      Neither party chooses it.'
  - do: Compose the agreement on your own side and compare digests over any channel.
    note: The comparison may travel over a channel nobody trusts — that is the point of comparing
      digests rather than documents. Equal digests, identical configuration.
  - do: Check the edge holds exactly one foreign authority, and that it is not in a core.
    note: This is F-424 in practice. A core router that can see a partner root can be satisfied by
      anything that root will sign.
  - do: Run both sides of a peering yourself.
    note: Tutorial 4 gives the command. Two synthetic sovereigns with separate authorities go through the real driver in containers, on
      a Linux machine with Docker and the wireguard module. Every side must end `fail=0 skip=0`. Tutorial 4
      walks it, then the same run on two hosts.
  - do: Say out loud what has not been proved.
    note: Whether validated cryptography was used and whether a real counterparty took part. Both are
      still no. The driver has run end to end on real hosts across the internet, both sovereigns ours.
- id: moon-pod
  title: Moon pod — a foreign-stack goatnet on one passage peer
  level: mastery
  minutes: 25
  quirks:
  - claim: '`MOON` and `POD` are not two names for the same thing. A MOON is sovereign — nothing initiates
      toward it, not even an INFRA probe. A POD is ours and is a normal admin destination.'
    evidence: docs/adr/1092-moon-pod-peer-classes.md
    so: Ask 'whose identity plane' first; everything else follows from it.
  - claim: The signed join bundle is the source of truth for the pod, not our registry.
    evidence: docs/design/goat-moon-pod.md
    so: Take the bundle as authoritative rather than reconciling it against our registry.
  drill:
    do: For one hypothetical partner box, decide which class it is.
    pass: Your answer turns on who owns the identity plane, not who owns the hardware.
    safety: read-only
  deeper:
  - doc: docs/design/goat-moon-pod.md
    why: The pod, the signed join bundle as source of truth, and the two peer classes.
  - doc: docs/adr/1092-moon-pod-peer-classes.md
    why: MOON vs POD — sovereign box vs appliance inside our planes.
  status: written
  summary: A pod is somebody else's stack reachable through one passage peer. The distinction that matters
    is who owns the identity plane, not who owns the hardware.
  walkthrough:
  - do: Decide which class the box is.
    note: 'One class is sovereign: nothing initiates toward it, not even a health probe, and its presence
      here is a single data passage. The other is ours, inside our identity planes, and a normal administrable
      destination.'
  - do: Read the join bundle as the source of truth.
    note: For a sovereign pod, the signed join bundle is authoritative — not our registry.
  - do: Do not probe a sovereign pod.
    note: Health arrives by publication. A probe is a boundary violation, not a diagnostic.
- id: external-icam
  title: External ICAM federation
  level: mastery
  minutes: 25
  quirks:
  - claim: Recognition is not authorization. Federating a trust anchor tells you who someone is; it
      grants nothing.
    evidence: docs/design/federated-trust-model.md
    so: When someone says 'they are federated so they should have access', separate the two claims out
      loud.
  - claim: CAC ingress is DEFAULT-OFF. A goatnet that has not turned it on is not misconfigured.
    evidence: docs/design/external-icam-federation.md
    so: Do not treat default-off as an outstanding task; turning it on is a decision with consequences.
  drill:
    do: Name which mode your goatnet runs, if any, and point at what decides it.
    pass: You can point at the configuration, not at a belief.
    safety: read-only
  deeper:
  - doc: docs/design/external-icam-federation.md
    why: Default-off CAC ingress, the three modes, and one Kratos-OIDC contract.
  - doc: docs/design/federated-trust-model.md
    why: Recognition is not authorization.
  status: written
  summary: Federating an external identity provider says who somebody is. It grants nothing. Keeping
    those two ideas apart is the whole subject.
  walkthrough:
  - do: Check whether your goatnet runs it at all.
    note: It is default-off. A goatnet without it is not misconfigured.
  - do: Learn the three modes and which one you are in.
    note: They differ in how much of the external identity is trusted and for what.
  - do: Map recognition to authorization explicitly.
    note: A federated principal still needs groups and grants here. Recognition is the front door, not
      the room.
- id: track-governance
  title: Tracks — when to pick one up, and when not to
  level: basics
  minutes: 15
  quirks:
  - claim: Pickup is OPT-IN. Read-only exploration, a single commit, or under fifteen minutes of work
      does not need a track — coordination overhead on trivial work is the failure mode this model was
      written against.
    evidence: docs/adr/0006-multi-agent-human-concurrency-governance.md
    so: Do not open a track for fifteen minutes of work; coordination overhead on trivial work is the
      failure this model was written against.
  - claim: A malformed track yaml is SKIPPED, not fatal — the warning goes to stderr, so it disappears
      the moment you pipe the output. A track missing from `work list` is more often unparseable than
      released. `save()` then refuses to persist, deliberately, so the orphan GC cannot delete a track
      the process never read.
    evidence: ops/work/main.go
    so: If a track vanishes from the list, suspect a malformed file before assuming it was released
      — the warning goes to stderr and disappears when piped.
  drill:
    do: List the live tracks and decide whether your intended work overlaps one.
    pass: You can name the overlap or say confidently that there is none.
    safety: read-only
    run: work list
    check:
      run: "ops/work/work list"
      expect: exit-zero
      why: >-
        The drill's first half is 'list the live tracks'. Deciding whether your work overlaps
        one is the half only a person can do.
  deeper:
  - doc: docs/adr/0006-multi-agent-human-concurrency-governance.md
    why: The concurrency model — opt-in coordination, not a tax on every keystroke.
  - doc: ops/work/main.go
    why: The work CLI itself — pickup, update, release, bus. The behaviour is the documentation here.
  status: written
  summary: Coordination here is opt-in. Most work needs none; the work that needs it is long, shared,
    or touching something others are also touching.
  walkthrough:
  - do: Decide whether your work is track-shaped.
    note: Multi-commit, multi-hour, shared substrate, or spanning sessions. Read-only exploration and
      single commits are not.
  - do: If it is, pick it up before you start.
    run: work list
    note: Check for overlap first; the point is telling other people, not filling in a form.
  - do: Mark commits with the track.
    note: That trailer is what connects the work to the coordination record.
  - do: Release it when done, with a summary someone can read cold.
    note: The summary is the durable artifact — write it for a reader who was not there.
- id: session-isolation
  title: Session isolation — worktrees
  level: basics
  minutes: 15
  quirks:
  - claim: The master worktree is READ-ONLY, enforced by hooks. Off-main work happens in a worktree;
      the hook refusing your write is the system working.
    evidence: ops/scripts/iso.skill.md
    so: When a hook refuses a write, move to a worktree rather than working around it.
  - claim: Stash is banned. `refs/stash` is repo-global, so a stash in one worktree collides across
      every concurrent session.
    evidence: ops/scripts/iso.skill.md
    so: Commit work in progress instead of stashing; stash is shared state.
  - claim: Worktrees lack `.envrc.local.d`. Secrets resolved by direnv in the master tree are absent
      in a worktree, and the resulting failure looks like a credential problem.
    evidence: docs/operations/local-secrets-pattern.md
    so: If a credential is missing only in a worktree, check the environment loading before requesting
      access.
  drill:
    do: Confirm which worktree you are in and whether it is the main one.
    pass: You can say which, and name your branch.
    safety: read-only
    run: git worktree list
    check:
      run: "git rev-parse --git-dir >/dev/null && git rev-parse --git-common-dir >/dev/null"
      expect: exit-zero
      why: >-
        Verifies the two commands that answer the drill both work here. WHICH worktree you
        are in, and whether it is the right one, is the drill and needs a person.
  deeper:
  - doc: ops/scripts/iso.skill.md
    why: The enter / exit / resume cycle and the operating-directory contract.
  - doc: docs/design/worktree-hygiene.md
    why: Why worktrees accumulate, and the reaper.
  status: written
  summary: Work happens in a per-session worktree, not on the shared trunk checkout. The hooks that
    enforce that are protecting concurrent sessions from each other.
  walkthrough:
  - do: Enter a worktree before writing anything.
    note: The main checkout is read-only by hook. A refused write is the system working.
  - do: Know where you are.
    run: git worktree list
    note: Every file operation should be against your own worktree path, explicitly.
  - do: Do not reach for stash.
    note: The stash is repository-global, so it collides across concurrent sessions. Commit a work-in-progress
      instead.
  - do: Expect secrets not to be there.
    note: Per-directory environment files do not exist in a worktree; a missing credential in a worktree
      is usually this rather than a real access problem.
- id: commit-and-pr-conventions
  title: Commits and pull requests
  level: basics
  minutes: 15
  quirks:
  - claim: MERGEABLE / CLEAN is not the same as current. If both sides touched a file, merge main IN
      and re-run the tests before merging a stale branch.
    evidence: docs/design/pr-governance.md
    so: Treat 'mergeable' as a statement about conflicts, not about correctness.
  - claim: Two remotes take real merges and nothing automates the sync. Check both before claiming an
      ADR or finding number.
    evidence: CONTRIBUTING.md
    so: Check both remotes before you claim an ADR or finding number.
  drill:
    do: Read the last five commits on the trunk and write a compliant subject for your own change.
    pass: Yours matches the convention without looking it up again.
    safety: read-only
  deeper:
  - doc: CONTRIBUTING.md
    why: Trunk-based, signed DCO, squash-merge, Conventional Commits — and the two-repo situation.
  - doc: docs/design/pr-governance.md
    why: What a reviewable PR looks like here.
  status: written
  summary: Trunk-based, signed, squash-merged, conventionally titled. The conventions are small; the
    two that bite are about currency and about which remote you are looking at.
  walkthrough:
  - do: Write the subject as a conventional commit.
    note: Type, scope, and a sentence that says what changed for a reader who was not there.
  - do: Sign your commits.
    note: It is enforced, and it is what makes attribution mean something later.
  - do: Merge main IN before merging a stale branch out.
    note: A green, mergeable branch is not necessarily current. If both sides touched a file, integrate
      and re-run the tests.
  - do: Check both remotes before claiming an identifier.
    note: Two remotes take real merges and nothing automates the sync, so a number free on one may be
      taken on the other.
- id: adrs-findings-measurements
  title: ADRs, findings and measurements — which one am I writing?
  level: working
  minutes: 20
  quirks:
  - claim: Finding IDs RACE under concurrent sessions, across two unsynced remotes. Claim yours by pushing,
      not by intending.
    evidence: docs/findings/INDEX.md
    so: Push early to claim a number; intending to use one claims nothing.
  - claim: A finding is not a bug report. It records the trap and the evidence — including, sometimes,
      that the claim was false and how the false claim was produced.
    evidence: docs/findings/INDEX.md
    so: Include how the wrong conclusion was produced — that is what makes a finding reusable.
  drill:
    do: Take something you learned the hard way recently and decide which of the three it is.
    pass: You can justify the choice in one sentence.
    safety: read-only
  deeper:
  - doc: docs/adr/0005-decision-log-vs-design-doc.md
    why: When a thing is a decision and when it belongs in a design doc.
  - doc: docs/findings/INDEX.md
    why: What a finding is — a trap, with evidence, written so the next person does not pay for it twice.
  - doc: docs/measurements/INDEX.md
    why: What a measurement is, and why it is not a finding.
  status: written
  summary: Three record types, three different jobs. Choosing correctly is most of the value; writing
    it well is the rest.
  walkthrough:
  - do: Decide which one you are writing.
    note: A decision with alternatives is a record of decision. A trap with evidence is a finding. A
      number obtained by measuring is a measurement.
  - do: Write a finding for the next person, not for yourself.
    note: The trap, the evidence, and how the wrong conclusion was produced. That last part is often
      the most useful.
  - do: Claim your identifier by pushing, not by intending.
    note: Numbers race under concurrent sessions across two unsynced remotes.
  - do: Record retractions rather than deleting them.
    note: A finding that turned out to be false is still evidence — about method.
- id: ci-gates-you-will-meet
  title: The CI gates you will meet
  level: working
  minutes: 20
  quirks:
  - claim: Diff-scoped guards UN-GRANDFATHER legacy hits. Touching an old file for an unrelated reason
      can fail the build on a spillage that predates you.
    evidence: .github/workflows/identity-spillage.yml
    so: Budget for the un-grandfathering when you touch legacy files.
  - claim: A `paths:` filter on a GENERATED directory rebuilds on everything. `.dockerignore` proves
      what is actually build input.
    evidence: F-327
    so: Fix the filter rather than the symptom when a build rebuilds everything.
  drill:
    do: Run one repository check against your working tree.
    pass: It passes, or you can read the refusal and name the cause.
    safety: read-only
    check:
      run: "ops/ci/check-adr-index-complete.sh"
      expect: exit-zero
      why: >-
        Stands in for 'run one repository check against your working tree' with a check that is
        fast, offline and read-only. Deliberately an EXISTING check on main rather than one
        added alongside: a check pointing at a script from its own branch passes locally and
        fails the moment the two are reviewed separately.
  deeper:
  - doc: .github/workflows/identity-spillage.yml
    why: The guard that refuses age recipients and SSH pubkeys in committed files.
  - doc: ops/ci/check-claude-md-size.sh
    why: The 30 KB cap on CLAUDE.md — index only, narrative goes to a design doc.
  - doc: docs/design/environment-parity.md
    why: One-fact-one-home pins and declared deviations — the parity gates in one place.
  status: written
  summary: The build refuses several classes of change on purpose. Meeting them once with an explanation
    is much cheaper than meeting them at merge time with a deadline.
  walkthrough:
  - do: Run the checks locally before you push.
    note: Most of them are scripts you can run in a second.
  - do: Expect diff-scoped guards to un-grandfather old files.
    note: Touching an old file for an unrelated reason can surface a pre-existing violation. That is
      the ratchet working, not a flaky build.
  - do: Do not add a path filter to a generated directory.
    note: It rebuilds on everything; prove what is actually build input instead.
  - do: Read a refusal as information.
    note: Every one of these guards exists because something went wrong once. The message usually names
      it.
- id: doc-boundaries
  title: Document boundaries — one fact, one home
  level: working
  minutes: 15
  quirks:
  - claim: TWO pages claiming one job means only one gets maintained. One such pair drifted 33 commits
      to 0 over three weeks, and the stale one was the one every new person was sent to.
    evidence: F-326
    so: When you find two pages doing one job, merge them or delete one — do not maintain both.
  - claim: The bar is four onboarding paths, each completable with ONE primary doc plus one rollback.
      A change that needs a fifth doc to explain has spent budget it must justify.
    evidence: docs/design/complexity-budget-and-encapsulation.md
    so: Push narrative out of the index and into the document that owns it.
  drill:
    do: Before your next document, find the one that already owns the fact.
    pass: You either extend it, or you can say why a new home is correct.
    safety: read-only
  deeper:
  - doc: docs/design/complexity-budget-and-encapsulation.md
    why: The complexity budget and the four-onboarding-paths bar.
  - doc: docs/design/design-system.md
    why: The documentation and design conventions.
  status: written
  summary: One fact, one home. The failure mode is not missing documentation — it is two pages claiming
    the same job, of which only one gets maintained.
  walkthrough:
  - do: Before writing a new document, find the one that already owns the fact.
    note: Extending it is almost always right.
  - do: If you write a second page anyway, say why in it.
    note: A stated reason can be argued with. An unstated one becomes drift.
  - do: Keep the index an index.
    note: Pointers, not narrative. It is size-capped for a reason — standing context costs every session
      that loads it.
  - do: Mind the onboarding-path budget.
    note: The bar is that each onboarding path is completable with one primary document plus one rollback.
      A change needing a fifth document has spent budget it must justify.
- id: find-whats-published
  title: Finding what other people publish
  level: working
  minutes: 15
  status: written
  summary: >-
    A goatnet is only useful if you can see what is on it. One command lists
    every topic every org has declared; from a topic you can reach its schema
    and then its live data. None of it needs an operator to run it for you.
  quirks:
  - claim: >-
      Browsing the catalog needs nothing more than the credential you already
      have. Topic visibility is advisory, not access.
    evidence: docs/adr/1028-topic-interface-visibility.md
    so: >-
      If a discovery surface refuses your key, treat it as a defect and report
      it, rather than assuming you were not meant to see it.
  - claim: >-
      A listed topic is a DECLARATION, not proof that anything is flowing. The
      registry records what an org said it would publish.
    evidence: docs/operations/fabric-discovery.md
    so: >-
      Never conclude from the catalog alone that a feed is live. Ask the
      freshness command, or subscribe and watch.
  - claim: >-
      Most orgs on a busy goatnet have declared no topics at all, so the
      catalog is far shorter than the org list.
    evidence: docs/operations/fabric-discovery.md
    so: >-
      A short catalog is not a broken one. The page tells you how many orgs it
      left out; read that number before concluding the fabric is empty.
  - claim: >-
      There is no list of subscribers anywhere. The fabric is brokerless, so
      nothing sees the full set.
    evidence: docs/design/zenoh-brokerless-consequences.md
    so: >-
      Do not go looking for "who is reading my topic". Design as if you will
      never know.
  walkthrough:
  - do: List every topic declared on the goatnet.
    note: >-
      One row per topic across every org, with the wire format and a
      description. This is the whole declared surface in one screen.
  - do: Narrow to one org, then to one namespace inside it.
    note: >-
      The first segment of a key is the org. Passing any prefix of a key
      filters to it, so you can walk down a namespace rather than scrolling.
  - do: Show one topic's record.
    note: >-
      Format, schema reference and description. The format tells you how to
      read the bytes before you commit to subscribing.
  - do: Render that topic's schema as a field tree.
    note: >-
      Field numbers, types and names. This is what you code against. Ask for
      the version list if more than one exists.
  - do: Subscribe and watch the live data.
    note: >-
      If nothing arrives, the tool says which kind of nothing it is after a few
      seconds — a quiet topic, no router, or a key that can never match.
  drill:
    do: >-
      Starting from nothing but your own credential, find a topic published by
      an org that is not yours, read its schema, and watch one live message
      from it.
    pass: >-
      You can name the topic, state its wire format and one field from its
      schema, and you saw at least one message arrive.
    safety: read-only
    needs: fabric
  deeper:
  - doc: docs/operations/fabric-discovery.md
    why: >-
      The full walkthrough, both the command line and the portal, plus what an
      empty answer means.
  - doc: docs/adr/1028-topic-interface-visibility.md
    why: Why anyone on the goatnet may browse what anyone else has declared.

- id: goatlite-first-goatnet
  title: Stand up a goatlite and use it
  level: working
  minutes: 60
  status: planned
  summary: >-
    The quickstart is written: one box or VM, one file of four facts, one command, and a goatnet
    you enrol into, sign in to, and publish on. The lite preset, the derivation and the fixture
    rehearsal are built; the cold-read drill, a non-author taking a fresh VM to a green assay and a
    round-trip publish from the quickstart alone, has not run. This module opens when it has.
  deeper:
  - doc: docs/tutorials/00-goatlite.md
    why: The quickstart itself — the one file, the rehearsal, the phases in plain words, the browser step, and using it.
  - doc: docs/design/goatlite.md
    why: What the lite preset decides for you, what the first hour looks like, and the ten-rung ladder this lane walks.
- id: break-fix-rebuild
  title: Break it, read the error, fix it, tear it down and rebuild
  level: working
  minutes: 45
  status: written
  summary: >-
    A goatnet you can only stand up is one you do not yet run. This module is the week-one
    troubleshooting path on your own goatnet: make something fail on purpose, read the
    interpretation every error carries, find the first failing row of the acceptance gate, fix the
    cause, resume by phase number, and rehearse the burn-down and the rebuild on the fixture until
    both are routine.
  walkthrough:
  - do: Make a write fail on purpose, and watch how little the fabric tells you.
    run: goat pub somebody-elses/prefix/v1 --payload probe --confirm
    note: >-
      Without the confirm flag the publish returns as if it worked; the router denied it and said
      nothing. With it, the builder reads the value back and prints a landed-or-not verdict with a
      non-zero exit.
  - do: Paste the error back in and read the four lines it carries.
    run: goat explain E_OFF_MESH
    note: >-
      What happened, the likely cause, what to do, where to read. Any code or any pasted text
      works, with either binary, offline. When nothing matches, the report flag writes the text to
      a file to share so the catalog grows.
  - do: Ask the gate what is wrong with the goatnet as a whole.
    run: goatbuilder assay <your-site>
    note: >-
      Layer by layer. Read the first row that is not a pass. A row that could not run is unknown,
      never a pass, and the command exits 3 until there are none.
  - do: Fix the cause, then resume the standup from the phase the failing row belongs to.
    run: goatbuilder standup <your-goatnet> --site <your-site> --from <phase>
    note: Every phase is idempotent. A re-run of a phase that already converged changes nothing.
  - do: Rehearse the burn-down on the worked example, then stand it up again.
    run: goatbuilder teardown zagros --site alpha --mock <your-copy-of-the-fixture>
    note: >-
      On the fixture the teardown runs the phases in reverse and appends teardown rows to the
      records; it never erases them. Then run the standup on the same copy and read the records:
      the burn-down and the rebuild are both there.
  - do: Print the burn-down order for your real goatnet, and read what it refuses.
    run: goatbuilder teardown <your-goatnet> --site <your-site> --dry-run
    note: >-
      On real hosts the verb prints the order and refuses to execute a phase until that phase
      declares its teardown play. The services-only flag stops the containers and keeps every
      volume, which is the safe first move when you want a clean restart without losing data.
  quirks:
  - claim: >-
      A denied write is silent at both ends. The publish returns locally as if it landed, the
      router logs nothing you can see, and the subscriber simply never hears it.
    evidence: docs/findings/F-177-zenoh-acl-ingress-denial-is-silent-at-both-ends.md
    so: >-
      When a message does not arrive, confirm the write first and check your write prefix with the
      access verbs before you touch anything on the router.
  - claim: >-
      The error catalog is compiled into both binaries, so explain works on a machine with no
      checkout and no network. At a terminal the interpretation prints under the error; in a log or
      a CI step only the one-line error and its code are kept.
    evidence: docs/design/error-interpretation.md
    so: >-
      When you read a captured log, paste the code it names into explain to get the interpretation
      the terminal would have shown.
  - claim: >-
      The acceptance gate's exit code is zero unless a row fails. A row that could not run is
      unknown, and unknown exits 3; neither is a pass.
    evidence: docs/design/goatnet-acceptance-suite.md
    so: Read the table and fix the first row that is not a pass. Never read only the exit code.
  - claim: >-
      Teardown on real hosts is deliberately incomplete: it prints the burn-down order and refuses
      to execute any phase that has not declared its teardown play. Only the fixture runs the whole
      burn-down.
    evidence: docs/design/goatbuilder-speed.md
    so: >-
      Rehearse the full burn-down and rebuild on the fixture. On your goatnet, use the services-only
      flag for a clean restart, and the dry run to see which phases can be torn down today.
  drill:
    do: >-
      On a throwaway copy of the worked example, stand up the founder, tear it down, and stand it up
      again. Then read the records.
    pass: >-
      The records show the standup rows, the teardown rows appended after them, and the second
      standup's rows after those; the last line of the second standup says every record names its
      declared ref.
    safety: read-only
  deeper:
  - doc: docs/design/error-interpretation.md
    why: Every error either binary prints is interpreted from one catalog; this is the troubleshooting surface and how to add to it.
  - doc: docs/reference/errors.md
    why: The generated reference of every code the catalog knows.
  - doc: docs/design/goatnet-acceptance-suite.md
    why: What each row of the assay proves and the defect it catches.
  - doc: docs/design/phoenix-architecture.md
    why: Teardown and rebuild as a routine practice rather than a crisis, and what a peer must be so that a rebuild is trivial.
- id: tutorial-boundary-node
  title: 'Tutorial 3: a boundary node for ally and partner sharing'
  level: working
  minutes: 40
  status: written
  summary: >-
    The third tutorial stands up a boundary node: one dedicated router on an edge host that lets
    your goatnet release chosen data to a counterparty who runs their own goatnet under their own
    authority, without either side joining the other's network. You rehearse the plan on your
    laptop; the live run needs the counterparty, so it is the one tutorial you cannot finish alone.
  walkthrough:
  - do: Read the three levels of access and what holds a partner at each one.
    note: >-
      Recognised means you hold their trust bundle and nothing else. Connected means they can
      complete a TLS session to your edge. Exchanging means one access rule names their agreed
      certificate, scoped to the release prefix and nothing else. Each step is a separate
      deliberate act.
  - do: Rehearse the plan on the worked example with a one-line stand-in for the agreement.
    run: goatbuilder federate hello-ally --as zagros --work <your-work-dir> --dry-run
    note: >-
      The dry run prints all eleven phases and the exact command each would run, and touches
      nothing. The stand-in agreement is what lets phase 10 show the transport the way a real plan
      does. Compare your output with the tutorial's recorded checkpoint.
  - do: Find the manual phase and the phase that reads the agreement.
    note: >-
      Phase 4 is the package exchange and stops the run on purpose. Phase 10 opens the transport
      the agreement chose, read from the agreement itself, never from a preference order.
  - do: Before a live run, gather what the driver cannot create.
    note: >-
      A counterparty with their own goatnet, an edge host on neither side's management plane, the
      peering declared in your configuration, the partner's verifying key bound out of band, and a
      validated-cryptography fabric image on both edges.
  - do: Run it for real up to the manual phase, exchange packages, then resume.
    run: goatbuilder federate <peering> --env <your-goatnet> --as <your-code> --from 5
    note: >-
      Composition refuses for any party whose key is not bound. The exit codes are specific, so
      read them: a composition refused, a lint refused, a diff refused, a value that could not be
      derived.
  - do: Prove it with the acceptance gate, in its own words.
    note: >-
      Carries, refuses, round-trips. A sample on your egress lane reaches the partner and theirs
      reaches you; a write outside the agreed prefix is denied; a nonce you emit comes back from a
      responder on their side with the digest matching. The round trip is last because it is the
      only stage that fails when an earlier one silently half-works.
  quirks:
  - claim: >-
      Holding a partner's trust bundle grants them nothing, and that is enforced: no tunnel is up,
      and a guard keeps their bundle off every core host.
    evidence: docs/design/cross-sovereign-federation.md
    so: >-
      Treat the bundle exchange as the start of recognition, not of access. Access is the one rule
      in phase 8, and it exists only after the agreement is composed and verified.
  - claim: >-
      A partner key taken from the package it verifies proves nothing. Phase 5 refuses to compose
      for any party whose verifying key was not bound out of band.
    evidence: docs/tutorials/03-boundary-node.md
    so: >-
      Bind the partner's key over a channel authenticated independently of this link before you
      resume at phase 5, and record both keys as the plan names.
  - claim: >-
      Phase 10 refuses when the two parties' packages do not intersect on a transport this
      repository can stand up. It never substitutes the other transport.
    evidence: docs/findings/F-495-the-agreement-selects-wireguard-and-only-ipsec-has-a-play.md
    so: >-
      A tunnel that does not match the agreement is the drift the flow exists to prevent. When
      phase 10 refuses, the fix is in the agreement, never in the play.
  - claim: >-
      Denial on the fabric is silent, so the acceptance gate's refuses stage is checked by live
      fire, never by reading the configuration.
    evidence: docs/findings/F-177-zenoh-acl-ingress-denial-is-silent-at-both-ends.md
    so: Run the gate after any change at the edge. A configuration that reads right proves nothing.
  - claim: >-
      Dropping the partner's authority file alone does not tear down a session already up. Cutting
      a peering is remove, reload, and terminate the session.
    evidence: docs/design/cross-sovereign-federation.md
    so: >-
      When you cut a peering, do all three steps on your own edge host and confirm no session
      remains. The authority file is the revocation instrument; one per peering, so rotating it
      retires exactly that partner.
  drill:
    do: >-
      Run the tutorial's dry-run rehearsal with the one-line agreement stand-in and compare your
      output with its recorded checkpoint.
    pass: >-
      Your output matches the checkpoint line for line, you can point at the manual phase, and you
      can say why phase 10 names the transport it does.
    safety: read-only
  deeper:
  - doc: docs/tutorials/03-boundary-node.md
    why: The tutorial itself — the words, the three levels, the rehearsal, the real run, the gate and the undo.
  - doc: docs/design/cross-sovereign-federation.md
    why: The trust model, the edge profile, the release namespaces and how a peering is cut.
  - doc: docs/operations/sovereign-federation-runbook.md
    why: The canonical procedure behind every phase of the peering.
  - doc: docs/adr/1157-cross-sovereign-federation-edge-terminated.md
    why: The decision — one forwarding router per sovereign root, terminated at the edge.
  - doc: docs/measurements/M-113-cross-sovereign-federation-live-fire-both-directions.md
    why: The peering flow fired in both directions between two purpose-built environments.
- id: release-across-the-boundary
  title: Release data across the boundary into another sovereign environment
  level: mastery
  minutes: 40
  status: planned
  summary: >-
    Waits on cross-sovereign federation between live goatnets, ADR 1020, which is not built, and on
    grant encryption surviving the federation edge, F-481. No document today gives a learner a
    release command to run across a boundary.
  deeper:
  - doc: docs/design/partner-data-exchange.md
    why: Release sets out, attributed quarantine in.
- id: per-reader-grant-encryption
  title: Seal released data so only the intended receiver can read it
  level: mastery
  minutes: 30
  status: written
  summary: >-
    The router's access rules decide who may write; they cannot decide who may read a stream, and
    they are static. Grant encryption is the per-reader control: a message is sealed when it is
    published to the readers its release set grants, so a copy forwarded or stored by mistake can
    be opened only by them. It is a standard production control, not something you build, and the
    everyday path is two flags on the verbs you already use.
  walkthrough:
  - do: Check that your own decrypt key is published, so sealed data can reach you.
    run: goat access key
    note: >-
      With no subcommand this answers whether the key for your anchor is in the recipient store. A
      miss names the remedy.
  - do: Publish one sample sealed to the granted audience of your release set.
    run: goat pub <your-anchor>/cop/v1 --sealed --key-service-bundle <key-service-root.pem> --trust-domain <your-trust-domain> < event.pb
    note: >-
      The two trust flags name the key service's root and your goatnet's trust domain; the seal
      itself is done by the shared library the command delegates to. The verb prints that the
      payload was sealed to the audience of your release set.
  - do: Subscribe with the open flag and read the payload back.
    run: goat sub '<your-anchor>/**' --open --key-service-bundle <key-service-root.pem> --trust-domain <your-trust-domain> --take 1 --for 60s
    note: >-
      The open flag fetches the key bundle for the release set's current generation and verifies
      its signer before it unwraps anything. A reader the release set does not grant gets bytes it
      cannot read.
  - do: Subscribe once more without the open flag.
    run: goat sub '<your-anchor>/**' --take 1 --for 60s
    note: Ciphertext. This is what a forwarded or mistakenly stored copy looks like to anyone outside the grant.
  - do: Rotate your leaf key when the policy or an incident says so.
    run: goat access key rotate
    note: >-
      Rotation changes the member key the grant unwraps to; the release set's next generation is
      wrapped to the new one. A reader who lost the grant stops being able to open new generations.
  quirks:
  - claim: >-
      The router's access rules are static and never carry a read grant. Every enrolled
      certificate can subscribe to any stream that is not carved out; the seal is the only
      per-reader read control.
    evidence: docs/adr/1208-sovereign-environments-release-namespaces-and-grant-encryption.md
    so: >-
      When a stream must reach only some readers, seal it. Do not look for a read rule on the
      router; there is none to write.
  - claim: >-
      The portal's access label on a topic is a label. It records intent and is not a control;
      nothing enforces it.
    evidence: docs/adr/1208-sovereign-environments-release-namespaces-and-grant-encryption.md
    so: Never cite the label as the reason data is protected. Cite the grant and the seal.
  - claim: >-
      The command-line tool holds no cryptography of its own. The sealed and open flags delegate to
      the frozen grant-crypto library; the same library is usable from other languages.
    evidence: docs/design/grant-crypto-sdk.md
    so: >-
      An integration that needs to seal or open does not shell out to the tool; it links the
      library. The tool is the worked example to read.
  - claim: >-
      Key bundles are published on the fabric and retained, so a reader who is granted late can
      fetch the current generation rather than waiting for the next publish.
    evidence: docs/design/grant-keyed-encryption.md
    so: >-
      A newly granted reader who sees ciphertext should check their own key is published and that
      the key service can see them, before anyone re-publishes data.
  - claim: >-
      Grant encryption does not yet survive the federation edge. A sealed message released across a
      boundary node cannot be opened on the far side today.
    evidence: docs/findings/F-481-grant-keyed-encryption-does-not-survive-the-federation-edge.md
    so: >-
      Inside one goatnet, seal freely. Across a boundary, the release prefix is the control until
      this closes; do not promise a partner sealed delivery yet.
  drill:
    do: >-
      Publish one sealed sample to your own anchor, open it with one subscription, and watch a
      second subscription without the open flag receive the same sample.
    pass: >-
      The opening subscriber prints your payload; the plain subscriber prints bytes it cannot read;
      the publish line said the payload was sealed to your release set's audience.
    safety: writes
    needs: mesh
  deeper:
  - doc: docs/design/grant-keyed-encryption.md
    why: The mechanism — the key service, the wrapped bundles, rotation and revocation, and what is live.
  - doc: docs/design/grant-crypto-sdk.md
    why: The frozen library the verbs delegate to, and its error taxonomy.
  - doc: docs/adr/1208-sovereign-environments-release-namespaces-and-grant-encryption.md
    why: Why each sovereign runs its own environment and why sealing is the standard control.
  - doc: docs/adr/1094-grant-keyed-payload-encryption.md
    why: The decision that put per-reader encryption on the machine plane.
  - doc: docs/measurements/M-090-grant-keyed-encryption-live-fire-zagros.md
    why: The live fire — a bundle minted, published, received, rotated and revoked end to end.
