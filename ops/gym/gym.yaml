  - do: Read state on a misbehaving environment.
    note: One machine converges late, one never does, one cannot be read; only converged counts as done.
  - do: Plan a deploy, run it, prove it from the records.
    note: A dry run publishes nothing; done is what every machine's record says.
  - do: Roll back, then try to roll back a data artifact.
    note: A rollback is a new declaration at the earlier version; a data artifact is refused.
  - do: Dry-run a release and a fastlane, fix pin drift, then work the goatnet tutorials and the later
      lessons on keeping the builder current and proving a goatnet.
    note: The release and fastlane lessons read your checkout and change nothing.
- id: builder-self-update
  title: Keep the builder current, and get onto a new release
  level: basics
  minutes: 10
  quirks:
  - claim: '`goatbuilder update` verifies before it touches anything: the downloaded asset against its
      own `.sha256`, that digest against the signed `SHA256SUMS`, and, when cosign is on your PATH, the
      signature over `SHA256SUMS` — only then an atomic swap. Without cosign the signature row says it
      was not checked, which is not the same as checked and passed.'
    evidence: docs/design/goatbuilder-distribution.md
    so: Put cosign on your PATH so the signature is actually checked, and read the signature row rather
      than assuming it passed.
  - claim: A stale builder can silently reintroduce a defect a newer one fixed, so `doctor` fails while
      the binary is behind and every verb prints one behind-version line a day. `update --check` reads
      only and exits 3 when you are behind — the number a script can test.
    evidence: docs/design/goatbuilder-distribution.md
    so: Gate a run on `update --check` (exit 3 means update first), and treat a red doctor version row as
      a reason not to deploy yet.
  drill:
    do: Ask the builder whether it is current, then read its doctor version row.
    pass: You can say whether this binary is behind the release the goatnet serves, and what the check
      exited.
    safety: read-only
  deeper:
  - doc: docs/design/goatbuilder-distribution.md
    why: Where the binary comes from in each home, the verify chain, and the staleness surface.
  - doc: docs/operations/goatbuilder-first-run.md
    why: The first hour with the real binary, including where it is fetched and verified.
  status: written
  summary: 'This is how you get onto a new release. `goatbuilder update --site <site>` replaces the binary
    with the one that goatnet serves at its in-mesh download surface, verifying checksum and signature
    before the swap, exactly as goat update does — the two share one core. The check-only form reads and
    exits 3 when you are behind; doctor carries a version row that is red while the binary is stale.'
  walkthrough:
  - do: Check whether you are behind before anything else.
    run: goatbuilder update --check --site <site>
    note: It reads only. Exit 3 means the goatnet serves a newer release than you are running; exit 0
      means you are current.
  - do: Update to what the goatnet serves.
    run: goatbuilder update --site <site>
    note: It checks the asset's sha256, that digest against the signed SHA256SUMS, and the cosign
      signature when cosign is present, then swaps the binary atomically. The surface can also come from
      the last update's saved value, so the site flag is only needed the first time.
  - do: Confirm the version afterwards.
    run: goatbuilder doctor
    note: The version row names the installed version and is red while it is behind the release the
      goatnet serves.
