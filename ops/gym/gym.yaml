  - doc: docs/design/goatbuilder.md
    why: The model the lessons teach, declare, converge, verify, and every verb.
  - doc: docs/tutorials/01-new-goatnet.md
    why: Where the last two lessons lead, on real hardware.
  status: written
  summary: 'The tutor teaches every builder verb in eighteen short lessons. Each prints the exact commands
    to type against a throwaway copy of a fixture, or read-only against your checkout, and checks what
    each command did before the next lesson opens: reading state, a deploy proven from the records, a
    rollback and an unsafe one refused, the release ladder, fastlane, pin drift, the goatnet tutorials,
