version: 1
meta:
  name: goat gym
  tagline: Lanes, drills and quirks for every surface we run.
  access: public

  # Where an unhosted document actually lives, and what a reader must do to read
  # it. Declared once here rather than repeated on every module.
  #
  # LINKING THE REPOSITORY IS A DELIBERATE REVERSAL of the standing rule that
  # repo URLs stay out of served pages, because they leak org, repo and file
  # layout to viewers who have no access. A link
  # with an honest caveat beats a dead end. It is scoped to THIS surface — an
  # internal training page — and the caveat renders every time, never implied.
  repos:
    core:
      name: the goat project repository
      url: https://github.com/usareur-af/goatcore
      visibility: public
      note: >-
        Public, under the Apache License 2.0.

      open_sourcing: >-




