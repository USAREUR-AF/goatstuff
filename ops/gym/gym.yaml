modules:
- id: runnable-examples
  title: The runnable examples, and which one answers your question
  level: basics
  minutes: 15
  quirks:
  - claim: These are separate repositories, not folders in the project repository. Access is granted
      by your role when you are onboarded — you do not clone them from anywhere you already have.
    so: If one gives you a 404, that is an access level, not a missing repository. Ask rather than
      hunting for a mirror.
    evidence: docs/design/goat-gym.md
  - claim: Most of them run against a live sandbox, and a few run with no infrastructure at all. The
      ones that need nothing say so on their first page.
    so: Pick an offline one if you are reading on a laptop with no enrolment yet. You lose nothing —
      the offline ones use real signatures and real certificates, not stubs.
    evidence: docs/design/goat-gym.md
  - claim: '`hello-galaxy-cross-env-federation` runs against RELEASED artefacts — a published CLI
      binary, the federation bundle as a counterparty receives it, and a published image. It holds
      no project source at all.'
    so: A green run there is evidence about what someone outside this organisation can obtain and
      reproduce, which is a different claim from a passing test suite. If it ever starts building
      from source it has stopped testing that.
    evidence: docs/design/goat-gym.md
  - claim: Every one of them states what is running today and what is designed and not built. That is
      a house rule for the series, not a caveat someone happened to add.
    so: Read that section before you quote a capability to anybody. It is usually one short table
      near the top.
    evidence: docs/design/canon-vs-speculation-criteria.md
  drill:
    do: Open your welcome guide's Repositories page, find the example that matches what you are about
      to build, and run its first scenario end to end.
    pass: You can name the repository, say in one sentence what it demonstrates, and show the output
      of one of its scenarios.
    safety: read-only
  status: written
  summary: 'The project keeps a series of small, self-contained, runnable examples — one per
    dimension of the system, the way "hello, world" is the smallest honest example of a language.
    They exist because the constraints here are easy to get subtly wrong and much faster to read than
    to rediscover, and because each one is honest about the line between what runs today and what is
    only designed.'
  walkthrough:
  - do: Start with the two everyone needs, whatever you are building.
    note: '**Fabric usage patterns** — when one topic is right and when it is not, how to shape a key
      you can actually retrieve by, and latest-versus-history storage. **Time hygiene** — why
      participants must agree with each other about time rather than each be right about UTC, and why
      an unattested clock reads UNCONFIRMED rather than fine. Both are granted to anyone who can
      publish or subscribe, on purpose.'
  - do: Then take the one that matches your job.
    note: '**Human and machine onboarding** — the sibling ceremonies for a person, a machine, and a
      platform that decomposes into workloads. **Access management** — rotate a live actor in place,
      detect and revoke a flooding one. **Universal identity** — one portable identity descriptor
      enforced across different platforms. **SPIRE / SPIFFE federation** — two trust domains doing
      cross-domain mutual TLS.'
  - do: Take another if you handle data that crosses an organisation line.
    note: '**Partner data sharing** — releasing to one partner or a whole coalition so they see only
      what was released, on a deny-by-default fabric. **Grant-keyed encryption** — how a data owner
      restricts a stream to an audience by encrypting to it, with nothing in the read path able to
      decrypt.'
  - do: Take the pod one if you are standing infrastructure up rather than building on it.
    note: '**Stand up a pod** — a runnable pod standup and bidirectional peering smoke test, driven
      by a central registry. It leads into the **moon-pod** itself, which is the appliance you would
      actually run in your own facility.'
  - do: Know how to read one honestly.
    note: Each repository carries a section naming what is live, what is a faithful reference
      implementation, what is a model, and what does not exist yet. A demonstration that models
      something says so in the first paragraph of that scenario. Quote from the live column only.

- id: time-hygiene
  title: What the timestamps you publish are worth
  level: working
  minutes: 30
  surface:
  - panoscope
  quirks:
  - claim: A host reading `idle` on the time domain is not mildly unwell. It means UNCONFIRMED —
      either it stopped reporting, or what it reported carried no signature.
    so: Treat idle as "I do not know", never as a softer green. It is deliberately not the last good
      value either, because showing a stale value is how a board lies by omission.
    evidence: docs/design/environment-health-surface.md
  - claim: A host in chrony's orphan mode is quoting ITSELF as its own reference. Every check it runs
      on itself passes, and it is completely unanchored.
    so: Stratum 10 or above is graded degraded and never healthy, no matter how small its own offset
      looks. Do not argue with that grading when you see it.
    evidence: docs/design/universal-ntp-hygiene.md
  - claim: The colour on the time domain today is the UTC-confidence reading only. The second
      reading — internal coherence — has no field on the wire, because the engine that would measure
      it is designed and not built.
    so: Do not describe the surface as showing both watches. It shows one, and names the other.
    evidence: docs/adr/1037-fabric-internal-time-synchronization-first.md
  - claim: A board with no battery-backed clock cold-boots at 1970, and then every mutual-TLS
      handshake it attempts fails "certificate is not yet valid" — so it cannot rejoin its own mesh
      to be told what time it is.
    so: On that hardware, treat clock settling as a boot ORDERING dependency, not as something to
      alert on. Two layers exist for it and both are on by default.
    evidence: docs/design/universal-ntp-hygiene.md
  drill:
    do: Read your goatnet's time domain, then say out loud which of the two watches you just read and
      which decision it governs.
    pass: You can name the host, its verdict, how old its newest signed attestation is, and one
      operation the reading does NOT tell you about.
    safety: read-only
  status: written
  summary: 'Every node stamps its own data, and consumers order, correlate, age out and fuse by those
    stamps. What that needs is for participants to agree with EACH OTHER — not for each to be
    correct against UTC. That single distinction reshapes what "healthy" means: internal coherence
    governs whether you can publish and be ordered, UTC confidence governs certificates and anything
    leaving the fabric, and they fail at different rates when the outside world is cut off.'
  walkthrough:
  - do: Get the distinction, because everything else follows from it.
    note: Two nodes four seconds off in the SAME direction order their events perfectly. Two nodes
      each within a millisecond of UTC but disagreeing by two seconds cannot. Ordering, correlation
      and last-write-wins need the first property. Only certificates, tokens and outward-facing
      timestamps need the second.
  - do: Read the time domain on your own goatnet.
    run: goat health --domain time
    note: Per host you get a verdict, an offset, a stratum, whether a satellite receiver is
      contributing, and how old the newest SIGNED verdict is. A dash under GNSS is normal and not a
      fault — an external reference is an opportunistic anchor here, not a requirement.
  - do: Learn what the grading refuses to do.
    note: Unattested reads idle. Stale reads idle. Neither is shown as green and neither shows the
      last good value. Separately, "hosts reporting but none confirmable" and "no host reporting at
      all" are different states, because collapsing them loses the difference between a broken fleet
      and a broken dashboard.
  - do: Know why a host signs its verdict at all.
    note: A host cannot verify its own clock from the inside — a wrong one reports confidently that
      it is fine. So each signs its verdict for others to check. The signature proves WHO spoke; it
      says nothing about whether the content is true, which is why peer readings would be combined
      with a trimmed average rather than a plain one.
  - do: Separate staleness from forgery when you consume one.
    note: A valid signature over a four-hour-old verdict is a valid signature over a stale opinion.
      Signature and validity window are two checks because they are two failure modes, and the
      window is inside the signature so a relay cannot extend it.
  - do: On hardware with no battery-backed clock, settle the clock before anything reads it.
    note: Persisting the wall clock across reboots covers the offline case; stepping to correct
      before the container runtime starts covers the online one. Neither is sufficient alone.
  - do: Take the runnable version when you want to see it rather than read it.
    note: The time-hygiene example repository walks all of this in six scenarios — five of which need
      no infrastructure, and one of which verifies a real signed verdict against a readable reference
      implementation. Your welcome guide's Repositories page links it.
  deeper:
  - doc: docs/design/time-hygiene-trusted-time.md
    why: The long-form explainer — every idea in plain language first, then the real mechanism, with
      diagrams.
  - doc: docs/adr/1037-fabric-internal-time-synchronization-first.md
    why: 'The decision that inverted the model: peer synchronisation as the foundation, external
      reference as an anchor, and health split into two axes. Read its open items before assuming
      any of it is finished.'
  - doc: docs/design/universal-ntp-hygiene.md
    why: The cross-plane policy, including the table of every place time is enforced and the
      cold-boot layers.

- id: what-is-goat
  title: What goat is, in one read
  level: basics
  minutes: 25
  quirks:
  - claim: The project has three names in circulation — the current one is **goat**, lowercase. Older
      material may say GOAT-Net.
    so: Treat them as the same system. Nothing was renamed underneath you.
    evidence: docs/design/teammate-recommended-reading.md
  - claim: A document mentioning a development mesh is not talking about production. The two run different
      domains and different cloud accounts, deliberately.
    so: Check which zone a document is about before you follow its instructions.
    evidence: docs/design/teammate-recommended-reading.md
  drill:
    do: Name your goatnet, and open its Surfaces page here to see what it runs.
    pass: You can say your goatnet's name and point at one service it runs that you personally can open.
    safety: read-only
  deeper:
  - doc: docs/design/teammate-recommended-reading.md
    why: What the system is, the five layers, and the scope envelope — written for a technical generalist.
      (§1–§3)
  - doc: docs/design/architecture-spine.md
    why: Fifteen themes, each pointing at its anchor ADR and the code that implements it. The answer
      to "where does X live?"
  status: written
  summary: 'goat is a self-healing, identity-based mesh: your devices find each other through the cloud
    and keep running without it. Everything you will touch — the fabric, the consoles, the CLI — sits
    on that one idea, and most surprises come from the parts that keep working when the network does
    not.'
  walkthrough:
  - do: Understand the shape in one sentence.
    note: Devices enrol once, then talk **peer to peer** over WireGuard. A management plane in the cloud
      introduces peers to each other; relays carry traffic only when a direct path cannot be made. Nothing
      you use daily depends on the management plane being up.
  - do: Learn the three layers you will actually name.
    note: '**The mesh** — who can reach whom, on which ports. **The fabric** — how data moves between
      programs, publish/subscribe with no broker in the middle. **Identity** — who you are, carried
      separately on each of those two planes on purpose.'
  - do: Find your goatnet.
    note: 'A *goatnet* is one complete deployment: its own mesh, its own identity, its own services.
      Yours has a name, and every address you will use ends in its zone. The Surfaces page lists what
      this one runs.'
  - do: Say the scope out loud, because it prevents wrong assumptions.
    note: This is a proof-of-concept substrate at theatre scale — sound, and being discovered rather
      than asserted. Where a number is not measured, the surfaces here say `unknown` rather than guessing.
      That is a design rule, not a gap.
- id: using-the-gym
  title: How to use the gym, and how to fix it
  level: basics
  minutes: 10
  surface:
  - gym
  quirks:
  - claim: A module marked **planned** in a lane has no page yet. It is a named gap, not a broken link.
    so: Ask for it if you need it — that is how it gets prioritised.
    evidence: docs/design/goat-gym.md
  - claim: “No quirks recorded yet” is a statement about the gym, not about the surface. It means nobody
      has written the trap down.
    so: If a surface surprises you, that surprise is content. Say so.
    evidence: docs/design/goat-gym.md
  - claim: Nothing runs these drills automatically. A command that stopped working looks exactly like
      one that still works.
    so: If a drill fails in a way the page does not predict, report it — you have found drift.
    evidence: docs/design/goat-gym.md
  - claim: Every page here is machine-checked before it ships for names, addresses and places of operation,
      because this surface is open to every peer on the mesh.
    so: Do not paste any of those into a module. The gate will refuse the whole page.
    evidence: docs/design/goat-gym.md
  drill:
    do: Open this goatnet's version stamp and check it against what you were told is deployed.
    run: curl -s https://gym.<your-goatnet>/gym.json | head -5
    pass: You see a version string. If it ends in `-dirty`, the site was built from uncommitted work
      and is not any released version.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/goat-gym.md
    why: What a lane, a module, a drill and a quirk are — and the one rule the whole thing rests on.
  - doc: ops/gym/README.md
    why: How to add a module, and what the gate will refuse when you do.
  status: written
  summary: Every module here is written to be opened once, used, and left. It explains the thing as
    it works on this system, gives you one drill you can run now, and lists the quirks — the behaviour
    that is true, load-bearing and invisible until it costs you a day.
  walkthrough:
  - do: Pick your lane, not your curiosity.
    note: Lanes are ordered for someone who does not yet know why they are reading. Start at the top
      of the one that matches what you are here to do.
  - do: Run the drill. Reading is not knowing.
    note: Every drill states what passing looks like. They are read-only unless the badge says otherwise,
      and they are safe to fail — failing one usually teaches you the thing the module is about.
  - do: Read the quirks even if you skip the rest.
    note: Each quirk says what is true and **what to do about it**. They are the part that is not written
      anywhere a new person would look.
  - do: Follow *Go deeper* when you need the reasoning.
    note: Those are the project's own documents, hosted here so you can open them without a repository.
      A document that is named but not linked exists and is not published — ask a platform admin.
- id: read-the-status-page
  title: Reading the status page without being misled
  level: basics
  minutes: 10
  surface:
  - isitup
  quirks:
  - claim: A service can be declared, healthy and completely unreachable — because nothing ever published
      its name in mesh DNS. It deploys dark.
    so: If a colleague cannot resolve a service you just stood up, check the name before the service.
      The per-goatnet DNS zone is generated from these same rows for this reason.
    evidence: F-197
  - claim: The status page has no row for itself. It is the thing rendering the rows.
    so: When every row stops updating rather than turning red, suspect the status page, not the services.
    evidence: docs/design/goat-gym.md
  - claim: An interrupted deploy can leave a container running an old copy of a file while the host
      has the new one — and the next deploy reports success without fixing it.
    so: Green after a killed deploy is not proof of a good deploy. Ask for a behaviour check, not a
      status check.
    evidence: F-330
  - claim: The banner at the top counts only live services. A planned or retiring row can sit red all
      day without the banner saying anything.
    so: If you are waiting for a new service, look at its row, not the banner — the banner starts
      counting it only once it is marked live.
    evidence: docs/design/isitup-status-page.md
  drill:
    do: Find one row labelled *admins only* and predict, before clicking, whether you will get the page
      or a refusal. Then click it.
    pass: Your prediction matches — and if it did not, you can name which group you are missing.
    safety: read-only
    needs: mesh
  status: written
  summary: The status page answers one question well — is this service running where it is deployed
    — and three questions people ask of it badly. Reading it correctly is the cheapest skill on this
    system.
  walkthrough:
  - do: Open the status page for your goatnet.
    note: It is the service named *isitup*. Every row is a service this goatnet declares, grouped by
      what it is for. The sign-in, docs and tools sections start open; every other section is one line
      saying how many rows it holds and whether any is faulted, and a section with a fault opens itself.
  - do: Read the access label before you click.
    note: '**Open to every peer** means any enrolled device can open it. **Admins only** means a login
      plus a group — a green row will still hand you a 403, and that is the fence working, not a fault.'
  - do: Learn the third state.
    note: Green means up, red means down, and *probe unavailable* means the check could not run at all.
      It renders as neither, so it is the state nobody chases. It usually means the row names something
      that does not exist on the host.
  - do: Tell a planned row from a broken one.
    note: A row marked *Planned* has been declared and not brought up yet; *Retiring* is on its way out.
      Neither counts in the banner at the top, so a red dot beside one is expected, not an outage.
  - do: Know where external services live.
    note: Services that members host on this goatnet are on a separate *External services* page, linked
      at the top, each naming who runs it. For a problem with one of those, contact its owner, not the
      platform team.
  - do: Remember what green does not mean.
    note: It does not mean the container is running the version you deployed, and it does not mean the
      data behind the page is fresh. Green is *reachable*, nothing more.
- id: the-welcome-package
  title: Your welcome package, and what each part is for
  level: basics
  minutes: 15
  surface:
  - onboarding-guide
  - auth
  quirks:
  - claim: 'One-time login links can be spent before you ever click them: institutional mail scanners
      fetch every URL in a message.'
    so: Credentials are not delivered as clickable links here. If someone offers to email you one, say
      no and ask for the supported hand-off.
    evidence: F-315
  - claim: A principal created by hand on one plane looks provisioned and is not. The orchestrator exists
      because that state is worse than having nothing.
    so: If something in your package is missing, ask for a re-run rather than a manual fix.
    evidence: docs/operations/onboarding-rails.md
  drill:
    do: Log in to your goatnet's login page, then open one admin surface you believe you are entitled
      to.
    pass: You reach an authenticated page rather than a loop back to login — or you get a 403 and can
      name the group you would need.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/onboarding-rails.md
    why: What was provisioned for you across Ory, the mesh, the fabric and the bundle — and why a hand-made
      one of these is worse than none. (§"Why — a principal is a set of facts across FOUR planes")
  - doc: docs/design/onboarding-email-formula.md
    why: What each mail you received is, and what it wants from you.
  status: written
  summary: Your welcome package is not one thing. It is the visible half of a principal that was created
    across four planes at once — a login, a mesh key, sometimes a fabric certificate, and the bundle
    that tells you what you hold.
  walkthrough:
  - do: Log in once, to prove the identity plane works.
    note: Your login lives in the goatnet's identity service. Every gated console reads it, so one successful
      login means every admin surface you are entitled to will admit you.
  - do: Find your setup key and enrol one device.
    note: The key is what puts your device into the right access groups at enrolment. Which groups it
      carries, and how many devices it admits, are both decided when the key is minted — not afterwards.
      Spending its last enrolment on the wrong machine means asking for a new key, not adjusting this one.
  - do: Keep the bundle. It is the only copy of several one-time values.
    note: If it is lost, the supported path is a re-issue. Nobody can read those values back out of
      a database.
  - do: If a surface refuses you, read which plane refused.
    note: A mesh refusal looks like a connection that never completes. An identity refusal is an HTTP
      403 with a login attached. They have different fixes and different owners.
- id: install-the-cli
  title: Getting the goat CLI
  level: basics
  minutes: 10
  surface:
  - goat-get
  quirks:
  - claim: An older build could die before printing anything if the operating system's language setting
      was one it could not parse — including on `goat --version`.
    so: If the binary exits silently, run it again with `LC_ALL=C` before assuming a bad download.
    evidence: F-329
  - claim: The documentation site and the binary carry separate versions and are allowed to lag each
      other, so the download can be newer than the guide.
    so: When a flag exists in `--help` but not in the guide, believe `--help`.
    evidence: docs/design/goat-cli-hosted-docs.md
  - claim: On macOS an unsigned build launches and then hangs, rather than failing with a signing error.
    so: A hang on first run is a signing problem, not a network one.
    evidence: F-208
  drill:
    do: Install the CLI and confirm it talks to your goatnet.
    run: goat --version && goat context show
    pass: A version prints, and the context names your goatnet.
    safety: read-only
  deeper:
  - doc: docs/operations/goat-cli-install.md
    why: The install one-liner per platform, and how to verify what you downloaded.
  - doc: docs/design/goat-cli-mesh-download.md
    why: Why the binary comes from your goatnet's own `get.<site>` and not from the internet.
  status: written
  summary: 'One binary, `goat`, does the operator and participant work: health, identity, fabric inspection,
    admin actions. You download it from your own goatnet rather than the internet, so the copy you get
    is the copy that goatnet runs.'
  walkthrough:
  - do: Open your goatnet's download surface and copy the install line.
    note: It is the service whose name starts with *get*. It serves the binary for each platform plus
      a checksum.
  - do: Install it, then prove it runs.
    run: goat --version
    note: A version and exit code 0. If it prints nothing at all, see the first quirk.
  - do: Point it at your goatnet.
    run: goat context use <your-goatnet>
    note: A *context* is which goatnet the command talks to. Everything else assumes it is set.
  - do: Ask it what it can do.
    run: goat --help
    note: Reading is never gated. Only *doing* an admin action is checked, so exploring the command
      surface costs you nothing.
- id: enrol-your-laptop
  title: Enrolling your laptop into the mesh
  level: basics
  minutes: 20
  quirks:
  - claim: Installing the client inside the Windows Subsystem for Linux enrols that Linux environment,
      not the Windows machine hosting it. It has its own network. The peer registers, reports connected
      and looks healthy to whoever is watching, while the Windows browser still reaches nothing.
    so: On a Windows laptop install the Windows client. If your enrolment succeeded but no service
      opens, check which environment you actually installed into before reporting a network fault.
    evidence: docs/operations/onboarding.md
  - claim: A setup key enrols a limited number of devices, and the first enrolment that SUCCEEDS spends
      one. Nothing can un-spend it.
    so: Enrol the machine you actually work on first, not a spare or a virtual one you are testing in.
    evidence: docs/operations/onboarding.md
  - claim: Being told your setup key is invalid is an answer FROM the management server, so it proves
      you reached it. A wrong enrolment address fails earlier, at name resolution or connection, and
      never gets as far as judging your key.
    so: Do not go looking for a new enrolment address when you see it. The key is spent, expired or
      revoked — ask for a fresh one.
    evidence: docs/operations/onboarding.md
  - claim: The mesh client profile is shared device state, not a per-goatnet setting. Switching profiles
      to reach another goatnet takes you off the first one.
    so: Do not switch profiles to 'check' another goatnet while you are working. Ask for the supported
      cross-goatnet path instead.
    evidence: docs/design/env-doors.md
  - claim: A peer stuck in *connecting* with no connection attempts means the far end is offline. It
      is not your firewall.
    so: Stop debugging locally and check whether the other device is up.
    evidence: docs/design/goat-client.md
  - claim: Your computer caches the fact that a name did not exist. If you tried a name before it was
      published, it keeps failing for you after it works for everyone else.
    so: Flush your resolver cache before reporting a new service as unreachable.
    evidence: docs/design/name-fallback-resolver.md
  drill:
    do: Confirm you are on the mesh and can resolve a goatnet name.
    run: netbird status
    pass: Status reads Connected, you hold a mesh address, and one goatnet service opens in a browser.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/onboarding.md
    why: Install netbird, run the setup key, verify you are a peer.
  - doc: docs/operations/operator-laptop-hygiene.md
    why: What to do when the mesh is up but nothing resolves — the roaming-laptop failure modes.
  status: written
  summary: 'Enrolling puts your device on the mesh: it gets an address, it can resolve the goatnet''s
    names, and it talks to other peers directly. After enrolment the management plane can be down and
    your connections keep working.'
  walkthrough:
  - do: Install the mesh client and enrol with your setup key.
    note: Enrolment is once per device. The key decides which access groups the device lands in, and
      how many devices it will admit in total — your package states the count. On Windows, install the
      Windows client rather than the Linux one inside the Windows Subsystem for Linux; that subsystem
      is a separate machine and enrolling it does not put your laptop on the mesh.
  - do: Check you are connected and hold an address.
    run: netbird status
    note: You want *Connected*, and an address in the mesh range. Peer count tells you how much of the
      goatnet you can currently see.
  - do: Resolve one of the goatnet's names.
    note: Mesh names only resolve for enrolled devices, through the goatnet's own resolver. If a name
      does not resolve but the mesh is up, the name was never published — a different problem with a
      different owner.
  - do: Open any *open to every peer* service to confirm end to end.
    note: Name resolves, route works, certificate verifies. That is the whole path.
- id: the-cli-field-guide
  title: The CLI field guide
  level: basics
  minutes: 20
  surface:
  - goat-docs
  quirks:
  - claim: The written chapters and the command reference can be from different releases on purpose
      — a translated guide is not rebuilt for every patch.
    so: Trust `--help` for exact flags; trust the chapters for concepts.
    evidence: docs/design/goat-cli-hosted-docs.md
  drill:
    do: Find, in the hosted guide, the command that shows you the fabric's health.
    pass: You can name it and run it.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/goat-cli.md
    why: What the one binary does and how its command families are organised.
  - doc: docs/goat-cli-book/src/SUMMARY.md
    why: The hosted book itself — the same content served at `docs.<site>`, in 30 languages.
  status: written
  summary: The full command reference is hosted on your own goatnet, generated from the same build the
    download surface serves — so it cannot drift from what your binary actually does.
  walkthrough:
  - do: Open the documentation surface for your goatnet.
    note: It is the service whose name starts with *docs*. Searchable, and available in many languages.
  - do: Use the generated command reference for flags and defaults.
    note: That half is emitted from the binary itself. If the reference and `--help` disagree, you are
      reading a different version, not a bug.
  - do: Use the written chapters for how and why.
    note: Those are hand-written and translated, and they move on a slower cycle than the binary.
- id: the-briefing
  title: The briefing deck
  level: basics
  minutes: 15
  surface:
  - brief
  quirks:
  - claim: The briefing is a snapshot. It is redeployed deliberately rather than continuously, so it
      can lag the system it describes.
    so: Check any number you are about to quote from it against a live surface first.
    evidence: docs/operations/brief-runbook.md
  drill:
    do: Explain, from the briefing alone, what goat is for and one thing it is not.
    pass: Someone who has never seen the system can repeat your explanation back.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/brief-runbook.md
    why: What the hosted briefing is for and how it is deployed.
  status: written
  summary: The briefing is the slide deck for someone seeing goat for the first time — what it is, what
    it is for, and what it deliberately is not. Read it before you explain the system to anyone else,
    because it is the version everyone else has heard.
  walkthrough:
  - do: Open the briefing from the Surfaces page.
    note: 'It is unfenced: any enrolled peer can read it, and it is safe to show a visitor.'
  - do: Read it once end to end without stopping to check anything.
    note: It is built to be understood in one pass. Stopping to verify details is the next step, not
      this one.
  - do: Note the two or three claims you would be asked to defend.
    note: Those are the ones to go and confirm on a live surface — the briefing is a summary, and a
      summary is where drift shows up first.
- id: where-answers-live
  title: Where answers live — navigating the repo
  level: basics
  minutes: 20
  quirks:
  - claim: A file describing how something is deployed is not evidence that it is deployed that way.
      Three files once described a topology no machine actually carried.
    so: Before you act on a document's claim about live state, check a surface that reads the machine.
    evidence: F-324
  drill:
    do: Pick a behaviour on this system that surprised you, and decide which of the four places should
      answer it.
    pass: You can justify the choice in one sentence — and you find the answer there.
    safety: read-only
  deeper:
  - doc: docs/design/teammate-recommended-reading.md
    why: The three docs that carry the load before you touch anything, and where decisions vs designs
      live. (§2 "How to navigate this repo")
  - doc: docs/adr/INDEX.md
    why: Every load-bearing decision, with its reasoning. The answer to "why is it like this?"
  - doc: docs/findings/INDEX.md
    why: Every trap we have already fallen into, with the evidence. The answer to "why does it do THAT?"
  status: written
  summary: 'Answers on this system live in four places, and knowing which one you need saves the most
    time: what it is, why it is that way, what already went wrong, and what is true right now.'
  walkthrough:
  - do: For **what a thing is** — read its design document.
    note: The Library here hosts the ones the gym points at. They describe the system as designed and
      are the closest thing to a specification.
  - do: For **why it is that way** — read the decision record.
    note: Every load-bearing choice has one, with the alternatives that were rejected and the reason.
      It is the fastest way to avoid re-litigating a settled question.
  - do: For **what already went wrong** — read the findings.
    note: Each one records a trap, with evidence, written so the next person does not pay for it twice.
      Most quirks in this gym cite one.
  - do: For **what is true right now** — read the live surfaces, not any document.
    note: Status page, health, topology, dashboards. A document describes intent; only a surface describes
      state, and the two do drift.
- id: fabric-mental-model
  title: The data fabric in one read
  level: basics
  minutes: 30
  surface:
  - zenoh-router
  quirks:
  - claim: The fabric version is pinned exactly across the whole fleet, not floated. A bump is a fleet
      operation with a soak, not a dependency update.
    so: Do not build against a newer client than the goatnet runs; check the pinned version first.
    evidence: docs/design/zenoh-version-pinning.md
  - claim: '`ops/` is the current operational namespace. An older `system/` prefix still appears in
      old code and documents.'
    so: Publishing under the old prefix means nobody is subscribed. Use `ops/`.
    evidence: F-183
  drill:
    do: In the sandbox, publish one message and subscribe to it from a second tab.
    pass: You see your own message arrive, and you can say what name it travelled on.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/zenoh-data-fabric.md
    why: Seven interaction patterns on one substrate, and why there is exactly one substrate.
  status: written
  summary: 'The data fabric is how programs talk to each other here: they publish to a name and subscribe
    to a name, and the substrate gets the bytes there. There is no broker in the middle — that single
    fact explains most of what follows.'
  walkthrough:
  - do: Learn the address, not the connection.
    note: You publish to a **key expression** — a path-like name such as `ops/<domain>/health/<scope>`.
      Subscribers ask for names, including wildcards. Nobody addresses anybody's IP.
  - do: Know the three roles on the fabric.
    note: '**Publishers** put data on a name. **Subscribers** receive it live. **Storage** keeps some
      names so a late reader can query history. Storage is opt-in per class of data, not automatic.'
  - do: Find the live picture.
    note: Topology and traffic are visible in *panoscope*; a focused tail of one thing is *flashlight*.
      Between them you can see whether what you publish is arriving.
  - do: Try it in the sandbox before you wire anything real.
    note: The browser playground is disposable and isolated — publish and subscribe there in a minute,
      with no credentials.
- id: brokerless-consequences
  title: What brokerless costs you — read before designing anything
  level: working
  minutes: 25
  quirks:
  - claim: There is no dead-letter queue and there will not be one.
    so: If your design needs one, put durability in the storage class or in your own application — not
      in a request for a central component.
    evidence: docs/design/zenoh-brokerless-consequences.md
  - claim: Every proposal to add a central fixer re-creates the broker that was rejected.
    so: Before proposing one, read the decision — it lists what was traded away and why.
    evidence: docs/design/zenoh-brokerless-consequences.md
  drill:
    do: Write down, for your own use case, what happens to a message when the intended subscriber is
      down.
    pass: Your answer does not contain the word 'queue'.
    safety: read-only
  deeper:
  - doc: docs/design/zenoh-brokerless-consequences.md
    why: No central QoS, no DLQ, no dynamic ACL, silent denial — and why every central "fix" re-introduces
      the broker we rejected.
  status: written
  summary: 'No broker means no central queue, no dead-letter box, and no place to change permissions
    at runtime. That is a deliberate trade: the fabric keeps working when the middle is gone, and in
    exchange it will never hold a message for you.'
  walkthrough:
  - do: 'Accept the first consequence: a message nobody is subscribed to is gone.'
    note: There is no queue and no replay unless the name is in a storage class. Design for a subscriber
      that might be down, rather than assuming delivery.
  - do: 'Accept the second: there is no central place to raise priority.'
    note: Quality of service binds to identity and namespace, decided in advance — not by a runtime
      flag on a hot day.
  - do: 'Accept the third, which is the expensive one: denial is silent.'
    note: If you are not permitted to publish on a name, your publish still returns success. Nothing
      errors at either end.
  - do: Take the upside seriously too.
    note: 'The same property removes the central bottleneck: there is no single hop every message must
      pass. That is why the answer to ''can we add a broker for X'' is always no.'
- id: browser-playground
  title: The browser playground
  level: basics
  minutes: 15
  surface:
  - zenoh-sandbox
  quirks:
  - claim: Nothing you do in the sandbox touches the real fabric.
    so: Never use it as evidence that a real integration works.
    evidence: docs/design/zenoh-sandbox.md
  drill:
    do: Publish a message in the sandbox and receive it on a wildcard subscription.
    pass: You can explain why the wildcard matched.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/zenoh-sandbox.md
    why: An isolated, disposable fabric you can break — what it is wired to and what it is not.
  - doc: docs/design/zenoh-sandbox-ux.md
    why: The surface itself.
  status: written
  summary: 'A disposable fabric in a browser tab: publish, subscribe, and watch what happens, with no
    credentials and nothing real at risk.'
  walkthrough:
  - do: Open the sandbox from the Surfaces page.
    note: It is isolated from the real fabric on purpose.
  - do: Subscribe to a wildcard name, then publish under it.
    note: This is the fastest way to build the mental model of names rather than connections.
  - do: Break something deliberately.
    note: Publish to a name nobody subscribes to; subscribe to a name nobody publishes. Both are silent,
      which is exactly the lesson.
- id: your-slot-and-cert
  title: Your slot, your cert, and what the URI-SAN says about you
  level: working
  minutes: 30
  surface:
  - zenoh-portal
  quirks:
  - claim: Cert IDENTITY strings are per-goatnet machine config and are FROZEN — they are not part of
      the display lexicon. Renaming what a surface calls something never touches the URI-SAN.
    evidence: docs/design/portal-lexicon.md §"Cert identity layer"
    so: Never copy a display name into a config file — resolve the anchor instead.
  - claim: Affiliation is identity-only. It is never a NetBird group and never appears in the write
      anchor. If you are reaching for affiliation to make an authorization decision, you have the wrong
      dimension.
    evidence: docs/design/identity-grammar.md
    so: 'If you are reaching for affiliation to make an authorization decision, you have the wrong dimension:
      use role or namespace.'
  - claim: Slot aliases are DISPLAY ONLY and resolve fail-closed. An alias is never an authorization
      anchor.
    evidence: docs/design/slot-alias-display-layer.md
    so: Treat an alias as a label for humans. Anything automated should carry the UUID.
  drill:
    do: Read the identity string out of your own fabric certificate.
    pass: You can state your slot root and say which parts of that string are frozen.
    safety: read-only
  deeper:
  - doc: docs/design/zenoh-trial-fabric.md
    why: The slot-pool model — identity-bound, pre-cut, and why it exists.
  - doc: docs/design/identity-descriptor-standard.md
    why: The cert says what you were born as; the registry says what you currently are. Which one to
      read for what.
  status: written
  summary: Your slot is the namespace you own on the fabric, and your certificate is what proves you
    own it. Everything you publish lands under that root; everything you are refused is outside it.
  walkthrough:
  - do: Find your slot.
    note: It is a UUID-rooted namespace, minted for your identity. Every key expression you publish
      should start there unless you are using a marked multi-publisher root.
  - do: Read your certificate's identity string.
    note: The URI-SAN carries the per-goatnet identity strings. They are frozen machine config — not
      display text, and not something a rename can touch.
  - do: Install it where your client will find it.
    note: A fabric client needs the CA, your certificate and your key. Point the client at all three;
      a missing CA fails in a way that reads like a network problem.
  - do: Confirm the identity the fabric sees is the one you think you are.
    note: Publish once and look at the surface. Identity mismatches are much cheaper to find now than
      during an incident.
- id: key-expressions
  title: Key expressions and namespaces
  level: working
  minutes: 25
  quirks:
  - claim: '`ops/` is the canonical operational namespace. `system/` is deprecated and still appears
      in older code and docs; publishing there means nobody is listening.'
    evidence: F-183
    so: Grep your own code for the old prefix before you ship; a silent no-subscriber is the failure
      you get.
  - claim: Single-owner `<uuid>/**` roots are inviolable. Co-publishing happens only on explicitly marked
      `multipub/<org-pool>/<topic>` roots, opt-in and fail-closed.
    evidence: docs/design/pubsub-org-admin-co-publish.md
    so: Publish under your own root by default. Reach for a multi-publisher root only when co-publishing is the
      actual requirement, and expect it to be opt-in.
  drill:
    do: Write the key expression for one thing you intend to publish, plus the subscription that would
      receive it.
    pass: The subscription is one expression with at most one wildcard, and the publisher root is yours.
    safety: read-only
  deeper:
  - doc: docs/design/pubsub-best-practices.md
    why: How to shape a key expression, and the patterns that scale.
  - doc: docs/design/zenoh-cardinality-budget-and-lazy-crawler.md
    why: The cardinality budget — why key design is a capacity decision, not a naming preference.
  status: written
  summary: A key expression is the address of your data — a path-like name that subscribers match on,
    with wildcards. Choosing it well is a capacity decision as much as a naming one, because the fabric's
    cost scales with how many distinct names exist.
  walkthrough:
  - do: Shape the name from most stable to most variable.
    note: Owner root first, then domain, then the thing that changes. That order is what lets a subscriber
      match a useful subtree with one wildcard.
  - do: Keep the variable part bounded.
    note: A name segment that can take unbounded values — a timestamp, a request id — multiplies the
      number of names in existence and is the main way a fabric gets expensive.
  - do: Use the current operational namespace.
    note: '`ops/` is canonical. An older prefix still appears in old code and documents, and publishing
      there means nobody is listening.'
  - do: Write the subscriber's expression at the same time as the publisher's.
    note: If you cannot express the subscription cleanly, the name is wrong — fix it before anything
      depends on it.
- id: silent-denial
  title: Silent denial — the trap that costs the most hours
  level: working
  minutes: 20
  quirks:
  - claim: A denied publish reports success to the publisher and nothing to the subscriber.
    so: Never treat 'my client returned OK' as evidence that a message was accepted.
    evidence: F-177
  - claim: A storage query that comes back empty is evidence of *empty*, not of denial. The two look
      identical and have different fixes.
    so: 'Distinguish them before you escalate: ask whether anything was ever stored for that name.'
    evidence: docs/design/zenoh-storage-taxonomy-sharding.md
  drill:
    do: Publish to a name you know you do not own, then look for it on a fabric surface.
    pass: Your client reports success and the surface shows nothing — you have now seen the failure
      mode with your own eyes.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/zenoh-write-enforcement-rollout.md
    why: Why write enforcement was gated on denial OBSERVABILITY rather than shipped first.
  - doc: docs/findings/F-177-zenoh-acl-ingress-denial-is-silent-at-both-ends.md
    why: The finding itself — a denied write looks identical to a successful one from both ends.
  status: written
  summary: 'The single most expensive behaviour on this system: a publish you are not permitted to make
    returns success. Your data does not arrive, nothing logs an error at either end, and every local
    check you run looks fine.'
  walkthrough:
  - do: Recognise the symptom.
    note: You publish, your code is happy, and the subscriber sees nothing. No error, no rejection,
      no timeout.
  - do: Rule out the boring causes first, in this order.
    note: Wrong name (a typo in a key expression is silent too), subscriber not actually running, wrong
      goatnet or context, then permissions.
  - do: Check what you are entitled to publish.
    note: Your fabric identity carries a namespace you own. Publishing outside it is the case this module
      exists for.
  - do: Prove it from a surface rather than from your client.
    note: Look at the fabric in panoscope or tail the name in flashlight. If the message is not there,
      it never left — your client cannot tell you that.
- id: storage-and-queries
  title: Storage, queries and what "empty" means
  level: working
  minutes: 20
  quirks:
  - claim: Storage is lazy and per-LIVE-slot. A slot that has never been live has no store, so a query
      against it returns empty rather than failing.
    evidence: F-186
    so: Before escalating an empty query, ask whether anything was ever stored for that name.
  - claim: Pre-creating a store per slot does not scale — the adminspace getter deadlocks as store count
      grows. This is why storage is lazy rather than eager.
    evidence: F-268
    so: Do not design around a store per slot — that is exactly the shape the lazy model exists to avoid.
  drill:
    do: Query a name under a slot that has never published, and explain the result.
    pass: You get an empty result and can say why that is not a denial.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/zenoh-storage-taxonomy-sharding.md
    why: Which classes are stored, which are routed only, and the lazy per-slot storage model.
  status: written
  summary: Some data is kept so a late reader can ask for it; most is not. Storage here is lazy and
    per-slot, which changes what an empty answer means.
  walkthrough:
  - do: Find out whether the class of data you care about is stored at all.
    note: Storage is opt-in per class. If it is not stored, a query is not a way to get history — you
      need a live subscription.
  - do: Query, and read an empty result carefully.
    note: Empty means nothing is stored for that name. It does not mean you were refused, and it does
      not mean the publisher is broken.
  - do: If you need history, say so at design time.
    note: Turning a live-only stream into a stored one is a fabric-side decision with a cost, not a
      client flag.
- id: volatile-class
  title: The volatile class — routed, never stored
  level: mastery
  minutes: 15
  quirks:
  - claim: '`volatile/` data is never stored. Choosing it is choosing to give up replay for that stream.'
    evidence: docs/design/zenoh-volatile-class.md
    so: Write the loss down where a future consumer will see it, not just in your head.
  drill:
    do: Decide whether your highest-rate stream belongs in the volatile class.
    pass: You can state what you give up by putting it there, in one sentence.
    safety: read-only
  deeper:
  - doc: docs/design/zenoh-volatile-class.md
    why: Why high-rate data goes under `volatile/`, and that this is the message-rate scaling path.
  status: written
  summary: 'The volatile class is for streams that are worth routing and not worth keeping: it is routed
    and never stored. It is also the message-rate scaling path, so the highest-rate things you publish
    probably belong there.'
  walkthrough:
  - do: Identify your highest-rate stream.
    note: Rate, not importance. A slow stream that matters enormously is not a candidate; a fast one
      that is superseded every second is.
  - do: Decide what you lose by making it volatile.
    note: You lose replay for that stream, permanently. If a late subscriber must be able to catch up,
      it is not volatile.
  - do: Put it under the volatile root, and say so in your design.
    note: Anyone reading your topic list should be able to see which streams have no history without
      asking you.
- id: qos-and-envelopes
  title: QoS — reserve, reveal, enforce
  level: mastery
  minutes: 25
  quirks:
  - claim: QoS binds to IDENTITY. That is why fire-control-quality track and coarse cue are separate
      gear classes — one shared class would mean one identity, and the track could not hold a reservation
      the cue stream cannot consume.
    evidence: docs/design/mesh-and-ory-roles.md §"gear classes"
    so: When you need two different guarantees, expect two identities — do not ask for a priority flag
      on one.
  drill:
    do: Name the throughput envelope that applies to a stream you publish, or state that none is declared.
    pass: Either answer is a pass; not knowing which is a fail.
    safety: read-only
  deeper:
  - doc: docs/design/zenoh-qos-and-prioritization.md
    why: QoS binds to identity and namespace — never to DSCP, and never via a fork.
  - doc: docs/design/qos-throughput-envelopes.md
    why: The declared envelopes and what happens at their edges.
  status: written
  summary: Quality of service here binds to identity and namespace, decided in advance — not to a flag
    set on a hot day. A stream either holds a declared envelope or it does not.
  walkthrough:
  - do: Find the envelope that applies to your stream, if any.
    note: Envelopes are declared. Where none is declared for you, that is the honest answer rather than
      an implicit default.
  - do: Understand why it binds to identity.
    note: Reservations attach to who is publishing, which is why classes that need different guarantees
      are separate identities rather than one identity with a priority field.
  - do: If you need a guarantee, ask for it as a declaration.
    note: The request is 'declare an envelope for this identity and namespace', not 'raise the priority
      of these messages'.
- id: rest-pub-bridge
  title: Publishing without a Rust client
  level: working
  minutes: 20
  quirks:
  - claim: The bridge gives you a NATIVE identity, not a shared service account. Your publishes carry
      your own cert, which is the entire reason it exists rather than a generic REST gateway.
    evidence: docs/design/zenoh-rest-pub-bridge.md
    so: If you find yourself sharing one bridge credential between publishers, stop — you have removed
      the property you came for.
  drill:
    do: Publish one message through the bridge and confirm the identity attached to it.
    pass: The message arrives carrying your identity, not the bridge's.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/zenoh-rest-pub-bridge.md
    why: A native mTLS identity for non-Rust publishers — what it is and what it deliberately is not.
  status: written
  summary: Not every publisher is a Rust program. The bridge lets a non-native client publish over HTTP
    while still carrying its own certificate identity — it is not a shared service account with a REST
    façade.
  walkthrough:
  - do: Get a certificate for the publisher itself.
    note: The point of the bridge is that publishes carry the publisher's identity, not the bridge's.
      A shared credential throws away the only reason to use it.
  - do: Publish one message through it.
    note: 'Same key expression rules as any other publisher: your root, your namespace.'
  - do: Confirm on a surface that the identity attached is yours.
    note: This is the check that proves you wired it up rather than borrowing something.
- id: dataflow-patterns
  title: Data flow patterns
  level: working
  minutes: 15
  surface:
  - dataflows
  quirks:
  - claim: The patterns describe shapes, not permissions. A pattern being drawn does not mean your identity
      is allowed to play every role in it.
    so: Check what your slot may publish separately — the diagram will not refuse you, the fabric will
      (silently).
    evidence: F-177
  drill:
    do: Name the pattern your integration follows, and the one place it diverges.
    pass: Both answers in one sentence each.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/dataflows-runbook.md
    why: The hosted patterns surface and how it is deployed.
  status: written
  summary: A small catalogue of the shapes data takes here — who publishes, who subscribes, what is
    stored, and where the boundaries sit. Use it to name your integration before you build it.
  walkthrough:
  - do: Open the patterns surface and find the shape closest to your integration.
    note: Most integrations are a variant of an existing pattern. Starting from one saves you rediscovering
      its failure modes.
  - do: Name your pattern out loud before writing code.
    note: '''This is a sensor feed with lazy storage and one derived consumer'' is a design. ''We will
      publish some data'' is not.'
  - do: Note where your case diverges from the pattern.
    note: The divergence is the part worth reviewing with someone else.
- id: zero-trust-sandbox
  title: The zero-trust sandbox
  level: basics
  minutes: 15
  surface:
  - trust-sandbox
  quirks:
  - claim: The sandbox is a teaching model, not a mirror of this goatnet's live policy.
    so: Never cite a sandbox result as evidence about production access.
    evidence: docs/design/trust-sandbox.md
  drill:
    do: Cause a deliberate refusal in the sandbox and name what was checked.
    pass: You can say which claim failed and which plane would have enforced it.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/trust-sandbox.md
    why: A place to see identity-based admission behave, without touching a live plane.
  status: written
  summary: A place to watch identity-based admission behave — who is admitted, who is refused, and on
    what basis — without touching a live plane.
  walkthrough:
  - do: Open the sandbox and run one admission scenario.
    note: Watch which claim is being checked at each step, not just the outcome.
  - do: Make it refuse you deliberately.
    note: A refusal you caused on purpose teaches more than an admission you expected.
  - do: Map what you saw onto the real planes.
    note: Mesh admission and service admission are different questions with different answers; the sandbox
      makes both visible in one place.
- id: demo-game
  title: Demo Game — the fabric under a real workload
  level: working
  minutes: 20
  surface:
  - demogame
  quirks:
  - claim: It is a demonstration workload, not a load test. The load-test path is separate and deliberately
      so.
    evidence: docs/design/zenoh-loadtest.md
    so: Do not quote it as a performance result — reach for the load-test path when the question is
      capacity.
  drill:
    do: Play a round and correlate one action of yours with something visible on a fabric surface.
    pass: You can point at the traffic you personally caused.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/demogame-zenoh-demo.md
    why: Running the multiplayer demo against a real router — the runbook.
  - doc: docs/design/demogame-multiplayer.md
    why: What it demonstrates about the fabric, and what it does not.
  status: written
  summary: A multiplayer demo driven by the real fabric. It is the cheapest way to watch traffic you
    caused appear on the inspection surfaces, which is the skill it actually teaches.
  walkthrough:
  - do: Play one round.
    note: It is a demonstration workload. Nothing you do here is an operational action.
  - do: Watch the fabric while you play.
    note: Keep the topology view open on a second screen and correlate what you did with what appears.
  - do: Notice what it does not tell you.
    note: It shows the fabric carrying load. It says nothing about capacity — that is what the load-test
      path is for.
- id: health-surface
  title: One health envelope, three altitudes
  level: working
  minutes: 25
  quirks:
  - claim: 'Health is reveal-only: every node self-publishes and a reader aggregates. Nothing probes
      inward.'
    so: If a node is silent, treat it as *not reporting* and go look at the node — do not read it as
      healthy.
    evidence: docs/design/environment-health-surface.md
  - claim: Some domains are simply not instrumented yet. Their absence is a gap in publishers, not in
      the schema.
    so: Check whether a domain is instrumented on your goatnet before treating a blank as an outage.
    evidence: docs/design/environment-health-surface.md
  drill:
    do: Read the health of your goatnet and find one domain that is not green.
    run: goat health
    pass: You can say whether it is degraded, unhealthy, or simply not reporting — and which node it
      came from.
    safety: read-only
    needs: mesh
    check:
      run: "goat health --timeout 30"
      expect: exit-zero
      why: >-
        Reads the live health surface through the active context, so it works on any goatnet
        without naming one. FINDING a domain that is not green is the drill and needs a person.
        The explicit --timeout is not decoration: the default 5s connect budget is shorter than
        an mTLS handshake to a busy router (measured about 10s), and a check that
        flaps is a check people learn to ignore.
  deeper:
  - doc: docs/design/environment-health-surface.md
    why: The `EnvHealthV1` envelope, the reveal-only pattern, and the five-state honesty grading.
  - doc: docs/design/fabric-health-surface.md
    why: The fabric domain specifically, and why five states rather than up/down.
  status: written
  summary: 'Health here is one shape everywhere: each node publishes its own health, a passive reader
    rolls it up, and every surface renders the same envelope at a different altitude. Nothing reaches
    into a node to ask.'
  walkthrough:
  - do: Read the whole goatnet's health in one command.
    run: goat health
    note: You get graded envelopes per domain — fabric, time, mesh, network.
  - do: Learn the five states, because up/down is not one of them.
    note: A domain can be healthy, degraded, unhealthy, **unknown**, or not instrumented. Unknown means
      nobody reported — which is different from reporting a problem.
  - do: Drop one altitude when something is not green.
    note: Use the topology view for the fabric, and the per-target diagnostic view for one node. Both
      read the same published envelopes.
  - do: Do not confuse silence with health.
    note: Because nodes self-publish, a node that is completely dead publishes nothing at all — which
      reads as unknown, not as unhealthy.
- id: goat-top
  title: goat top — the live dashboard
  level: working
  minutes: 15
  quirks:
  - claim: A blank field is a statement that the value is unknown, not a rendering fault.
    so: Do not fill it in with an estimate when you report; say it is not measured.
    evidence: docs/design/goat-top.md
  drill:
    do: Take a snapshot and identify one field that is deliberately blank.
    run: goat top --once
    pass: You can name the field and say what would have to exist for it to be filled.
    safety: read-only
    needs: mesh
    check:
      run: "goat top --once --timeout 30"
      expect: exit-zero
      why: >-
        Takes the snapshot the drill asks for. Identifying which field is deliberately blank —
        and why blank is the honest answer there — is the half a person does.
  deeper:
  - doc: docs/design/goat-top.md
    why: The live fabric dashboard, its honesty discipline, and the `--once` batch mode.
  status: written
  summary: A live dashboard for the fabric in your terminal — what is publishing, at what rate, and
    whether the substrate is keeping up. It refuses to show a number it cannot substantiate.
  walkthrough:
  - do: Take one snapshot rather than a live view.
    run: goat top --once
    note: Batch mode. Good for pasting into a message, and it is the form to use in a script.
  - do: Run it live while you exercise something.
    run: goat top
    note: Publish from another window and watch the rate move. This is the fastest way to confirm your
      traffic is real.
  - do: Read the blanks as information.
    note: A blank field means the value is not substantiated — not that it is zero. That is deliberate
      across every surface here.
- id: panoscope
  title: Panoscope — topology, and the only surface that queries on demand
  level: working
  minutes: 20
  surface:
  - panoscope
  quirks:
  - claim: Client demand must never amplify into fabric load. Panoscope is the single deliberate exception,
      and no new surface gets the same permission.
    so: If you are designing a view that queries the fabric on every page load, that is the wrong shape
      — read published state instead.
    evidence: docs/design/surface-overload-protection.md
  - claim: Display names come from a per-goatnet vocabulary applied when the page is served. The underlying
      identifiers are untouched.
    so: Never copy a display name into a configuration file as if it were an identifier.
    evidence: docs/design/portal-lexicon.md
  drill:
    do: Find one participant in panoscope and name one thing it publishes.
    pass: You can name the participant and the key expression, and say which part of what you see is
      display-only.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/panoscope.md
    why: The topology view and its lenses.
  - doc: docs/design/surface-overload-protection.md
    why: Why panoscope is the ONLY surface allowed to query the fabric on client demand.
  status: written
  summary: 'The topology view: what is on the fabric, what it is publishing, and how it is connected.
    It is the one surface allowed to ask the fabric a question because you clicked — every other surface
    reads what was already published.'
  walkthrough:
  - do: Open panoscope from the Surfaces page and find your own participant.
    note: You are looking for your slot — the namespace your identity owns.
  - do: Follow one publisher to what it publishes.
    note: This is how you confirm that a service is not just running but actually emitting.
  - do: Use it as the second opinion on your own client.
    note: When your client says a publish succeeded, this is where you check whether it arrived.
  - do: Deep-link into a focused tail when you need the payloads.
    note: Topology tells you *whether*; the tail tells you *what*.
- id: flashlight
  title: Flashlight — focused live tail
  level: working
  minutes: 15
  surface:
  - flashlight
  quirks:
  - claim: It is a focused tail, not a search. If you do not already know roughly where to look, the
      wrong lens is costing you the time.
    evidence: docs/design/flashlight.md
    so: If you are scrolling looking for something, go back to a broader surface first — you are using
      the wrong lens.
  drill:
    do: Deep-link into a focused tail from a topology view for one entity.
    pass: You land on that entity's traffic rather than the whole fabric.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/flashlight.md
    why: What it tails, and the deep-link contract into it from other surfaces.
  status: written
  summary: 'A focused live tail: point it at one thing and watch what it is actually publishing, payloads
    included. It is the surface you use once you know roughly where to look.'
  walkthrough:
  - do: Get there from a topology view rather than from the front door.
    note: Surfaces deep-link into each other. Arriving with an entity already selected is the difference
      between a tail and a firehose.
  - do: Watch one name for a minute before concluding anything.
    note: Publication rates vary. A quiet second is not evidence of a stopped publisher.
  - do: Use it to answer 'what exactly is in this message', not 'is anything wrong'.
    note: The health surface answers the second question better and more cheaply.
- id: stethoscope
  title: Stethoscope — one target, in depth
  level: working
  minutes: 15
  surface:
  - stethoscope
  quirks:
  - claim: Everything it shows was self-published by the node. Nothing here probed the node.
    so: A node that is completely dead shows as missing, not as unhealthy — go look at the node itself
      rather than waiting for it to report a fault.
    evidence: docs/design/environment-health-surface.md
  drill:
    do: Point it at one node and say which domains it reports and which it does not.
    pass: You can name at least one domain that is absent rather than unhealthy.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/stethoscope.md
    why: The per-target diagnostic altitude and what it reads.
  status: written
  summary: One target, in depth. Where the fleet view tells you which node looks wrong, this tells you
    what that node is reporting about itself.
  walkthrough:
  - do: Pick a node from a fleet-level surface.
    note: Arrive with a target. This lens is not for browsing.
  - do: Read each domain it reports separately.
    note: Fabric, time, mesh and network are independent. A node can be perfect on three and unreporting
      on the fourth.
  - do: Check what it is NOT reporting.
    note: A missing domain is a publisher that is not running, which is a different fix from a domain
      reporting trouble.
- id: netvis
  title: netvis — mesh reachability at five levels
  level: working
  minutes: 20
  surface:
  - netvis
  quirks:
  - claim: A fence that reads the wrong header admits nobody while looking exactly like a working fence
      — this surface shipped that way once, and every check passed.
    so: When a surface refuses everyone, suspect its wiring, not the access list.
    evidence: F-320
  - claim: A deploy health check that probes a port the container does not publish can neither pass
      nor fail, and prints success forever.
    so: 'Ask of any check: if the thing were completely broken, would this fail? If not, it is decoration.'
    evidence: F-321
  drill:
    do: Predict reachability between two peers, then check it here.
    pass: Your prediction matches, or you can name the rule that made you wrong.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/netvis.md
    why: The five levels of reachability and what each one actually proves.
  status: written
  summary: 'Mesh reachability made visible: who can open a connection to whom, on which ports, at five
    levels of certainty — from what the policy says, up to what was actually observed.'
  walkthrough:
  - do: Pick two peers and predict whether they can reach each other.
    note: Do this before you look. The prediction is the exercise.
  - do: Read the level, not just the line.
    note: Each level proves something different. 'The policy permits it' and 'a packet arrived' are
      very different claims, and the view separates them on purpose.
  - do: When the answer surprises you, find the rule.
    note: Reachability here comes from group-to-group rules with explicit ports. A surprise usually
      means you are in a group you did not know about — or not in one you assumed.
- id: microscope
  title: microscope — per-entity behaviour
  level: mastery
  minutes: 20
  surface:
  - microscope
  quirks:
  - claim: Its auth fence is correct today, but nothing would notice it drifting — the sibling surface's
      fence was wrong for months. Treat "the fence works" as a claim needing a test, not an observation.
    evidence: F-320
    so: Treat 'the fence works' as a claim needing a test, not an observation — the sibling surface's
      fence was wrong for months while looking correct.
  drill:
    do: Look up one entity's behaviour over the last day and compare it with a quieter period.
    pass: You can state one difference and say whether it is explained.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/microscope.md
    why: The per-entity behaviour lens and what it can answer that the aggregate views cannot.
  - doc: docs/design/microscope-reachability-view.md
    why: The reachability view specifically.
  status: written
  summary: 'The per-entity behaviour lens: what one identity actually did over time, as opposed to what
    it is permitted to do. Use it when the question is ''who did this'' or ''is this thing behaving
    as it used to''.'
  walkthrough:
  - do: Start from an entity, not from a time range.
    note: Its power is per-entity history. Arriving with a time range and no subject gives you noise.
  - do: Separate behaviour from permission.
    note: This shows what happened. Whether it should have been possible is a question for the reachability
      and policy surfaces.
  - do: Compare against a period you consider normal.
    note: Anomaly only means something against a baseline you have actually looked at.
- id: grafana
  title: Grafana and the metric tier
  level: working
  minutes: 20
  surface:
  - grafana
  quirks:
  - claim: Payload traffic and tunnel traffic are two planes that are never summed.
    so: When you quote a bandwidth figure, say which plane it came from.
    evidence: docs/design/mesh-bandwidth-attribution.md
  - claim: Capacity is declared, not measured. No declaration means no utilisation series at all.
    so: If you want a percentage, the fix is to declare the link capacity — not to change the dashboard.
    evidence: docs/design/mesh-bandwidth-attribution.md
  drill:
    do: Find one panel reading unknown and work out which declaration is missing.
    pass: You can name the missing declaration.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/grafana-dashboard-suite.md
    why: The dashboard suite and what each panel is sourced from.
  - doc: docs/design/observability-wide-events.md
    why: The wide-event model underneath.
  status: written
  summary: 'The metric tier: dashboards for throughput, saturation and errors across the goatnet. Its
    most important convention is that a number nobody declared is shown as unknown rather than computed
    from a guess.'
  walkthrough:
  - do: Open the dashboards and find the one for your area.
    note: It is admins-only; if you are refused, that is the fence, not an outage.
  - do: Read bandwidth as two separate planes.
    note: Traffic is counted once inside the tunnel and once on the wire. They are never added together,
      because a single 'bandwidth' number would double the figure you use to judge headroom.
  - do: Treat a blank percentage as a missing declaration.
    note: Percent-of-capacity needs a declared capacity. Where none exists, the panel says so instead
      of inventing one.
- id: the-map
  title: The map — geographic view
  level: working
  minutes: 15
  surface:
  - goat-map
  quirks:
  - claim: Per-viewer altitude scoping is ENFORCED but is NOT the trust boundary. Do not reason about
      data exposure from what the map shows you.
    evidence: docs/design/goat-map.md
    so: Never answer a data-exposure question with what the map shows — ask the plane that enforces
      it.
  - claim: The row is named "Radar map (exercise)" deliberately. A row labelled plain "Radar map", screenshotted
      into a briefing, reads as an operational picture — which it is not.
    evidence: ops/ansible/group_vars/zagros_hosts/vars.yml
    so: Keep the qualifier in any screenshot caption; a bare 'radar map' reads as operational.
  drill:
    do: Open the map and say, for one track, whether it is a real system or a synthetic feed.
    pass: You can point at what told you.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/goat-map.md
    why: The map, its per-viewer scoping, and the lasso default.
  status: written
  summary: 'The geographic view: where things are, for exercises and situational awareness. It is scoped
    per viewer, and it is deliberately not the boundary that protects anything.'
  walkthrough:
  - do: Open the map and identify one track's source.
    note: Real systems and synthetic feeds both appear. Knowing which you are looking at is the first
      skill.
  - do: Read the scoping as a display rule, not a security control.
    note: What you can see is scoped to you. That scoping is enforced, and it is still not the trust
      boundary — do not reason about exposure from it.
  - do: Mind how a screenshot of it reads.
    note: Out of context it looks like an operational picture. The row is named to prevent exactly that
      misreading; keep the qualifier when you share it.
- id: consistency-console
  title: The consistency console
  level: working
  minutes: 25
  surface:
  - consistency
  quirks:
  - claim: A declared fact with no live check is not consistency — it is a comment. Three files once
      described an zagros-prod topology no host carried, and every surface that could have caught it was
      repo-vantage by design.
    evidence: F-324
    so: When a file says a thing is deployed, check a surface that reads the machine before you believe
      it.
  - claim: Its public door authorises ONE EMAIL PER PERSON. A person holding a second address on another
      connector gets a bare 403 that names neither the identity presented nor the fact that the door
      is an allowlist.
    evidence: F-334
    so: If a public door refuses you, check which identity you are signed in as before reporting an
      outage.
  drill:
    do: Find one row below green and classify it as sync, health, or coverage.
    pass: You can name the class and say what would close it.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/design/consistency-foundation.md
    why: Typed intents, one grading library, remediation-as-data — and which parts are live on which
      goatnet.
  - doc: docs/design/fleet-reconciliation-join.md
    why: One row per declared fact — sync, health and coverage joined.
  status: written
  summary: 'One row per declared fact: what was declared, whether it is in sync, whether it is healthy,
    and whether anything is even watching. The third column is the one people forget exists.'
  walkthrough:
  - do: Open the console for your goatnet and find a row grading below green.
    note: Start with anything not green rather than scanning everything.
  - do: Decide which of three gaps you are looking at.
    note: A sync gap means declared and live disagree. A health gap means it is live and unwell. A coverage
      gap means nothing is checking — which is the one that hides the others.
  - do: Follow the remediation the row carries, rather than inventing one.
    note: Remediation is data here. If the row does not carry one, that absence is itself the finding.
- id: relay-fleet-health
  title: Relay fleet health
  level: working
  minutes: 20
  surface:
  # The mesh-only `relay-health` row is gone: every goatnet's dashboard is its
  # own cloud box now (the mesh-only rows are retired).
  - relay-health-public
  - relay-health-goatnets
  quirks:
  - claim: Relays are not mesh peers, so anything that assumes mesh reachability to a relay is measuring
      the wrong thing.
    so: Do not debug a relay by trying to reach it the way you reach a normal service.
    evidence: docs/design/relay-health-dashboard.md
  - claim: The public door authorises one email address per person, and its refusal names neither the
      identity you presented nor the fact that it is an allow-list.
    so: If you are refused, check which identity you are signed in as before reporting an outage.
    evidence: F-334
  drill:
    do: Read one relay's last measured throughput and its timestamp.
    pass: You get a number with a time, or an explicit 'not measured' — and you can tell which.
    safety: read-only
  deeper:
  - doc: docs/design/relay-health-dashboard.md
    why: Why relays need a different prober from every other surface, and what `--deep` measures.
  status: written
  summary: 'Relays carry traffic when two peers cannot reach each other directly. They are not mesh
    peers themselves, which changes how you check them: the prober reaches them from outside, and the
    dashboard door is separate from the health it shows.'
  walkthrough:
  - do: Open the relay dashboard and read the last measured throughput per relay.
    note: You get a measurement with a timestamp, or an explicit absence. Never a fabricated percentage.
  - do: Separate the door from the data.
    note: Being refused entry tells you nothing about relay health. They are two independent layers
      and they fail independently.
  - do: Remember what a relay is for.
    note: Traffic on a relay is not a fault — it means a direct path could not be made for that pair.
      Some pairs will always relay.
  - do: Use the overview to see every goatnet at once.
    note: Each goatnet has its own relay-health dashboard. The overview on any of them lists every
      goatnet, each card reporting its own relays and clicking through to that goatnet's dashboard. A
      card with no recent report reads unknown, not down.
- id: reading-a-wedge
  title: Reading a wedged fabric
  level: mastery
  minutes: 30
  quirks:
  - claim: The storage-manager adminspace getter deadlocks in proportion to store count. A wedge that
      appears under load and not in test is this shape.
    evidence: F-268
    so: If a wedge appears under load and not in test, suspect the scaling-related deadlock before anything
      bespoke.
  - claim: A router that is up, listening, and answering health checks can still be moving nothing.
      Liveness and function are separate questions and the health bands separate them on purpose.
    evidence: docs/design/zenoh-router-health.md
    so: Read the band first; it is the difference between diagnosis and guessing.
  drill:
    do: Walk the wedge playbook against a healthy router.
    pass: You can describe what each step outputs when nothing is wrong.
    safety: read-only
    needs: mesh
  deeper:
  - doc: docs/operations/zenoh-wedge-investigation-playbook.md
    why: The ordered investigation for a router that has stopped moving data.
  - doc: docs/design/zenoh-router-health.md
    why: The health bands and what each one licenses you to do.
  status: written
  summary: A wedged fabric is one where the router is up, answering, and moving nothing. This is the
    ordered way through it — and the reason to walk it once while everything is healthy.
  walkthrough:
  - do: Walk the playbook once on a healthy router.
    note: Knowing what each step looks like when nothing is wrong is the only way to read it when something
      is.
  - do: Separate liveness from function.
    note: Up, listening and answering health checks are three different claims, and none of them is
      'moving data'.
  - do: Check the health band before you touch anything.
    note: The band tells you what you are licensed to do next — restarting first destroys the evidence
      that would have told you why.
  - do: Capture evidence before remediating.
    note: A wedge that gets restarted without a capture becomes an unexplained incident that recurs.
- id: admin-context
  title: goat admin — and the refusal that is not a permissions problem
  level: working
  minutes: 20
  quirks:
  - claim: Admin actions read operator credentials from the ENVIRONMENT — `GOAT_OPERATOR_HANDLE`, the
      age identity, the NetBird admin token — never from the profile on disk. A correct profile with
      an unsourced environment refuses, and the refusal reads like a rights problem.
    evidence: docs/goat-cli-book/src/admin.md
    so: Source the environment before blaming your role.
  - claim: '`goat admin lan scan|doctor` is the ONE admin path not refused for a missing operator environment.
      It mutates nothing and needs no credentials, because it is built for the case where the mesh and
      every service are down.'
    evidence: docs/goat-cli-book/src/admin.md
    so: When the mesh and every service are down, reach for the LAN diagnostics — they are the one admin
      path that still works.
  - claim: Reading is never gated — `goat admin <cmd> --help` always works. Only running an action is
      checked, so exploring the surface costs you nothing.
    evidence: docs/goat-cli-book/src/admin.md
    so: Explore with `--help` freely; it costs nothing and teaches the surface.
  - claim: Operator key approval IS the grant. The portal re-reads its key directory while running,
      so a key is live within seconds and there is no install step. Not working a minute after approval
      is a fault, not a queue.
    evidence: docs/operations/admin-operator-guide.md
    so: If a key is not working a minute after approval, it is a fault — do not wait for a queue that
      does not exist.
  - claim: Every `goat admin` invocation emits one `OperatorActionV1` record tied to your personal operator
      key. Admin actions are individually attributable by design.
    evidence: F-207
    so: Assume every admin action you take is attributable to you personally, because it is.
  drill:
    do: Run a read-only admin subcommand against your goatnet.
    pass: You get a result, or a refusal you can attribute to one of the three causes without guessing.
    safety: admin
    run: goat admin peer ls --env <your-goatnet>
  deeper:
  - doc: docs/goat-cli-book/src/admin.md
    why: The three causes of a refusal, in the order to check them, and what each one changes. (§"If
      you see E_NOT_ADMIN")
  - doc: docs/operations/admin-operator-guide.md
    why: The end-to-end operator setup — attribution, age identity, operator Zenoh cert, mgmt-host SSH.
  status: written
  summary: Admin actions are refused for three different reasons and the message does not always distinguish
    them. Knowing which one you hit is most of the job.
  walkthrough:
  - do: Read the surface before you act. Reading is never gated.
    run: goat admin --help
    note: Every admin subcommand's help works without credentials, so you can explore the whole surface
      for free.
  - do: Source your operator environment.
    note: Admin actions read operator credentials from the ENVIRONMENT — your handle, your audit identity,
      the mesh admin token — never from the profile on disk. A correct profile with an unsourced environment
      refuses in a way that reads like a rights problem.
  - do: Select the goatnet explicitly.
    run: goat admin peer ls --env <your-goatnet>
    note: Being on the right mesh is not the same as targeting the right goatnet.
  - do: If it still refuses, treat it as an authorization answer.
    note: You have checked the two mechanical causes. The third is that your role is not authorized
      — re-onboarding the same identity will not change it.
- id: onboarding-rails
  title: The onboarding rails — there is one correct way
  level: working
  minutes: 20
  surface:
  - id-admin-console
  - onboard-api
  quirks:
  - claim: The wrong path is easy, fast, and looks like it worked. Hand-creating a Kratos identity,
      a setup key or a portal org row produces a principal that exists on one plane and not the others
      — which is worse than no principal, because it looks provisioned.
    evidence: docs/operations/onboarding-rails.md
    so: If you catch yourself about to write directly to a database or mint a key by hand, stop — that
      is the failure this whole path exists to prevent.
  - claim: When the bundle-completeness gate refuses, the most common cause is that the principal already
      partially exists out-of-band. Do not work around the gate.
    evidence: docs/operations/onboarding-rails.md
    so: 'Read the gate''s message as a diagnosis: something already exists. Find it before retrying.'
  drill:
    do: Read the manifest for one existing operator and name the surfaces it enables.
    pass: You can list them, and say which would be missing if one failed.
    safety: read-only
  deeper:
  - doc: docs/operations/onboarding-rails.md
    why: The two supported front doors, the four planes a principal spans, and what the completeness
      gate means when it fires.
  status: written
  summary: Every human and machine principal is created by one orchestrator, through one of two front
    doors. The wrong path is faster, looks like it worked, and leaves a principal that exists on one
    plane and not the others.
  walkthrough:
  - do: 'Use a front door: the CLI wrapper or the console.'
    note: Both drive the same orchestrator against a validated manifest. Anything else is a breaking
      action.
  - do: Know the four planes a principal spans.
    note: Identity, mesh access, fabric credentials where applicable, and the delivered bundle. A principal
      that exists on one is worse than none, because it looks provisioned.
  - do: When the completeness gate refuses, do not work around it.
    note: It fires when a surface the manifest enables did not provision. The usual cause is that the
      principal already partly exists because somebody created it by hand.
  - do: Deliver the bundle out of band.
    note: It carries one-time values that exist nowhere else.
- id: env-doors
  title: Env doors — reaching more than one goatnet
  level: working
  minutes: 20
  quirks:
  - claim: NEVER flip your mesh profile to deploy to another goatnet. The profile is shared device state;
      flipping it takes you off the goatnet you were on. There is a per-environment door mechanism that
      opens goatnets concurrently instead.
    evidence: docs/design/env-doors.md
    so: Treat the profile as belonging to the whole device, not to your current task.
  drill:
    do: Open a door to a goatnet you have access to, run one read-only command through it, then close
      it.
    pass: Your existing mesh session never dropped.
    safety: admin
  deeper:
  - doc: docs/design/env-doors.md
    why: Why a netbird profile is not a deploy transport, and how per-env doors open concurrently.
  - doc: docs/adr/1117-per-env-doors-cross-env-management.md
    why: The decision.
  status: written
  summary: You will need to reach more than one goatnet. The wrong way — switching your mesh profile
    — takes you off the one you are on, mid-task.
  walkthrough:
  - do: Never flip your mesh profile to deploy somewhere else.
    note: The profile is shared device state. Flipping it drops your current goatnet, including anything
      you have half-finished on it.
  - do: Open a per-environment door instead.
    note: 'Doors are per-goatnet and concurrent: you can hold several open and target each explicitly.'
  - do: Target the door explicitly in the command.
    note: An implicit target is how work lands on the wrong goatnet.
  - do: Close what you opened.
    note: A door left open is a standing path nobody is thinking about.
- id: running-ansible
  title: Running ansible — the preflight that refuses
  level: working
  minutes: 20
  quirks:
  - claim: Ansible reads role defaults from your working directory, not from origin. A stale trunk silently
      templates stale image pins and group_vars — which is why the preflight wrapper refuses rather
      than warns.
    evidence: CLAUDE.md §"Running Ansible"
    so: Never bypass the wrapper to save a minute; that minute is how stale pins reach a fleet.
  - claim: An INTERRUPTED run leaves single-file bind mounts converged on the HOST and stale IN THE
      CONTAINER, and re-running does NOT heal it — the re-run reports `changed=0 failed=0`, which is
      exactly what a correctly-converged host prints. The trap is the report, not the drift.
    evidence: F-330
    so: After any interrupted run, verify what the container is actually running rather than re-running
      and trusting the recap.
  - claim: Handlers do not run when a play is aborted. A killed deploy is not a no-op.
    evidence: F-330
    so: Treat a killed play as 'unknown state', not as 'no change'.
  drill:
    do: Run any play with `--check` from a fresh tree and read the diff.
    pass: The preflight passes and you can describe every change it would make.
    safety: admin
  deeper:
  - doc: CLAUDE.md
    why: The exact invocation, the wrapper, and why it refuses to run from a stale trunk. (§"Running
      Ansible")
  - doc: docs/operations/deploy-guide.md
    why: The deploy runbook itself.
  status: written
  summary: Configuration runs from your machine against the hosts, and reads its own inputs from your
    working directory. That last part is why the wrapper refuses stale trees rather than warning about
    them.
  walkthrough:
  - do: Always run through the preflight wrapper.
    note: It refuses to run from a stale trunk, because config values are read from your working directory
      rather than from the remote — a stale tree silently deploys stale pins.
  - do: Dry-run first.
    run: ansible-playbook --check ...
    note: Read the diff it would make. This is the habit that separates a confident deploy from a hopeful
      one.
  - do: Run it somewhere it will not be interrupted.
    note: Handlers do not run when a play is aborted, and an aborted run leaves converged files with
      a container still using the old ones.
  - do: Read the recap as a claim about the host, not the process.
    note: '`changed=0 failed=0` is exactly what a correctly converged host prints — and also what an
      interrupted one prints on the retry.'
- id: stand-up-a-goatnet
  title: Stand up a goatnet, including the parts that live outside it
  level: working
  minutes: 40
  quirks:
  - claim: A goatnet is not finished when its own acceptance gate is green. Its relay-health box, its card
      on every other goatnet's overview, and the addresses its hosts report to all live outside it, and
      none of them change until the last phase redeploys every relay-health box.
    evidence: docs/design/relay-health-dashboard.md
    so: Run the standup through its final phase, and open another goatnet's overview to see the new one
      listed before you call it done.
  - claim: Configuration copied from another goatnet and renamed carries that goatnet's addresses in
      forms a rename does not fix. One goatnet's hosts spent a week reporting to a dashboard name nothing
      served, while every health check on the goatnet itself stayed green.
    evidence: docs/design/relay-health-dashboard.md
    so: Never hand-write where a goatnet's hosts report. Declare the goatnet's relay-health box in the
      roster and let the generated values carry it; the check refuses a name no box serves.
  - claim: Merging a change to the roster changes nothing live. Retiring a goatnet left its card on
      two overviews for five days after the change merged.
    evidence: docs/operations/goatnet-standup.md
    so: After any roster change, standing up or retiring, run the redeploy of every relay-health box.
  drill:
    do: For one live goatnet, find its relay-health box in the roster and name the three things that
      point at it — the cloud instance that runs it, the login callback it needs, and the hosts that
      report to it.
    pass: You can name all three without asking anyone, and say which step of the standup creates each.
    safety: read-only
  deeper:
  - doc: docs/operations/goatnet-standup.md
    why: The one procedure — every phase, what "worked" looks like for each, and the relay-health box steps.
  - doc: docs/design/relay-health-dashboard.md
    why: Why every goatnet has its own relay-health box, and what the roster check enforces.
  - doc: docs/design/goatnet-deployment-doctrine.md
    why: The principles the procedure is built on — one path, absence is data, coupled facts derive.
  status: written
  summary: 'A goatnet is stood up by one driver, in numbered phases, ending at an acceptance gate and
    then one more step: joining the surfaces that span goatnets. Every goatnet with relays gets its own
    relay-health box — the outside view of its relays, its dashboard, and the place its hosts report
    their health — declared once in a roster that generates everything else.'
  walkthrough:
  - do: Print the plan before running anything.
    note: The driver prints every phase and the exact command for your goatnet's topology, and runs
      nothing. That printout is the command reference; there is no second list to drift.
  - do: Run the phases in order, resuming by number after each manual step.
    note: Every phase is safe to re-run. When one fails the driver says which phase, what state the site
      is in, and the resume command.
  - do: Before the last phase, build the goatnet's relay-health box.
    note: Four things, in this order. A small cloud instance with a public address, created with the
      goatnet's other cloud infrastructure and enrolled on the goatnet's mesh as infrastructure. Its
      login callback registered with the shared sign-in service. Its inventory and settings, copied
      from an existing box. Then the goatnet's entry in the roster, followed by the renderer.
  - do: Let the renderer write where the hosts report.
    note: The roster entry names the box. The renderer writes the box's overview settings and, for every
      host group in the goatnet, the addresses those hosts send health reports to. The check refuses a
      roster that disagrees with the goatnet list, a box missing any of its parts, a hand-written copy of
      a generated value, and any dashboard name no box serves.
  - do: Run the last phase and look at the result from outside.
    note: It redeploys every relay-health box. Open the new goatnet's dashboard, then another goatnet's
      overview. The new goatnet's card is there and green, and the footer names the commit you deployed.
  - do: Retire a goatnet by running the same last step in reverse.
    note: Remove the goatnet from every roster in one change, merge it, redeploy every box, then destroy
      its box with the rest of its cloud infrastructure. The merge alone changes nothing live.
- id: goatbuilder-tutor
  title: 'The builder''s tutor: every verb, practised on throwaway copies'
  level: basics
  minutes: 60
  quirks:
  - claim: The tutor judges what a command actually did, its exit and its rows, not that it was typed.
      A step run against the real checkout instead of the tutor's copy, or with the wrong exit, does not
      count, and the tutor says which.
    evidence: docs/design/goatbuilder-conformance.md
    so: Copy the commands the lesson prints exactly, and run the tutor again after each one.
