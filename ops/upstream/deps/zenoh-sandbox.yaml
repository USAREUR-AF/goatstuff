# The browser playground (zenoh-sandbox): its own router image, the remote_api
# plugin and the vendored zenoh-ts client must be one version and move together
# in their own change (app/vendor is regenerated by vendor-tool/regenerate.sh).
# It trails the fleet zenoh version only while that change is pending.
name: zenoh-sandbox
version: "1.9.0"
summary: Browser playground; self-contained router + remote_api plugin + zenoh-ts unit.
upstream:
  github: eclipse-zenoh/zenoh-ts
  companions:
    - {name: zenoh-ts-npm, npm: "@eclipse-zenoh/zenoh-ts"}
facts:
  upstream_image_digest: "sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f"
moves_with:
  - "zenoh-sandbox web image and its router, one unit; not on any goatnet's data path"
rules:
  - kind: text
    what: sandbox router image
    path: ops/ansible/roles/zenoh-sandbox/defaults/main.yml
    pattern: 'zenoh_sandbox_router_oci:\s*"eclipse/zenoh:(?P<v>[0-9.]+)@(?P<upstream_image_digest>sha256:[0-9a-f]{64})"'
  - kind: text
    what: remote_api plugin release
    path: ops/ansible/roles/zenoh-sandbox/defaults/main.yml
    pattern: 'zenoh_sandbox_remote_api_version:\s*"(?P<v>[^"]+)"'
  - kind: text
    what: sandbox router Dockerfile
    path: ops/serve/zenoh-sandbox/router/Dockerfile
    pattern: '(?:ARG ZTS_VERSION=|FROM eclipse/zenoh:)(?P<v>\d+\.\d+\.\d+)'
    min: 2
  - kind: text
    what: local prep
    path: ops/serve/zenoh-sandbox/local/prep.sh
    pattern: 'ZTS_VERSION="(?P<v>[^"]+)"'
  - kind: text
    what: vendored zenoh-ts lock
    path: ops/serve/zenoh-sandbox/vendor-tool/packages.lock.json
    pattern: 'zenoh-ts-(?P<v>\d+\.\d+\.\d+)\.tgz'
