    - suffix: DEVELOPER
      description: Affiliation-neutral full-participation role (ADR 1043). Zenoh router :7447 sub/pub
        (per-uuid slot) + the web surfaces. Affiliation (vendor/organic/partner/civil) is the separate
        manifest affiliation block, NOT this group. No observability / dashboard / mgmt / compliance.
    - suffix: OBSERVER
      description: "Browse-only participants + read-only observers. Mesh web surfaces (auth / isitup /\
        \ panoscope / portal) \u2014 no fabric pub/sub, no dashboard / mgmt / compliance."
    - suffix: P2P
      description: 'CAPABILITY group, not a role: graduated lateral reach. Members can INITIATE to any
        peer (one-way rule D); non-members navigate only the restrictive paths. Role groups do not imply
        lateral reach. Graduation: docs/operations/p2p-graduation.md; seed with the platform-admin peers.'
