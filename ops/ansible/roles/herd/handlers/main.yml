---
- name: Restart herd
  ansible.builtin.command:
    cmd: "docker compose -f {{ herd_dir }}/docker-compose.yml up -d --force-recreate herd"
  changed_when: true

- name: Restart herd fence
  ansible.builtin.command:
    cmd: "docker compose -f {{ herd_dir }}/docker-compose.yml up -d --force-recreate oauth2-proxy-herd"
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
