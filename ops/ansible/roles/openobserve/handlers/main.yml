---
- name: openobserve compose changed
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ openobserve_compose_dir }}"
  changed_when: true

# SIGHUP to the obs-host's Prometheus container: its HTTP /-/reload is off
# by default (obs-host obs_prometheus_web_lifecycle).
- name: prometheus reload from openobserve role
  ansible.builtin.command:
    argv: [docker, kill, --signal, HUP, prometheus]
  changed_when: true
  failed_when: false
