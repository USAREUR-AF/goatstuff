---
galaxy_info:
  role_name: openobserve
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: openobserve
      rollback_artifact_type: data
      rollback_ref: "{{ openobserve_image }}"
      rollback_restore_pointer: "OpenObserve data dir; an image re-pin does NOT restore ingested logs/traces"
