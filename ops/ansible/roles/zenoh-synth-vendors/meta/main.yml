---
galaxy_info:
  role_name: zenoh_synth_vendors
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: zenoh-synth-vendors
      rollback_artifact_type: image
      rollback_ref: "{{ synth_vendor_image }}"
