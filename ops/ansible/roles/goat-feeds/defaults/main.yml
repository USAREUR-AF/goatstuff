---
# The one host per goatnet that runs goat-feeds. Required.
goat_feeds_host: ""
goat_feeds_version: "0.5.0"
# Where the binary comes from: exactly one of these two.
# A signed release (ops/serve/goat-feeds/RELEASING.md), installed by goatbuilder: its
# release-file role puts the verified file under <release root>/<component>/ and
# goat-feeds-deploy.yml sets this to that directory. The service runs the file `current`
# there names, once it is held to its SHA-256 and found writable by its owner alone.
goat_feeds_release_home: ""
goat_feeds_release_owner: root
# For a trial: a linux binary on the controller (`build.sh`, or `go build`). "{arch}" is
# replaced by amd64 or arm64 from the host's architecture, so one value serves a mixed
# fleet: e.g. .../dist/goat-feeds-0.5.0-linux-{arch}. goat_feeds_version names it.
goat_feeds_binary_src: ""
goat_feeds_dir: /opt/goat-feeds
goat_feeds_etc: /etc/goat-feeds
# The service runs as the processors pipeline's user, so its delivery processes read
# the fabric exactly as the pipeline's goat-xf-pipe units do.
goat_feeds_user: goat-processors
goat_feeds_listen: "127.0.0.1:8098"

# Site settings, rendered into config.json.
goat_feeds_site: "{{ site_id | default(inventory_hostname) }}"
goat_feeds_goatnet: "{{ goat_feeds_site }}"
goat_feeds_platform_groups: [PLATFORM-ADMIN]
goat_feeds_tactical_groups: []
goat_feeds_self_service_synthetic: true
goat_feeds_port_min: 1024
goat_feeds_port_max: 65535
goat_feeds_default_days: 30
goat_feeds_max_days: 180
goat_feeds_pipe_binary: /opt/goat-xf/current/goat-xf-pipe-zenoh
goat_feeds_pipe_packs: /opt/goat-xf/current/packs
goat_feeds_zenoh_config: /etc/goat-xf/zenoh-client.json5
goat_feeds_catalog: []

# Mesh peers for the destination picker (optional). The token is a secret from the
# deploying environment; empty leaves the picker off and the form takes a name and IP.
goat_feeds_peers_api: ""
goat_feeds_nb_api_token: ""

# Database: its own database and role in the site's postgres container.
goat_feeds_pg_container: postgres-a
goat_feeds_pg_host: 127.0.0.1
goat_feeds_pg_port: 5432
goat_feeds_db: goat_feeds
goat_feeds_db_user: goat_feeds

# Sign-in fence (oauth2-proxy) on the host's mesh address.
goat_feeds_bind_ip: ""
goat_feeds_port: 8099
goat_feeds_public_url: "http://{{ goat_feeds_bind_ip }}:{{ goat_feeds_port }}"
goat_feeds_oidc_issuer_url: ""
goat_feeds_oidc_host_entry: "invalid.invalid:127.0.0.1"
goat_feeds_oauth2_client_id: oauth2-proxy-goat-feeds
goat_feeds_oauth2_allowed_groups: ""
goat_feeds_oauth2_proxy_image: "quay.io/oauth2-proxy/oauth2-proxy:v7.7.1@sha256:f6a4aa83a27e316114bf79664302b1ffb2cc8ce697fb479273af4feb3fb16fe3"

# Receive side (ADR 1259): systems send to a port on this host's mesh address and each received
# feed is published on the fabric. Empty = the site receives nothing. Shape:
#   listen_ip: <this host's mesh IP>
#   ports: [7100, ...]          # must match the mesh rule that lets gear reach them
#   key_prefix: volatile/<slot>/stream/feeds-in
#   formats: [{id, label, from_format, in_frame?, set?, note?}]
#   outputs: [{id, label, to_format, frame?, set?}]   # how others may pull a received feed
goat_feeds_intake: {}

# Declared links (ADR 1260): manifests written by the roles that start tactical links
# (processors-pipeline, boundary node). goat-feeds lists them read-only beside the
# requested feeds. Empty switches it off (and drops the journal read access).
goat_feeds_declared_dir: /etc/goat-links/declared.d

# Facets (fabric-feeds.md §11). The goatnet's estate file (goat-map's declaration of
# regions, sites and systems), receiving systems it does not list (each placed in an
# estate site: {name, label, site, class, peer}), and the goatnet's mesh group prefix,
# stripped from role names. An empty estate turns the estate checks off.
goat_feeds_estate_src: ""
goat_feeds_systems: []
goat_feeds_group_prefix: ""
# Tidy up (0.4.0): functions offered in the role picker besides those already in use, and
# the mesh groups whose peers the estate must list (empty: any peer a role group places).
goat_feeds_roles: []
goat_feeds_tactical_peer_groups: []

