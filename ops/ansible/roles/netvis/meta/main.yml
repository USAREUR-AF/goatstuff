---
# SPDX-License-Identifier: Apache-2.0
galaxy_info:
  role_name: netvis
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Not optional and not merely a
# file: check-rollback-coverage.sh requires the meta-dependency, because a
# ledger nothing writes to is a ledger that is silently empty when you need it.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: netvis
      rollback_artifact_type: image
      rollback_ref: "{{ netvis_image }}"
