---
# Provisions the OAuth2 client `netvis` at the site Hydra. Idempotent
# upsert by client_id. Mirrors roles/isitup-oidc-client/tasks/main.yml.

- name: Require netvis OIDC client secret
  ansible.builtin.assert:
    that:
      - netvis_oidc_client_secret is defined
      - (netvis_oidc_client_secret | length) >= 32
      - site_id is defined and (site_id | length) > 0
      - site_dns_zone is defined and (site_dns_zone | length) > 0
    fail_msg: |
      Missing netvis_oauth2_proxy_client_secret (32+ chars) or
      site_id/site_dns_zone. This is the SAME secret the netvis role
      templates into oauth2-proxy-netvis.env — one value, both sides of
      the handshake. Generate fresh: openssl rand -hex 32

- name: Pre-flight Hydra admin reachability
  ansible.builtin.uri:
    url: "{{ netvis_oidc_hydra_admin }}/health/ready"
    status_code: 200
  retries: 5
  delay: 2

- name: Check whether netvis OAuth2 client exists at Hydra
  ansible.builtin.uri:
    url: "{{ netvis_oidc_hydra_admin }}/admin/clients/{{ netvis_oidc_client_id }}"
    status_code: [200, 404]
    return_content: true
  register: netvis_client_get

- name: Construct desired netvis OAuth2 client config
  ansible.builtin.set_fact:
    netvis_client_config:
      client_id: "{{ netvis_oidc_client_id }}"
      client_name: "{{ netvis_oidc_client_name }}"
      client_secret: "{{ netvis_oidc_client_secret }}"
      grant_types: [authorization_code, refresh_token]
      response_types: [code]
      scope: "{{ netvis_oidc_scopes | join(' ') }}"
      redirect_uris: ["{{ netvis_oidc_redirect_uri }}"]
      token_endpoint_auth_method: client_secret_post
      skip_consent: true
      access_token_strategy: jwt
      audience: ["{{ netvis_oidc_client_id }}"]

- name: Create netvis OAuth2 client at Hydra (POST when not present)
  ansible.builtin.uri:
    url: "{{ netvis_oidc_hydra_admin }}/admin/clients"
    method: POST
    body_format: json
    body: "{{ netvis_client_config }}"
    status_code: 201
  when: netvis_client_get.status == 404
  no_log: true

- name: Detect drift on existing netvis OAuth2 client at Hydra
  # Hydra v2.x omits `client_secret` from GET responses, so the
  # `| default('')` makes the comparison "missing == we don't know == treat
  # as drifted", forcing the PUT to re-sync the secret. PUT is idempotent on
  # server state and no_log keeps the secret out of logs. This is also what
  # converts a hand-made client into the codified one.
  ansible.builtin.set_fact:
    netvis_client_drift: >-
      {{ (netvis_client_get.json.client_secret | default('')) != netvis_oidc_client_secret
         or (netvis_client_get.json.redirect_uris | sort) != ([netvis_oidc_redirect_uri] | sort)
         or (netvis_client_get.json.skip_consent | default(false)) != true
         or (netvis_client_get.json.access_token_strategy | default('')) != 'jwt' }}
  when: netvis_client_get.status == 200

- name: Update netvis OAuth2 client at Hydra (PUT on drift)
  ansible.builtin.uri:
    url: "{{ netvis_oidc_hydra_admin }}/admin/clients/{{ netvis_oidc_client_id }}"
    method: PUT
    body_format: json
    body: "{{ netvis_client_config }}"
    status_code: 200
  when:
    - netvis_client_get.status == 200
    - netvis_client_drift | default(false) | bool
  no_log: true
