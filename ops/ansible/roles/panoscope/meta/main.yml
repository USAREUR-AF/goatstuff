---
galaxy_info:
  role_name: panoscope
  author: goat-maintainer
  description: Panoscope fabric COP surface (per docs/design/panoscope.md).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Pilot: role-default image pin.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: panoscope
      rollback_artifact_type: image
      rollback_ref: "{{ panoscope_image }}"
