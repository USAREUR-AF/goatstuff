---
galaxy_info:
  role_name: goat_trashgoat
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    when: goat_trashgoat_enabled | default(true) | bool
    vars:
      rollback_component: goat-trashgoat
      rollback_artifact_type: image
      rollback_ref: "{{ goat_trashgoat_image }}"
