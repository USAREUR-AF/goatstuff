# goat-fabric-health — fabric health + per-producer footprint meter.
# ADR 1034 / docs/design/fabric-health-surface.md. Standalone Rust service:
# a normal mTLS Zenoh client peer that subscribes `**`, rolls traffic up by
# class + producer, and publishes ops/fabric/health/<site> +
# ops/fabric/footprint/<peer>. Meters; persists nothing.
#
# zenoh pinned per docs/design/zenoh-version-pinning.md (=1.9.0, same as the
# audit-subscriber this is templated on). protobuf via prost-derive on
# hand-written structs (no protoc / build.rs needed); the canonical schema is
# proto/fabric_health_v1.proto.

[workspace]
resolver = "2"

[profile.release]
# CI-speed: thin LTO + parallel codegen (was fat + cu=1). These are IO-bound
# services where whole-program LTO buys negligible runtime but ~halves the
# image-build compile. Data-plane goat-relay keeps fat LTO (repo-root profile).
# Revert to `lto = true` / `codegen-units = 1` if a service shows a measured
# hot-path regression.
lto = "thin"
codegen-units = 16

[package]
name = "goat-fabric-health"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Fabric health + per-producer footprint meter for the goat fabric (ADR 1034)."
repository = "https://github.com/usareur-af/goatcore"

[dependencies]
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.13"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
