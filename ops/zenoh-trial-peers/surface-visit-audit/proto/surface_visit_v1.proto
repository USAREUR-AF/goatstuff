// SPDX-License-Identifier: Apache-2.0
//
// SurfaceVisitV1 — one authenticated request to a fenced web surface,
// attributed to a person, published onto ops/audit/surface/<surface>/<actor>.
//
// WHY THIS EXISTS, AND WHAT IT IS NOT. Hydra already records one consent grant
// per (person, client), which microscope reads to answer "has this person
// reached brief, and when last". That is a STANDING record with a moving
// timestamp: repeat visits collapse into one row, so it cannot answer "how many
// times" or "which pages". This message is the per-visit half. It does not
// replace the consent grant — the grant survives a gap in this stream, and this
// stream survives a revoked grant, which is the F-177 lesson applied to
// attribution: neither source can prove a negative on its own.
//
// SOURCE OF TRUTH IS THE DOOR, NOT THE APP. Every field here comes from
// oauth2-proxy's own request log, which is the only place that holds both the
// validated identity and the request line. Nothing is read from a header the
// client could set, and no application was modified to emit this — two of the
// three surfaces it was built for are static file servers with no code to
// modify.
//
// On-wire envelope: the bytes published are NOT a bare SurfaceVisitV1. They are
// the age-CIPHERTEXT of the protobuf-encoded message, encrypted to the operator
// age roster (40-dev-ca-operators.envrc) — `age(encode(SurfaceVisitV1))`, the
// same envelope OperatorActionV1 uses (operator-action-audit.md §7). Visit
// history is a record of what people read, so a mis-set read ACL must leak
// opaque ciphertext rather than a browsing trail. There is no plaintext field
// in this message; the encryption wraps the whole encoded body.
//
// This file is the CANONICAL schema. Any change MUST be mirrored field-for-
// field, tag-for-tag, in the emitter (src/main.rs) and in microscope's
// surface_visits adapter, or the wire breaks silently.

syntax = "proto3";

package goat.audit.surface.v1;

message SurfaceVisitV1 {
  // The PERSON, as oauth2-proxy validated them — the session email, never a
  // header the client supplied. Also the <actor> sub-key of
  // ops/audit/surface/<surface>/<actor>.
  string actor          = 1;
  // Which fenced surface: demogame | brief | dataflows | panoscope | ...
  // Equal to the surface's Hydra client_id, so a visit row joins to the
  // consent grant microscope already reads.
  string surface        = 2;
  // goatnet: the goatnet id
  string env            = 3;
  // Request path as served, query string stripped. A query can carry the
  // content of a search, which is a different and more sensitive thing than
  // the fact of a visit; this message records the latter.
  string path           = 4;
  // GET | POST | ...
  string method         = 5;
  // HTTP status the door returned. 200 is a served visit; 302 is the login
  // redirect that PRECEDES one, and is recorded because a burst of them with
  // no 200 following is what a broken door looks like from the outside.
  uint32 status         = 6;
  // Request duration in milliseconds, as the door measured it.
  uint32 duration_ms    = 7;
  // Host header the request arrived on — the FQDN, which distinguishes two
  // goatnets serving the same surface name.
  string host           = 8;
  // Emit time, unix epoch milliseconds, taken from the door's log line rather
  // than from read time. A line re-read after a restart keeps its original
  // instant; see the never-re-stamp rule in microscope's timefmt.
  int64  ts_unix_ms     = 9;
  // Which node's door emitted this. Two nodes serving one surface produce two
  // streams, and a roll-up must not silently merge them.
  string node           = 10;
}
