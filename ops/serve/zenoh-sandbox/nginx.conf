# zenoh-sandbox web — serves the static pages (index.html, community.html,
# /js/*.js, /css/*.css, /vendor/zenoh-ts/zenoh-ts.js). The /ws WebSocket is
# NOT handled here — Traefik routes PathPrefix(/ws) straight to the sandbox
# router; this container never sees it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The scripts and styles keep their names across releases (no content hash),
    # so the browser must revalidate them (ETag) on every load rather than cache.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # NEVER cache the HTML entry points, so the browser always re-fetches the
    # page and does not show a stale one after a redeploy.
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
