# zenoh-sandbox web — static SPA serve. Generated demo is a prerendered
# static site (nuxt generate), so plain file serving with an index fallback
# is enough. The /ws WebSocket is NOT handled here — Traefik routes
# PathPrefix(/ws) straight to the sandbox router; this container never sees it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed Nuxt assets; never cache the entry HTML.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
