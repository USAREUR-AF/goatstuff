# SPDX-License-Identifier: Apache-2.0
#
# Local-dev compose for the zenoh-sandbox — web app + router.
# No Node, no platform binary, no mesh. Works on Windows/Mac/Linux via Docker
# Desktop; the router Dockerfile bakes the remote_api plugin in at build time
# (download from zenoh-ts 1.9.0 release, SHA256-verified; supports amd64 + arm64).
#
# The app auto-detects localhost and connects to ws://localhost:10000
# (same as the standalone local kit — no Traefik, no /ws proxy needed).
#
# Quickstart:
#   docker compose -f ops/serve/zenoh-sandbox/docker-compose.dev.yml up --build
#   open http://localhost:8099
#
# First build downloads the remote_api plugin (~10 MB) and the Node build image.
# Subsequent starts are instant (all layers cached).
#
# Design: docs/design/zenoh-sandbox.md
# Web UX: docs/design/zenoh-sandbox-ux.md

services:
  zenoh-sandbox-router:
    build:
      context: .
      dockerfile: router/Dockerfile
    image: zenoh-sandbox-router:dev
    container_name: zenoh-sandbox-router-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"   # WebSocket — the browser app connects here
      - "127.0.0.1:8001:8000"     # REST plugin (ad-hoc GET; :8001 avoids clash with panoscope-dev-zenoh on :8000)

  zenoh-sandbox-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenoh-sandbox:dev
    container_name: zenoh-sandbox-web-dev
    depends_on:
      - zenoh-sandbox-router
    ports:
      - "127.0.0.1:8099:80"
