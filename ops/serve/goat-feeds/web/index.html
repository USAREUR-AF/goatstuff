<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric feeds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <div class="title">Fabric feeds</div>
      <div class="sub" id="site">…</div>
    </div>
  </div>
  <nav id="nav" aria-label="Sections">
    <a href="#feeds" data-view="feeds">Feeds</a>
    <a href="#request" data-view="request">New feed</a>
    <a href="#approvals" data-view="approvals" id="nav-approvals" hidden>Approvals <span class="count" id="approvals-count"></span></a>
    <a href="#tidy" data-view="tidy" id="nav-tidy" hidden>Tidy up <span class="count" id="tidy-count" hidden></span></a>
    <a href="#audit" data-view="audit">Audit</a>
  </nav>
  <div class="who" id="who"></div>
</header>

<main id="main">
  <p class="loading">Loading…</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<template id="tpl-feeds">
  <section class="view">
    <div class="view-head">
      <div>
        <h1>Feeds</h1>
        <p class="lede">An OUT feed sends a fabric topic, converted, to a system on the mesh. An IN feed receives a system's data and publishes it on the fabric.</p>
      </div>
      <div class="row"><a class="btn" href="#request?dir=in">Receive a system's data</a><a class="btn primary" href="#request?dir=out">Send a topic</a></div>
    </div>
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-filter="attention">Needs attention</button>
        <button class="chip" data-filter="mine">Mine</button>
        <button class="chip" data-filter="waiting">Waiting for approval</button>
        <button class="chip" data-filter="live">On</button>
        <button class="chip" data-filter="archived">Archived</button>
        <button class="chip" data-filter="all">All</button>
      </div>
      <input type="search" id="feed-search" placeholder="Search topic, system, address, owner" aria-label="Search feeds">
      <div class="seg viewseg" role="group" aria-label="View">
        <button type="button" data-view="list">List</button>
        <button type="button" data-view="flow">Flow</button>
      </div>
    </div>
    <div class="toolbar facets" id="facet-bar">
      <label>Site <select id="f-site" aria-label="Site"></select></label>
      <label>Receiving role <select id="f-role" aria-label="Receiving role"></select></label>
      <label>Group by <select id="f-group" aria-label="Group by">
        <option value="">Nothing</option><option value="site">Site</option><option value="region">Region</option>
        <option value="source">Sensor or sender</option><option value="dest_system">Receiving system</option>
        <option value="dest_role">Receiving role</option><option value="format">Format</option><option value="owner">Owner</option>
      </select></label>
      <span class="counts" id="f-counts"></span>
    </div>
    <div class="list" id="feed-list"></div>
    <div class="flow" id="feed-flow" hidden></div>
  </section>
</template>

<template id="tpl-request">
  <section class="view narrow">
    <div class="view-head">
      <div>
        <h1>New feed</h1>
        <p class="lede">You'll see before submitting whether it starts at once or waits for an approver.</p>
      </div>
    </div>
    <div class="seg dirseg" id="dir-seg" role="group" aria-label="Direction"></div>
    <ol class="steps" id="steps">
      <li data-step="1"></li><li data-step="2"></li><li data-step="3"></li><li data-step="4"></li>
    </ol>
    <div id="step-body"></div>
    <div class="step-nav">
      <button class="btn" id="step-back" type="button">Back</button>
      <span class="grow"></span>
      <button class="btn primary" id="step-next" type="button">Next</button>
    </div>
  </section>
</template>

<template id="tpl-approvals">
  <section class="view">
    <div class="view-head">
      <div>
        <h1>Approvals</h1>
        <p class="lede">Requests at this site waiting for a tactical or platform admin. Approving switches the feed on at once.</p>
      </div>
    </div>
    <div class="list" id="approval-list"></div>
  </section>
</template>

<template id="tpl-tidy">
  <section class="view">
    <div class="view-head">
      <div>
        <h1>Tidy up</h1>
        <p class="lede">Systems that have slipped out of the estate's organisation, each with its reason. Place a system in its site and function, archive one that is gone, or bring one back. Every change is in the audit log, and takes effect at once; promote it into the estate file later.</p>
      </div>
      <div class="row"><a class="btn" id="tidy-effective" href="/api/estate/effective" target="_blank" rel="noopener">Effective estate (JSON)</a></div>
    </div>
    <p class="hint rule" id="tidy-rule"></p>
    <div id="tidy-result" role="status" aria-live="polite"></div>
    <h2 id="tidy-items-head">To organise</h2>
    <div class="list" id="tidy-items"></div>
    <h2 class="tidy-h2">Archive a system</h2>
    <div class="toolbar"><label class="inline">System <select id="tidy-archive-pick" aria-label="System to archive"></select></label></div>
    <div id="tidy-archive-box"></div>
    <h2 class="tidy-h2" id="tidy-archived-head">Archived</h2>
    <div class="list" id="tidy-archived"></div>
  </section>
</template>

<template id="tpl-audit">
  <section class="view">
    <div class="view-head">
      <div>
        <h1>Audit</h1>
        <p class="lede">Every request, decision and change at this site, newest first.</p>
      </div>
    </div>
    <div class="table-wrap"><table class="audit"><thead><tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Feed</th><th>Detail</th></tr></thead><tbody id="audit-body"></tbody></table></div>
  </section>
</template>

<template id="tpl-feed">
  <section class="view">
    <a class="back" href="#feeds">← Feeds</a>
    <div class="feed-head" id="feed-head"></div>
    <div class="actions" id="feed-actions"></div>
    <div class="note-box" id="note-box" hidden>
      <label for="note-input" id="note-label">Note</label>
      <textarea id="note-input" rows="2"></textarea>
      <div class="row"><button class="btn primary" id="note-ok" type="button">Confirm</button><button class="btn" id="note-cancel" type="button">Cancel</button></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h2 id="flow-title">Delivery</h2>
        <dl class="stats" id="feed-stats"></dl>
        <div class="check">
          <button class="btn" id="check-btn" type="button">Check destination</button>
          <div id="check-result" class="check-result"></div>
        </div>
      </div>
      <div class="panel">
        <h2>Details</h2>
        <dl class="kv" id="feed-details"></dl>
      </div>
    </div>
    <div class="panel">
      <h2>Troubleshooting</h2>
      <div id="trouble"></div>
    </div>
    <div class="panel">
      <h2>Timeline</h2>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
