# trust-sandbox web — serves the static pages + reverse-proxies the orchestrator and
# Hydra. The browser never talks to zenohd/spire/coredns directly; everything it
# needs is same-origin behind localhost:8100.
#
#   /          → static pages (index, vision, concept, deep, glossary,
#                callback/login/consent .html; /js/*.js, /css/*.css)
#   /api/**    → orchestrator (the privileged broker)
#   /ws        → orchestrator websocket (live fabric viz, fed by the real observer)
#   /hydra/**  → Ory Hydra public (OIDC discovery, JWKS, /oauth2/token, /oauth2/auth)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The scripts and styles keep their names across releases (no content hash),
    # so the browser must revalidate them (ETag) on every load rather than cache.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # NEVER cache the HTML entry points, so the browser always re-fetches the
    # page. Without this the browser serves a stale index/vision/concept page
    # after a redeploy.
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Strip the /hydra prefix; Hydra advertises endpoints under the issuer path.
    location /hydra/ {
        proxy_pass http://hydra:4444/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
