# trust-sandbox SPIRE server — throwaway, single-host, in-volume datastore.
# ca_ttl long (bundle stable for the session) + SVID TTL short (rotation is the
# teaching surface). join_token node attestation + unix workload attestation.
server {
    bind_address       = "0.0.0.0"
    bind_port          = "8081"
    trust_domain       = "trust.sandbox"
    data_dir           = "/run/spire/shared/server-data"
    log_level          = "INFO"
    ca_ttl             = "168h"
    # The DEFAULT (node/agent) SVID TTL is long so the agent SVID survives a
    # brief restart — otherwise an expired node SVID forces re-attestation with
    # the single-use join token and the agent dies. The WORKLOAD SVID
    # rotates fast (60s, set per-entry in server-entry.sh) — that's the teaching
    # surface, decoupled from node-identity durability.
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/run/spire/shared/server-data/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    # Disk KeyManager so the CA keys persist across a server restart (a memory
    # KeyManager would mint a NEW CA on restart, invalidating every issued cert
    # and the router's trust bundle — F-202). down -v rolls a fresh CA.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/shared/server-data/keys.json"
        }
    }
}
