# trust-sandbox SPIRE agent — joins via a one-time token (written by the server
# entrypoint), exposes the Workload API socket on the shared volume, attests
# workloads by unix uid. insecure_bootstrap: sandbox skips trust-bundle pinning.
agent {
    data_dir           = "/run/spire/shared/agent-data"
    log_level          = "INFO"
    server_address     = "spire-server"
    server_port        = "8081"
    socket_path        = "/run/spire/shared/agent.sock"
    trust_domain       = "trust.sandbox"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    # Disk KeyManager so the agent's node key + SVID persist across a restart —
    # the agent then RECOVERS its identity instead of re-attesting with the
    # single-use join token (which would fail → restart loop, F-200). down -v
    # wipes this for a fresh attestation.
    KeyManager "disk" {
        plugin_data {
            directory = "/run/spire/shared/agent-data"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
