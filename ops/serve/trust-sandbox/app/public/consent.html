<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consent — trust sandbox</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0f14; color:#e7eef6;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .card { width:min(440px,92vw); background:linear-gradient(180deg,#11171f,#0e141b); border:1px solid #1e2935;
    border-radius:12px; padding:24px; text-align:center; }
  .tag { font-family: ui-monospace, monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#5f7384; }
  .err { color:#ff6b8b; font-size:12.5px; margin-top:12px; }
  .spin { color:#9bb0c2; font-size:13px; margin-top:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Ory · issuing your token</div>
    <div class="spin" id="msg">Granting consent and attaching your role claim…</div>
    <div class="err" id="err"></div>
  </div>
<script type="module">
  const params = new URLSearchParams(location.search)
  const challenge = params.get('consent_challenge')
  const err = document.getElementById('err')
  ;(async () => {
    if (!challenge) { err.textContent = 'Missing consent challenge.'; return }
    try {
      const r = await fetch('/api/oidc/consent', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ challenge }) })
      const j = await r.json()
      if (j.redirect_to) location.href = j.redirect_to
      else err.textContent = j.error || 'consent failed'
    } catch (e) { err.textContent = String(e) }
  })()
</script>
</body>
</html>
