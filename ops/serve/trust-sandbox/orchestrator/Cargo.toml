[package]
name = "trust-sandbox-orchestrator"
version = "0.1.0"
edition = "2021"
# 1.88: jsonwebtoken 10.4.0 is edition 2024 with MSRV 1.88.0. The Dockerfile
# builds on rust:1.90, but the declared floor must not claim more than it can do.
rust-version = "1.88"
license = "Apache-2.0"
description = "The privileged broker for the trust-sandbox zero-trust identity playground: owns a throwaway CA, fetches SPIRE SVIDs, validates Ory/Hydra JWTs, resolves + rewrites private DNS, and opens real mTLS Zenoh sessions to exercise the per-write ACL. docs/design/trust-sandbox.md"

# Standalone crate — NOT part of the repo's goat-relay workspace (its own
# lockfile; the tee-up's "fresh crate" note). The empty table detaches it.
[workspace]

[[bin]]
name = "trust-sandbox-orchestrator"
path = "src/main.rs"

[dependencies]
# Native Zenoh client — opens REAL mTLS sessions holding a chosen client cert,
# the thing a browser cannot do (the whole reason this broker exists). Pinned to
# the fleet zenoh version per docs/design/zenoh-version-pinning.md.
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Throwaway CA + leaf minting with the URI-SAN grammar. 0.13 gives self_signed /
# signed_by + Ia5String SAN types (this code is written against the 0.13.2 API).
rcgen = "=0.13.2"
# features: v10 moved the algorithm backends behind a feature and its DEFAULT
# ("use_pem") selects none. Without one, CryptoProvider::from_crate_features()
# yields a sentinel whose verifier panics -- cargo check stays clean and
# /api/mint + /api/revoke die at runtime on the first decode(). See #226 review.
# Keep the same JWT API and validation policy while avoiding the legacy
# RustCrypto curve dependencies affected by RUSTSEC-2026-0387. This is the
# ordinary AWS-LC backend; no FIPS claim is made for this application.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
x509-parser = "0.16"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
base64 = "0.22"
