<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern 2 — Point-to-point ICDs</title>
<style>
  :root{
    --bg:#0a0e14;--surface:#111827;--border:#1e2533;
    --text:#c8ccd4;--muted:#8b95a5;
    --accent:#00e5ff;--ok:#4caf50;--warn:#fbbf24;--danger:#f87171;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow:hidden;}
  #wrap{width:1000px;height:640px;display:flex;flex-direction:column;}
  #controls{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(17,24,39,.6);flex-wrap:wrap;}
  .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  button{background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;min-width:42px;}
  button.active{background:rgba(0,229,255,.12);border-color:var(--accent);color:var(--accent);}
  button:hover{border-color:var(--accent);}
  #stage{flex:1;position:relative;}
  svg{width:100%;height:100%;display:block;}
  #counters{position:absolute;top:14px;right:18px;display:flex;gap:14px;background:rgba(17,24,39,.85);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12px;}
  #counters .b{display:flex;flex-direction:column;}
  #counters .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  #counters .v{font-size:18px;font-weight:700;color:var(--accent);margin-top:2px;}
  #counters .v.danger{color:var(--danger);}
  #footer{padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);background:rgba(17,24,39,.6);}
  #footer strong{color:var(--text);}
  .node{stroke:var(--accent);fill:rgba(0,229,255,.18);stroke-width:1.5;}
  .lbl{fill:var(--text);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .lbl-small{fill:var(--muted);font-size:10px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .wire{stroke:var(--border);stroke-width:1;fill:none;opacity:.55;}
  .packet{r:3.5;fill:var(--accent);}
</style>
</head>
<body>
<div id="wrap">
  <div id="controls">
    <span class="label">Systems</span>
    <button class="n active" data-n="2">2</button>
    <button class="n" data-n="3">3</button>
    <button class="n" data-n="4">4</button>
    <button class="n" data-n="6">6</button>
    <button class="n" data-n="8">8</button>
    <button class="n" data-n="12">12</button>
  </div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="counters">
      <div class="b"><span class="k">Systems (N)</span><span class="v" id="n-val">2</span></div>
      <div class="b"><span class="k">Bilateral wires</span><span class="v" id="w-val">2</span></div>
      <div class="b"><span class="k">Each wire = its own ICD</span><span class="v danger" id="icd-val">Yes</span></div>
    </div>
  </div>
  <div id="footer">
    <span><strong>Point-to-point ICDs:</strong> every pair of systems negotiates a bespoke wire. Wires grow as <em>N×(N−1)</em>. Every new system multiplies the integration problem for everyone already on the network.</span>
  </div>
</div>

<script>
(function(){
  'use strict';
  var svg=document.getElementById('svg');
  var nVal=document.getElementById('n-val');
  var wVal=document.getElementById('w-val');
  var n=2;

  function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
  function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}

  var timers=[],loopTimer=null;
  function clearTimers(){timers.forEach(clearTimeout);timers=[];Array.from(svg.querySelectorAll('.packet')).forEach(function(p){p.parentNode&&p.parentNode.removeChild(p);});}

  function animPacket(pathEl,delay,duration){
    var t=setTimeout(function(){
      var len=pathEl.getTotalLength();
      var dot=ns('circle');dot.setAttribute('r',3.5);dot.setAttribute('class','packet');svg.appendChild(dot);
      var start=performance.now();
      function frame(now){
        var t=Math.min(1,(now-start)/duration);
        var pt=pathEl.getPointAtLength(len*t);
        dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
        if(t<1)requestAnimationFrame(frame);
        else dot.parentNode&&dot.parentNode.removeChild(dot);
      }
      requestAnimationFrame(frame);
    },delay);
    timers.push(t);
  }

  function positions(N){
    var cx=500, cy=270, r=Math.min(180+N*4, 210);
    var pts=[];
    for(var i=0;i<N;i++){
      var a=-Math.PI/2 + i*2*Math.PI/N;
      pts.push({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)});
    }
    return pts;
  }

  function render(){
    clear();clearTimers();if(loopTimer){clearInterval(loopTimer);loopTimer=null;}
    var pts=positions(n);
    var pairs=[];
    // Draw all bilateral wires
    var paths=[];
    for(var i=0;i<n;i++){
      for(var j=i+1;j<n;j++){
        var a=pts[i], b=pts[j];
        // Slight curve based on (i,j) so overlapping lines are distinguishable
        var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        var dx=b.x-a.x, dy=b.y-a.y;
        var nrm=Math.sqrt(dx*dx+dy*dy);
        var perp={x:-dy/nrm, y:dx/nrm};
        var bow=Math.min(60, 10 + 6*(j-i));
        var sign=((i+j)%2===0)?1:-1;
        var cpx=mx+perp.x*bow*sign, cpy=my+perp.y*bow*sign;
        var d='M '+a.x+' '+a.y+' Q '+cpx+' '+cpy+' '+b.x+' '+b.y;
        var p=ns('path');p.setAttribute('d',d);p.setAttribute('class','wire');svg.appendChild(p);
        paths.push(p);
        pairs.push([i,j]);
      }
    }
    // Draw nodes ON TOP of wires
    pts.forEach(function(p,i){
      var c=ns('circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',26);c.setAttribute('class','node');svg.appendChild(c);
      var t=ns('text');t.setAttribute('x',p.x);t.setAttribute('y',p.y-2);t.setAttribute('class','lbl');t.textContent='S'+(i+1);svg.appendChild(t);
      var t2=ns('text');t2.setAttribute('x',p.x);t2.setAttribute('y',p.y+12);t2.setAttribute('class','lbl-small');t2.textContent='ICD ✕ '+(n-1);svg.appendChild(t2);
    });

    var wires=n*(n-1)/2; // undirected pairs (each ICD = one bilateral relation)
    nVal.textContent=n;
    wVal.textContent=wires;
    if(wires>=15) wVal.className='v danger'; else wVal.className='v';

    // Animate: each cycle, every wire emits a packet in a random direction
    function emit(){
      paths.forEach(function(p,k){
        var delay = (k*60) % 1800;
        animPacket(p, delay, 1100);
      });
    }
    emit();
    loopTimer=setInterval(emit, 2200);
  }

  document.querySelectorAll('button.n').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('button.n').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      n=parseInt(b.dataset.n,10);
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
