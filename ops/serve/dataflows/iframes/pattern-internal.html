<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern 1 — Internal-only</title>
<style>
  :root {
    --bg:#0a0e14; --surface:#111827; --border:#1e2533;
    --text:#c8ccd4; --muted:#8b95a5;
    --accent:#00e5ff; --ok:#4caf50; --warn:#fbbf24; --danger:#f87171;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow:hidden;}
  #wrap{width:1000px;height:640px;display:flex;flex-direction:column;}
  #controls{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(17,24,39,.6);}
  .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  button{background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;}
  button.active{background:rgba(0,229,255,.12);border-color:var(--accent);color:var(--accent);}
  button:hover{border-color:var(--accent);}
  #stage{flex:1;position:relative;}
  svg{width:100%;height:100%;display:block;}
  #footer{padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);background:rgba(17,24,39,.6);}
  #footer strong{color:var(--text);}
  .device-box{fill:rgba(0,229,255,.04);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:0;rx:12;}
  .module{stroke:var(--border);stroke-width:1.2;}
  .module.sensor{fill:rgba(0,229,255,.18);stroke:var(--accent);}
  .module.processor{fill:rgba(251,191,36,.18);stroke:var(--warn);}
  .module.actuator{fill:rgba(76,175,80,.18);stroke:var(--ok);}
  .lbl{fill:var(--text);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .lbl-small{fill:var(--muted);font-size:10px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .lbl-big{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .wire{stroke:var(--accent);stroke-width:1.4;fill:none;opacity:.55;}
  .outside-box{fill:rgba(31,41,55,.4);stroke:var(--border);stroke-width:1;stroke-dasharray:4 4;rx:8;}
  .outside-box.greyed{opacity:.45;}
  .outside-label{fill:var(--muted);font-size:11px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;opacity:.7;}
  .packet{r:4;fill:var(--accent);}
  .nope-line{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:5 5;opacity:0;}
  .nope-line.visible{opacity:.65;animation:flash 1.2s ease-out;}
  @keyframes flash {0%{opacity:0}30%{opacity:.9}100%{opacity:.65}}
  .nope-text{fill:var(--danger);font-size:10px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;opacity:0;letter-spacing:.05em;}
  .nope-text.visible{opacity:.85;}
</style>
</head>
<body>
<div id="wrap">
  <div id="controls">
    <span class="label">View</span>
    <button class="view active" data-view="closed">Closed device</button>
    <button class="view" data-view="opened">Show the outside world</button>
  </div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="footer" id="legend">
    <span id="legend-text"><strong>Internal-only:</strong> data flows sensor → processor → actuator inside the same box. Nothing leaves. Fast, simple — invisible to everyone else.</span>
  </div>
</div>

<script>
(function(){
  'use strict';
  var svg=document.getElementById('svg');
  var legendTextEl=document.getElementById('legend-text');
  var view='closed';

  function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
  function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}

  var packetTimers=[];
  function clearPackets(){packetTimers.forEach(clearTimeout);packetTimers=[];Array.from(svg.querySelectorAll('.packet')).forEach(function(p){p.parentNode&&p.parentNode.removeChild(p);});}

  function animatePacket(pathEl,delay,duration){
    var t=setTimeout(function(){
      var len=pathEl.getTotalLength();
      var dot=ns('circle');dot.setAttribute('r',4);dot.setAttribute('class','packet');svg.appendChild(dot);
      var start=performance.now();
      function frame(now){
        var t=Math.min(1,(now-start)/duration);
        var pt=pathEl.getPointAtLength(len*t);
        dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
        if(t<1)requestAnimationFrame(frame);
        else dot.parentNode&&dot.parentNode.removeChild(dot);
      }
      requestAnimationFrame(frame);
    },delay);
    packetTimers.push(t);
  }

  function rect(x,y,w,h,cls,rx){var r=ns('rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('class',cls);r.setAttribute('rx',rx||8);svg.appendChild(r);return r;}
  function text(x,y,cls,str){var t=ns('text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class',cls);t.textContent=str;svg.appendChild(t);return t;}
  function path(d,cls,id){var p=ns('path');p.setAttribute('d',d);p.setAttribute('class',cls);if(id)p.setAttribute('id',id);svg.appendChild(p);return p;}

  var loopTimer=null;

  function render(){
    clear();clearPackets();if(loopTimer){clearInterval(loopTimer);loopTimer=null;}

    // Center device box
    var cx=500,cy=270;
    var bx=210,by=170,bw=580,bh=240;

    rect(bx,by,bw,bh,'device-box',14);
    text(cx,by+22,'lbl-big','THE DEVICE');

    // Three modules inside
    var m1x=bx+90, m2x=cx, m3x=bx+bw-90;
    var my=cy+30;
    rect(m1x-60,my-40,120,70,'module sensor',8);
    rect(m2x-60,my-40,120,70,'module processor',8);
    rect(m3x-60,my-40,120,70,'module actuator',8);
    text(m1x,my-12,'lbl','Sensor');
    text(m1x,my+12,'lbl-small','reads world');
    text(m2x,my-12,'lbl','Processor');
    text(m2x,my+12,'lbl-small','decides');
    text(m3x,my-12,'lbl','Actuator');
    text(m3x,my+12,'lbl-small','acts on world');

    // Internal wires (paths)
    var p1=path('M '+(m1x+60)+' '+my+' L '+(m2x-60)+' '+my,'wire','int-1');
    var p2=path('M '+(m2x+60)+' '+my+' L '+(m3x-60)+' '+my,'wire','int-2');
    // Feedback wire: actuator → sensor (closed loop)
    var fb='M '+m3x+' '+(my+30)+' Q '+m3x+' '+(my+90)+' '+cx+' '+(my+90)+' Q '+m1x+' '+(my+90)+' '+m1x+' '+(my+30);
    var p3=path(fb,'wire','int-3');

    if(view==='opened'){
      // Show the outside world: greyed peers around with NO connections
      var peers=[
        {x:90,y:80,name:'C2 dashboard'},
        {x:880,y:80,name:'Sister sensor'},
        {x:90,y:460,name:'Archive / replay'},
        {x:880,y:460,name:'Analyst'}
      ];
      peers.forEach(function(p){
        rect(p.x-70,p.y-22,140,44,'outside-box greyed',8);
        text(p.x,p.y,'outside-label',p.name);
        // Dashed red "nope" line from device edge towards each peer
        var startX,startY;
        if(p.x<cx){startX=bx;startY=p.y<cy?by:by+bh;}
        else{startX=bx+bw;startY=p.y<cy?by:by+bh;}
        path('M '+startX+' '+startY+' L '+p.x+' '+p.y,'nope-line visible');
        var midX=(startX+p.x)/2, midY=(startY+p.y)/2;
        text(midX,midY-8,'nope-text visible','no wire');
      });
      legendTextEl.innerHTML='<strong>Internal-only:</strong> the rest of the world simply has no wire to this device. Whatever it learns, it keeps to itself.';
    } else {
      legendTextEl.innerHTML='<strong>Internal-only:</strong> data flows sensor → processor → actuator inside the same box. Nothing leaves. Fast, simple — invisible to everyone else.';
    }

    function emit(){
      animatePacket(p1,0,800);
      animatePacket(p2,800,800);
      animatePacket(p3,1700,1200);
    }
    emit();
    loopTimer=setInterval(emit,3200);
  }

  document.querySelectorAll('button.view').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('button.view').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      view=b.dataset.view;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
