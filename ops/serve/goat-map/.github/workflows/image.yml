# SPDX-License-Identifier: Apache-2.0
#
# Multi-arch image build. arm64 matters: every current target is a Jetson Orin
# (aarch64), and the Orins run Ubuntu-for-Tegra 22.04, so nothing built against
# a newer glibc floor can execute there.
#
# Owner-derived image path — pushing to a hard-coded org 403s from a fork or a
# renamed org.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/goat-map
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: report the digest to pin
        # A goatnet profile should reference the list digest, not a tag —
        # a tag on a multi-arch image can resolve per-arch and drift.
        run: |
          echo "Pin this in deploy/goatnets/<goatnet>.env:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "GOATMAP_IMAGE=ghcr.io/${{ steps.owner.outputs.value }}/goat-map@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
