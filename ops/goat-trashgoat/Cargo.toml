# goat-trashgoat — operator-controlled chaos publisher per
# docs/design/trashgoat.md (Block 92).
#
# Single small binary. Runs as an mTLS Zenoh client peer of the trial
# router. Subscribes to ops/trashgoat/control/** for spec lifecycle
# events the portal publishes, maintains an in-memory spec table, runs
# active specs per their cadence (publishing onto trashgoat/<slug>/...),
# and issues z_delete against every key a spec has published when a
# cleanse command lands.
#
# Workspace: deliberately NOT a member of the panoscope, goat-relay, or
# synth-vendor workspaces — own-workspace per the synth-vendor +
# audit-subscriber pattern. Build isolation + trust-domain separation.
#
# Pinned zenoh version per docs/design/zenoh-version-pinning.md.

[workspace]
resolver = "2"

[profile.release]
# CI-speed: thin LTO + parallel codegen (was fat + cu=1). These are IO-bound
# services where whole-program LTO buys negligible runtime but ~halves the
# image-build compile. Data-plane goat-relay keeps fat LTO (repo-root profile).
# Revert to `lto = true` / `codegen-units = 1` if a service shows a measured
# hot-path regression.
lto = "thin"
codegen-units = 16

[package]
name = "goat-trashgoat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Operator-controlled chaos publisher for the goat fabric. Block 92 per docs/design/trashgoat.md."
repository = "https://github.com/usareur-af/goatcore"

[dependencies]
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
