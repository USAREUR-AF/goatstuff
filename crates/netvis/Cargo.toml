[package]
name = "netvis"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Mesh reachability at three levels: group→group, the machines behind a group pair, and the rules behind a machine pair"

[dependencies]
# The resolver is shared with microscope's reachability graph on purpose — the
# operator's requirement was that the two surfaces share an approach or a
# library, and a second implementation of "what does this policy permit" is
# exactly how two surfaces come to disagree about the same goatnet.
panoscope-core = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
