[package]
name = "microscope"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Admin-gated per-entity behavior lens: capability + activity timeline + denials across every identity layer (ADR 1090)"

[dependencies]
panoscope-core = { workspace = true }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Timeline timestamps arrive in three shapes from five upstreams and have to
# merge into one ordered stream; hand-comparing strings is what produced the
# portal-audit ordering bug. Already in the tree via panoscope-core, and the
# same pin three sibling crates use.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
