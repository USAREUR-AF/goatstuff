[package]
name = "stethoscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "stethoscope — passive-default diagnostic surface for the goat-net trial fabric. Block 90 Phase B binary."
default-run = "stethoscope"

[[bin]]
name = "stethoscope"
path = "src/main.rs"

[dependencies]
panoscope-core = { workspace = true }
stethoscope-checks = { path = "../stethoscope-checks" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures = "0.3"
html-escape = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
tower = "0.5"
async-trait = "0.1"
