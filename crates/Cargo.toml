# Cargo workspace for the inspection surfaces:
#   - stethoscope-checks/  Check trait + registry + the checks
#   - stethoscope/         binary — axum + SSE + server-rendered diagnosis page
#   - flashlight-analytics/ audit-tail analytics
#   - microscope/          one peer in detail
#   - netvis/              the mesh ACL as a picture
#
# Every surface composes `panoscope-core` from the goatcore repository, pinned
# by tag below. Bump the tag deliberately; `cargo update -p panoscope-core`
# after changing it.

[workspace]
resolver = "2"
members = [
    "stethoscope-checks",
    "stethoscope",
    "flashlight-analytics",
    "microscope",
    "netvis",
]

[workspace.dependencies]
panoscope-core = { git = "https://github.com/usareur-af/goatcore", rev = "69f4a745026457f7382fe54038e8df08dd5aecd9" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# Finding F-614: the published zenoh-link-tls shares one TLS stream between
# its read and write tasks. This patched 1.9.0 copy fixes that; every other
# zenoh crate stays on the published =1.9.0. Remove with the copy (see its
# README.md) once a zenoh release ships the fix.
[patch.crates-io]
zenoh-link-tls = { path = "../vendor/zenoh-link-tls" }
