[package]
name = "stethoscope-checks"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Check trait + plugin registry + the three Phase B passive checks (registration, schema-body, flow-rate) for stethoscope per docs/design/stethoscope.md."

[dependencies]
panoscope-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
prost-reflect = "0.14"
prost-types = "0.13"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
