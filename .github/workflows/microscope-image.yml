name: microscope-image
# Builds crates/microscope/Dockerfile and publishes to
# ghcr.io/usareur-af/microscope. Multi-arch (amd64 + arm64) per the
# panoscope-image workflow shape — the image runs on nova-a (Tegra
# arm64) and any future amd64 host.
#
# Build body: .github/workflows/_image-build.yml (shared).

on:
  push:
    branches: [main]
    paths:
      - 'crates/panoscope-core/**'
      - 'crates/microscope/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'docs/design-system/colors_and_type.css'
      - 'docs/design-system/components.css'
      - '.github/workflows/microscope-image.yml'
    tags: ['microscope/v*']
  pull_request:
    paths:
      - 'crates/panoscope-core/**'
      - 'crates/microscope/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'docs/design-system/colors_and_type.css'
      - 'docs/design-system/components.css'
      - '.github/workflows/microscope-image.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: microscope
      tag_prefix: microscope
      file: crates/microscope/Dockerfile
