name: transform-shim

# Build, test and lint the format transformer shim
# (docs/design/format-transformers.md). The crate takes the goat-transformers
# engine as a git dependency at the commit in ops/xf/goat-transformers.ref and
# loads the pack bundle beside it, so a change to the pin or to the bundle
# tooling under ops/xf runs this too.

on:
  workflow_dispatch:  # the weekly path-filtered run starts it on main
  pull_request:
    paths:
      - 'ops/zenoh-shims/transform-shim/**'
      - 'ops/xf/**'
      - '.github/workflows/transform-shim.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ops/zenoh-shims/transform-shim
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/zenoh-shims/transform-shim/target
          key: ${{ runner.os }}-cargo-transform-shim-${{ hashFiles('ops/zenoh-shims/transform-shim/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-transform-shim-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: the example route table loads
        run: |
          ./target/debug/transform-shim --config config.example.json --bundle bundle \
            --endpoint tcp/127.0.0.1:7447 --check

      - name: both pack bundles match their manifests
        working-directory: .
        run: |
          python3 ops/xf/bundle.py check ops/zenoh-shims/transform-shim/bundle
          python3 ops/xf/bundle.py check ops/serve/goat-map/xf-bundle
