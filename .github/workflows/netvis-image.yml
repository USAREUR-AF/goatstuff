name: netvis-image
# Builds crates/netvis/Dockerfile and publishes to ghcr.io/<repo owner>/netvis
# — REGISTRY_IMAGE is resolved per-job from GITHUB_REPOSITORY_OWNER below, so
# a fork publishes to itself. (This comment used to name ghcr.io/usareur-af
# hard, which the code two dozen lines down has never done; the live pin is
# ghcr.io/usareur-af/netvis.) Multi-arch (amd64 + arm64) per the panoscope-image
# workflow shape — the image runs on nova-a (Tegra arm64) and any amd64 host.
#
# Build body: .github/workflows/_image-build.yml (shared).

on:
  push:
    branches: [main]
    paths:
      - 'crates/panoscope-core/**'
      - 'crates/netvis/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'docs/design-system/colors_and_type.css'
      # doctrine.rs compiles these in — a taxonomy edit changes the binary.
      - 'ops/ansible/netbird_acl_taxonomy.yml'
      - 'ops/ansible/netbird_acl_matrix.yml'
      - '.github/workflows/netvis-image.yml'
    tags: ['netvis/v*']
  pull_request:
    paths:
      - 'crates/panoscope-core/**'
      - 'crates/netvis/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'docs/design-system/colors_and_type.css'
      # doctrine.rs compiles these in — a taxonomy edit changes the binary.
      - 'ops/ansible/netbird_acl_taxonomy.yml'
      - 'ops/ansible/netbird_acl_matrix.yml'
      - '.github/workflows/netvis-image.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: netvis
      tag_prefix: netvis
      file: crates/netvis/Dockerfile
