name: panoscope-frontend-test

# Playwright e2e for the panoscope web pages. Path-filtered so
# only frontend-touching PRs pay the runtime. The e2e spec mocks the
# Rust backend end-to-end (WebSocket via addInitScript, REST via
# page.route) so this job does not depend on a built panoscope binary
# or a live Zenoh fabric; it's a pure frontend gate against the click-
# rhythm regression class (search-overlay desync + multi-selection
# collapse trap). See ops/panoscope/frontend/tests/. The pages are plain
# JavaScript served as files (ops/panoscope/frontend/web/); there is no
# typecheck or build step, and npm installs only @playwright/test.

on:
  # A guard, not a publisher: it runs on the pull request, and a squash merge puts
  # the reviewed diff on main unchanged.
  pull_request:
    paths:
      - 'ops/panoscope/frontend/**'
      - '.github/workflows/panoscope-frontend-test.yml'

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ops/panoscope/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ops/panoscope/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e spec
        run: npx playwright test --reporter=list

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: ops/panoscope/frontend/playwright-report/
          retention-days: 7
