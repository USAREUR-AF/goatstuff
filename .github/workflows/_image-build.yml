name: _image-build

# The ONE multi-arch image build. Every `*-image.yml` in this directory is a
# short stub that declares its triggers and any test or change-detection job,
# then calls this workflow. Previously the body below was copied into 36
# files in three slightly different generations; a fix to one (an action pin,
# the mirror step, the manifest shape) reached the others only if someone
# remembered. Now it lives once.
#
# What it does, per call:
#   - native linux/amd64 on ubuntu-24.04 and native linux/arm64 on
#     ubuntu-24.04-arm (the fleet runs x86 mini PCs and Tegra Orins)
#   - on pull_request: builds only, pushes nothing
#   - otherwise: pushes each arch by digest, then combines them into one
#     multi-arch index tagged
#         :latest            (main branch only)
#         :sha-<short>       (every build)
#         :v<semver>         (on a `<tag_prefix>/v<semver>` tag)
#     under ghcr.io/<repo owner, lowercased>/<image_name>
#
# Callers pass `secrets: inherit` and a job-level `permissions:` of
# contents: read + packages: write. Concurrency and path filters stay in the
# caller, so an edit to one component still rebuilds one image, not 36.

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name under the GHCR namespace (e.g. goat-mesh-health)
        required: true
        type: string
      tag_prefix:
        description: Release-tag prefix; a `<tag_prefix>/v1.2.3` tag publishes :v1.2.3
        required: true
        type: string
      context:
        description: Docker build context
        type: string
        default: '.'
      file:
        description: Dockerfile path (empty = <context>/Dockerfile)
        type: string
        default: ''
      target:
        description: Dockerfile build stage (empty = final stage)
        type: string
        default: ''
      title:
        description: org.opencontainers.image.title (empty = image_name)
        type: string
        default: ''
      description:
        description: org.opencontainers.image.description
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr rejects uppercase, so the owner is lowercased here rather than
      # hardcoded — each repo publishes to its OWN namespace.
      - name: Resolve self-referential registry namespace (lowercased)
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}" >> "$GITHUB_ENV"
          echo "IMAGE_TITLE=${{ inputs.title != '' && inputs.title || inputs.image_name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Base images by role (ADR 1220): every BASE_<ROLE> argument the
      # Dockerfile declares, from ops/base-images/<role>/Dockerfile. In this
      # repository those are the public defaults; an overlay's build reads its
      # own copies of the same files.
      - name: Base image build arguments
        id: bases
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.file }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          f="${DOCKERFILE:-$CONTEXT/Dockerfile}"
          args=(args --dockerfile "$f" --github-output)
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          python3 ops/base-images/base-images.py "${args[@]}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.bases.outputs.build_args }}
          labels: |
            org.opencontainers.image.base.name=${{ steps.bases.outputs.base_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ inputs.description }}
          cache-from: type=gha,scope=${{ inputs.tag_prefix }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.tag_prefix }}-${{ matrix.arch }}
          outputs: |
            type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: digests-${{ inputs.image_name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve self-referential registry namespace (lowercased)
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.image_name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=match,pattern=${{ inputs.tag_prefix }}/v(.*),group=1,prefix=v

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "${{ env.REGISTRY_IMAGE }}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:sha-$(git rev-parse --short HEAD)
