name: topology-stock-zenoh
# Runs goat-topology against stock upstream Zenoh routers, with no goat
# component, no goat file and no TLS: the README's quick start, exactly.
#
# Builds the image from this tree, starts ops/goat-topology/example/compose.yaml
# (three eclipse/zenoh:1.9.0 routers pinned by digest, one publisher per router,
# one serve) with GOAT_TOPOLOGY_IMAGE pointing at that image, and runs
# example/check.sh, which fails unless the page shows the three routers, all
# reporting, three links, no read error and no critical or warning finding.
# Because CI runs the same commands the README gives, the README cannot drift
# from what works.
#
# docs/design/zenoh-topology-surface.md §2.1a.

on:
  push:
    branches: [main]
    paths:
      - 'ops/goat-topology/**'
      - '.github/workflows/goat-topology-stock-zenoh.yml'
  pull_request:
    paths:
      - 'ops/goat-topology/**'
      - '.github/workflows/goat-topology-stock-zenoh.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build the goat-topology image from this tree
        run: docker build -f ops/goat-topology/Dockerfile -t goat-topology:ci .
      - name: start the example (stock eclipse/zenoh routers)
        working-directory: ops/goat-topology/example
        env:
          GOAT_TOPOLOGY_IMAGE: goat-topology:ci
        run: docker compose up -d
      - name: check the page
        working-directory: ops/goat-topology/example
        env:
          GOAT_TOPOLOGY_IMAGE: goat-topology:ci
        run: ./check.sh 180
      - name: logs
        if: always()
        working-directory: ops/goat-topology/example
        env:
          GOAT_TOPOLOGY_IMAGE: goat-topology:ci
        run: |
          docker compose ps
          docker compose logs --no-color --tail 40
          docker compose down
