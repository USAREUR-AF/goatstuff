# The landing page: site/, plus the files build.py copies from the tree, published to
# GitHub Pages.
#
# site/build.py fails when a status chip disagrees with docs/RELEASE-CONTENTS.md, the
# figure is stale, a placeholder is left, or a command box is cut off at 1440 or 390 px. A pull request
# that touches the page runs the check; a push to main also deploys, once the
# repository's Pages source is set to "GitHub Actions". Until then the deploy job
# is skipped, not failed.
name: pages
on:
  # Every path the page copies or checks is in both lists, so a change to a
  # capture, a status row or the file behind the hero fails before the merge.
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'docs/figures/**'
      - 'docs/RELEASE-CONTENTS.md'
      - 'ops/goat-topology/docs/graph-dark.png'
      - 'ops/zenoh-trial-peers/synth-vendor/demo-roster.json'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'docs/figures/**'
      - 'docs/RELEASE-CONTENTS.md'
      - 'ops/goat-topology/docs/graph-dark.png'
      - 'ops/zenoh-trial-peers/synth-vendor/demo-roster.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy from the tree, check the numbers and the boxes
        run: python3 -I site/build.py
      - name: Leave out what is not part of the page
        run: rm -rf site/.preview site/build.py site/figure.py site/fitcheck.py site/README.md site/.gitignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # Pages is set up by a repository owner. Until it is, there is nothing to
      # deploy to, so the deploy job does not run.
      - name: Is Pages set up to deploy from GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" -q .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set to deploy from GitHub Actions; the page was checked, not deployed."
          fi
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
