name: topology-image
# Builds ops/goat-topology/Dockerfile — the goat-topology
# meter (Rust + tokio + eclipse-zenoh + prost) — and publishes to
# ghcr.io/usareur-af/goat-topology.
#
# Per docs/design/topology-surface.md + ADR 1034: the participant-visible
# network-health surface (the "Reveal" pillar of the QoS design, ADR 1033). A
# normal mTLS Zenoh client peer that meters ** and publishes ops/fabric/health
# + ops/fabric/footprint; persists nothing. Builds independently of the zenoh
# router + audit-subscriber images.
#
# Per-arch native build + manifest combine, mirroring audit-subscriber-image.yml:
#   - linux/amd64 on ubuntu-24.04
#   - linux/arm64 on ubuntu-24.04-arm (GitHub-hosted arm64 runner)
#
# The image runs on nova-a (Tegra arm64) for the trial fabric and on any
# x86 mgmt-host for production.
#
# Tag scheme:
#   - On main push:                   :latest + :sha-<short>
#   - On topology/v* tag:        :<tag-name>
#   - On any build:                   :sha-<short>
#
# Build body: .github/workflows/_image-build.yml (shared).

on:
  push:
    branches: [main]
    paths:
      - 'ops/goat-topology/**'
      # The design-system CSS is include_str!'d into the binary, so a change
      # there must rebuild this image or the surface serves stale tokens.
      - 'docs/design-system/colors_and_type.css'
      - 'docs/design-system/components.css'
      - '.github/workflows/goat-topology-image.yml'
    tags: ['topology/v*']
  pull_request:
    paths:
      - 'ops/goat-topology/**'
      # The design-system CSS is include_str!'d into the binary, so a change
      # there must rebuild this image or the surface serves stale tokens.
      - 'docs/design-system/colors_and_type.css'
      - 'docs/design-system/components.css'
      - '.github/workflows/goat-topology-image.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Runs BEFORE the build, and the build depends on it. A test that runs
    # nowhere is worse than no test — it looks like coverage and provides none
    #. These are the assertions that hold the design honest: the read
    # path does no work, a quiet fabric keeps its ETag, the payload stays flat
    # in client count, every finding reads cold, and the page is structurally a
    # document rather than a bag of bytes with the right words in it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: cargo test — engine, store, projection, assets
        working-directory: ops/goat-topology
        run: cargo test --locked
      - name: cargo clippy
        working-directory: ops/goat-topology
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo fmt
        working-directory: ops/goat-topology
        run: cargo fmt --check

  image:
    needs: ["test"]
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: goat-topology
      tag_prefix: topology
      file: ops/goat-topology/Dockerfile
      description: "Fabric health + per-producer footprint meter (ADR 1034)"
